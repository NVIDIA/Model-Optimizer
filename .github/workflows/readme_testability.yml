name: README Testability Advice

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "**/README*.md"
      - "**/readme*.md"

concurrency:
  group: readme-testability-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  assess:
    if: >-
      github.event.pull_request.user.type != 'Bot' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    outputs:
      has_proposal: ${{ steps.assess.outputs.structured_output != '' }}
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REVIEWED_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # The privileged workflow reads the PR through the API; never check out PR code.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Test proposal publishing rules
        run: node --test .github/scripts/readme_testability.test.cjs

      - name: Check current head
        id: head
        run: |
          CURRENT_SHA=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid --jq .headRefOid)
          if [ "$CURRENT_SHA" = "$REVIEWED_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Assess README testability
        if: steps.head.outputs.current == 'true'
        id: assess
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS: "1"
          DISABLE_PROMPT_CACHING: "1"
        with:
          github_token: ${{ github.token }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --tools "Read,Grep,Glob,Bash"
            --allowedTools "Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh api:*),Bash(git diff:*),Bash(git show:*)"
            --disallowedTools "Edit,Write,NotebookEdit,Task"
            --max-turns 16
            --model "${{ vars.CLAUDE_MODEL }}"
            --json-schema '{"type":"object","properties":{"needs_changes":{"type":"boolean"},"proposal":{"type":"string"}},"required":["needs_changes","proposal"],"additionalProperties":false}'
          prompt: |
            Assess README testability for repository ${{ github.repository }},
            PR ${{ github.event.pull_request.number }},
            head commit ${{ github.event.pull_request.head.sha }}.
            Follow .github/prompts/readme_testability.md from this trusted base checkout.
            Return only the requested structured result. Do not post comments or modify files.

      - name: Save proposal
        if: steps.assess.outputs.structured_output != ''
        env:
          PROPOSAL: ${{ steps.assess.outputs.structured_output }}
        run: |
          mkdir -p "$RUNNER_TEMP/readme-advice"
          node -e 'const fs = require("node:fs"); const p = JSON.parse(process.env.PROPOSAL); fs.writeFileSync(process.env.RUNNER_TEMP + "/readme-advice/proposal.json", JSON.stringify(p));'

      - uses: actions/upload-artifact@v4
        if: steps.assess.outputs.structured_output != ''
        with:
          name: readme-testability-proposal
          path: ${{ runner.temp }}/readme-advice/proposal.json
          retention-days: 1

  propose:
    needs: assess
    if: needs.assess.result == 'success' && needs.assess.outputs.has_proposal == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: readme-testability-proposal
          path: ${{ runner.temp }}/readme-advice

      - name: Publish one advisory proposal
        uses: actions/github-script@v8
        env:
          PROPOSAL_PATH: ${{ runner.temp }}/readme-advice/proposal.json
          REVIEWED_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const fs = require('node:fs');
            const { publishProposal } = require('./.github/scripts/readme_testability.cjs');
            await publishProposal({
              github,
              context,
              headSha: process.env.REVIEWED_SHA,
              proposal: JSON.parse(fs.readFileSync(process.env.PROPOSAL_PATH, 'utf8')),
            });
