name: Puzzletron runtime image

"on":
  push:
    branches: ["pull-request/[0-9]+"]
  workflow_dispatch:
    # On-demand

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ startsWith(github.ref, 'refs/heads/pull-request/') && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  pr-gate:
    uses: ./.github/workflows/_pr_gate.yml
    permissions:
      checks: read
    with:
      files: |
        .dockerignore
        .github/workflows/_pr_gate.yml
        .github/workflows/puzzletron_runtime_image.yml
        LICENSE_HEADER
        README.md
        examples/__init__.py
        examples/puzzletron/**
        modelopt/**
        modelopt_recipes/**
        noxfile.py
        puzzletron_orchestrator/**
        puzzletron_setup/**
        pyproject.toml
        tests/conftest.py
        tests/_test_utils/torch/puzzletron/**
        tests/gpu/torch/puzzletron/test_puzzletron.py
        tests/gpu_vllm/torch/puzzletron/test_calc_runtime_stats.py
        tests/unit/torch/puzzletron/test_ci_environment.py
        tests/unit/torch/puzzletron/test_ci_image_contract.py
        tests/unit/torch/puzzletron/test_verify_image_environment.py

  build-runtime-image:
    needs: [pr-gate, dependency-metadata-preflight]
    if: needs.pr-gate.outputs.run_tests == 'true'
    runs-on: ${{ startsWith(github.ref, 'refs/heads/pull-request/') && 'linux-amd64-gpu-rtxpro6000-latest-1' || 'linux-amd64-gpu-rtxpro6000-latest-2' }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build the standalone runtime image from recorded sources
        env:
          IMAGE: modelopt-puzzletron-runtime:${{ github.sha }}
        run: |
          docker build \
            --file examples/puzzletron/Dockerfile \
            --build-arg "MODELOPT_REVISION=${GITHUB_SHA}" \
            --tag "${IMAGE}" \
            .
          docker run --rm "${IMAGE}" \
            python /opt/puzzletron/verify_image_environment.py \
              --environment /opt/puzzletron/ci_environment.json \
              --profile runtime
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/qualification/source:ro" \
            --workdir /opt/puzzletron/src/modelopt \
            --env PYTHONPATH=/opt/puzzletron/src/modelopt:/qualification/source/tests \
            "${IMAGE}" python -c \
              'from pathlib import Path; import examples, modelopt; root = Path("/opt/puzzletron/src/modelopt").resolve(); assert Path(modelopt.__file__).resolve().is_relative_to(root); assert Path(examples.__file__).resolve().is_relative_to(root)'
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/qualification/source:ro" \
            --workdir /qualification/source \
            --env PYTHONPATH=/qualification/source:/qualification/source/tests \
            "${IMAGE}" python -P -m pytest -q \
              --rootdir=/qualification/source \
              /qualification/source/tests/unit/torch/puzzletron
          docker run --gpus device=0 --ipc=host --rm \
            --volume "${GITHUB_WORKSPACE}:/qualification/source:ro" \
            --workdir /qualification/source \
            --env PYTHONPATH=/opt/puzzletron/src/modelopt:/qualification/source/tests \
            "${IMAGE}" python -P -m pytest -q \
              --rootdir=/qualification/source \
              /qualification/source/tests/gpu_vllm/torch/puzzletron/test_calc_runtime_stats.py
          docker run --gpus device=0 --ipc=host --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace/modelopt" \
            --workdir /workspace/modelopt \
            --env PUZZLETRON_ROOT=/workspace/modelopt \
            --env PYTHONPATH=/workspace/modelopt \
            "${IMAGE}" nox -s gpu_puzzletron

  dependency-metadata-preflight:
    needs: [pr-gate]
    if: needs.pr-gate.outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate pinned dependency metadata without GPUs
        run: |
          python -m pip install --disable-pip-version-check "packaging>=24,<27"
          python -m examples.puzzletron.ci.preflight_dependency_metadata \
            --environment examples/puzzletron/ci_environment.json

  runtime-image-required-check:
    if: ${{ startsWith(github.ref, 'refs/heads/pull-request/') && always() }}
    needs: [pr-gate, dependency-metadata-preflight, build-runtime-image]
    runs-on: ubuntu-latest
    steps:
      - name: Report intentionally scoped runtime-image validation
        if: needs.pr-gate.outputs.run_tests != 'true'
        run: |
          echo "## Puzzletron runtime image validation was not required" >> "${GITHUB_STEP_SUMMARY}"
          echo >> "${GITHUB_STEP_SUMMARY}"
          echo "No standalone runtime-image contract changed in this pull request." >> "${GITHUB_STEP_SUMMARY}"
      - name: Required runtime-image validation did not succeed
        if: >-
          ${{ needs.pr-gate.result != 'success' ||
            (needs.pr-gate.outputs.run_tests == 'true' &&
            (needs.dependency-metadata-preflight.result != 'success' ||
            needs.build-runtime-image.result != 'success')) }}
        run: exit 1
