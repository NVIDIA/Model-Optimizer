name: Claude Code Review

on:
  issue_comment:
    types: [created]

jobs:
  # ──────────────────────────────────────────────────────────────────
  # On-demand deep review. CodeRabbit (.coderabbit.yaml) auto-reviews every PR for routine
  # bugs, typos, style, and security anti-patterns; this Claude job complements it.
  # Trigger: /claude review
  #
  # tools/ci/claude_review.py builds the prompt from four parts:
  #   1. .github/claude_review/harness.md: how part 2 maps onto this job
  #   2. .github/claude_review/review.md: the review prompt shared with NVIDIA's Slack review bot,
  #      copied verbatim from its commit 2403352. Re-sync by copying, never edit it here.
  #   3. .agents/review-guidelines/modelopt.md: ModelOpt-specific review criteria
  #   4. the pull request, as untrusted data
  #
  # Claude only reads: it returns a structured verdict, and the same script applies the PR size
  # and test-plan rules to it before the workflow posts one review. The script, the prompts and
  # the posting come from the default branch (an issue_comment run uses its workflow), never from
  # the PR checkout, so a PR cannot change how it is reviewed. Changes to them take effect on merge.
  # ──────────────────────────────────────────────────────────────────
  review:
    name: Claude Review
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/claude review') &&
      contains(fromJson('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    env:
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.issue.number }}
      # Trigger comment body. The script wraps it as untrusted input (the prompt treats it only as
      # review scope, never as instructions). It is read from the environment, never interpolated
      # into a script.
      COMMENT_BODY: ${{ github.event.comment.body }}
    steps:
      - name: Get PR data
        id: pr-info
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="$RUNNER_TEMP/claude-review"
          mkdir -p "$dir"
          gh api "repos/$REPO/pulls/$PR_NUMBER" > "$dir/pr.json"
          gh api --paginate --slurp "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" > "$dir/files.json"
          gh api --paginate --slurp "repos/$REPO/pulls/$PR_NUMBER/reviews?per_page=100" > "$dir/reviews.json"
          gh api --paginate --slurp "repos/$REPO/pulls/$PR_NUMBER/comments?per_page=100" > "$dir/review_comments.json"
          gh api --paginate --slurp "repos/$REPO/issues/$PR_NUMBER/comments?per_page=100" > "$dir/issue_comments.json"
          echo "sha=$(jq -r .head.sha "$dir/pr.json")" >> "$GITHUB_OUTPUT"
          echo "base_ref=$(jq -r .base.ref "$dir/pr.json")" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: ${{ steps.pr-info.outputs.sha }}
          persist-credentials: false

      - name: Fetch base branch
        run: git fetch origin ${{ steps.pr-info.outputs.base_ref }}

      - name: Restore convention files from the base branch
        # The action restores CLAUDE.md from base, but it symlinks to AGENTS.md, which the PR controls.
        # The review prompt checks added license headers against LICENSE_HEADER, so restore it too.
        run: |
          for f in AGENTS.md CONTRIBUTING.md LICENSE LICENSE_HEADER; do
            if git cat-file -e "FETCH_HEAD:$f" 2>/dev/null; then
              git checkout FETCH_HEAD -- "$f"
            else
              rm -f "$f"
            fi
          done

      - name: Load the review script and prompts from the default branch
        # Keep them outside the workspace so the PR checkout never supplies them.
        run: |
          git fetch --depth=1 origin "$GITHUB_SHA"
          mkdir "$RUNNER_TEMP/trusted"
          git archive FETCH_HEAD tools/ci/claude_review.py .github/claude_review \
            .agents/review-guidelines/modelopt.md | tar -x -C "$RUNNER_TEMP/trusted"

      - name: React to trigger comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/$REPO/issues/comments/${{ github.event.comment.id }}/reactions \
            --method POST \
            -f content='eyes'

      - name: Prepare the review prompt
        id: prepare
        run: |
          python3 "$RUNNER_TEMP/trusted/tools/ci/claude_review.py" prepare \
            --data-dir "$RUNNER_TEMP/claude-review" \
            --prompt-dir "$RUNNER_TEMP/trusted/.github/claude_review" \
            --guidelines "$RUNNER_TEMP/trusted/.agents/review-guidelines/modelopt.md"

      - name: Run Claude Review
        id: claude
        # The review is posted only at the end, so leave time for the failure notice below.
        timeout-minutes: 40
        uses: anthropics/claude-code-action@db77d4d3c98f3f6380e7cd45ffba2342a3dbde3c # v1.0.254
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          # NVIDIA inference proxy (LiteLLM-based) rejects two fields
          # the Claude Code SDK sends by default. Set per NVIDIA/OSMO's
          # workflow which has hit and solved both issues:
          #   - `context_management` → disable experimental betas
          #   - `cache_control.ephemeral.scope` → disable prompt caching
          CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS: "1"
          DISABLE_PROMPT_CACHING: "1"
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          trigger_phrase: "/claude review"
          show_full_output: true
          claude_args: |
            --allowedTools "Read,Grep,Glob"
            --disallowedTools "Task,Bash,Read(//proc/**)"
            --model "${{ vars.CLAUDE_MODEL }}"
            --json-schema '${{ steps.prepare.outputs.schema }}'
          prompt: ${{ steps.prepare.outputs.prompt }}

      - name: Gate the verdict
        env:
          # The verdict is model output derived from attacker-controlled text: pass it through the
          # environment, never interpolate it into the script. This step has no token.
          VERDICT: ${{ steps.claude.outputs.structured_output }}
        run: python3 "$RUNNER_TEMP/trusted/tools/ci/claude_review.py" post --data-dir "$RUNNER_TEMP/claude-review"

      - name: Post review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="$RUNNER_TEMP/claude-review"
          gh api -X POST "repos/$REPO/pulls/$PR_NUMBER/reviews" --input "$dir/review.json" ||
            gh api -X POST "repos/$REPO/pulls/$PR_NUMBER/reviews" --input "$dir/fallback.json"

      - name: Report a review that did not post
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$REPO" \
            --body "The Claude review did not complete, so nothing was posted. See the [workflow run]($RUN_URL)."
