name: Claude Code Review

on:
  issue_comment:
    types: [created]

jobs:
  # ──────────────────────────────────────────────────────────────────
  # On-demand deep review. CodeRabbit (.coderabbit.yaml) auto-reviews every PR for routine
  # bugs, typos, style, and security anti-patterns; this Claude job complements it.
  # Trigger: /claude review
  #
  # Claude only reads (Read, Grep, Glob). tools/ci/claude_review.py builds its prompt from
  #   1. .github/claude_review/harness.md: how the baseline maps onto this job, and
  #   2. the review baseline and the ModelOpt rubric in .agents/review-guidelines/, read at the
  #      PR's captured base commit, so a PR cannot change the rules it is judged by,
  # then turns Claude's structured verdict into one review that the workflow posts. Only a
  # complete `approve` against an existing baseline is published as an approval; `lgtm`,
  # `nudge` and `comment` are comment reviews. The script and the harness come from the
  # default branch (an issue_comment run uses its workflow), never from the PR checkout, so
  # changes to them take effect on merge.
  # ──────────────────────────────────────────────────────────────────
  review:
    name: Claude Review
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/claude review') &&
      contains(fromJson('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    env:
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.issue.number }}
      # Trigger comment body. The script wraps it as untrusted input (the prompt treats it only as
      # review scope, never as instructions). It is read from the environment, never interpolated
      # into a script.
      COMMENT_BODY: ${{ github.event.comment.body }}
    steps:
      - name: Get PR data
        id: pr-info
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="$RUNNER_TEMP/claude-review"
          mkdir -p "$dir"
          gh api "repos/$REPO/pulls/$PR_NUMBER" > "$dir/pr.json"
          gh api --paginate --slurp "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" > "$dir/files.json"
          gh api --paginate --slurp "repos/$REPO/pulls/$PR_NUMBER/reviews?per_page=100" > "$dir/reviews.json"
          gh api --paginate --slurp "repos/$REPO/pulls/$PR_NUMBER/comments?per_page=100" > "$dir/review_comments.json"
          gh api --paginate --slurp "repos/$REPO/issues/$PR_NUMBER/comments?per_page=100" > "$dir/issue_comments.json"
          PR_DATA=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid,baseRefOid)
          echo "sha=$(echo $PR_DATA | jq -r .headRefOid)" >> $GITHUB_OUTPUT
          echo "base_sha=$(echo $PR_DATA | jq -r .baseRefOid)" >> $GITHUB_OUTPUT

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ steps.pr-info.outputs.sha }}
          persist-credentials: false

      - name: Fetch captured base commit for guidance
        run: git fetch origin ${{ steps.pr-info.outputs.base_sha }}

      - name: Restore convention files from the captured base commit
        # The action restores CLAUDE.md from base, but it symlinks to AGENTS.md, which the PR controls.
        # The baseline checks added license headers against LICENSE_HEADER, so restore it too.
        env:
          BASE_SHA: ${{ steps.pr-info.outputs.base_sha }}
        run: |
          for f in AGENTS.md CONTRIBUTING.md LICENSE LICENSE_HEADER; do
            if git cat-file -e "$BASE_SHA:$f" 2>/dev/null; then
              git checkout "$BASE_SHA" -- "$f"
            else
              rm -f "$f"
            fi
          done

      - name: Load the review script and guidance
        # The script and harness come from this workflow's commit, outside the workspace. The
        # baseline and the rubric are data read at the base commit; either may be absent there.
        env:
          BASE_SHA: ${{ steps.pr-info.outputs.base_sha }}
        run: |
          git fetch --depth=1 origin "$GITHUB_SHA"
          mkdir "$RUNNER_TEMP/trusted" "$RUNNER_TEMP/guidance"
          git archive FETCH_HEAD tools/ci/claude_review.py .github/claude_review/harness.md \
            | tar -x -C "$RUNNER_TEMP/trusted"
          for f in code-review.md modelopt.md; do
            git show "$BASE_SHA:.agents/review-guidelines/$f" > "$RUNNER_TEMP/guidance/$f" 2>/dev/null ||
              rm -f "$RUNNER_TEMP/guidance/$f"
          done

      - name: React to trigger comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/$REPO/issues/comments/${{ github.event.comment.id }}/reactions \
            --method POST \
            -f content='eyes'

      - name: Prepare the review prompt
        id: prepare
        env:
          HEAD_SHA: ${{ steps.pr-info.outputs.sha }}
          BASE_SHA: ${{ steps.pr-info.outputs.base_sha }}
        run: |
          python3 "$RUNNER_TEMP/trusted/tools/ci/claude_review.py" prepare \
            --data-dir "$RUNNER_TEMP/claude-review" \
            --harness "$RUNNER_TEMP/trusted/.github/claude_review/harness.md" \
            --guidance-dir "$RUNNER_TEMP/guidance"

      - name: Run Claude Review
        id: claude
        # The review is posted only at the end, so leave time for the failure notice below.
        timeout-minutes: 40
        uses: anthropics/claude-code-action@e4a6faad497d33dbc7144135c75e41f82f0bf6c0 # v1.0.255
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          # NVIDIA inference proxy (LiteLLM-based) rejects two fields
          # the Claude Code SDK sends by default. Set per NVIDIA/OSMO's
          # workflow which has hit and solved both issues:
          #   - `context_management` → disable experimental betas
          #   - `cache_control.ephemeral.scope` → disable prompt caching
          CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS: "1"
          DISABLE_PROMPT_CACHING: "1"
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          trigger_phrase: "/claude review"
          show_full_output: true
          claude_args: |
            --allowedTools "Read,Grep,Glob"
            --disallowedTools "Task,Bash,Read(//proc/**)"
            --model "${{ vars.CLAUDE_MODEL }}"
            --json-schema '${{ steps.prepare.outputs.schema }}'
          prompt: ${{ steps.prepare.outputs.prompt }}

      - name: Gate the verdict
        env:
          # The verdict is model output derived from attacker-controlled text: pass it through the
          # environment, never interpolate it into the script. This step has no token.
          VERDICT: ${{ steps.claude.outputs.structured_output }}
          HEAD_SHA: ${{ steps.pr-info.outputs.sha }}
          BASE_SHA: ${{ steps.pr-info.outputs.base_sha }}
        run: |
          python3 "$RUNNER_TEMP/trusted/tools/ci/claude_review.py" post \
            --data-dir "$RUNNER_TEMP/claude-review" --guidance-dir "$RUNNER_TEMP/guidance"

      - name: Post review
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.pr-info.outputs.sha }}
        run: |
          dir="$RUNNER_TEMP/claude-review"
          # Publish only if the PR head is still the commit that was reviewed.
          current=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid --jq .headRefOid)
          if [ "$current" != "$HEAD_SHA" ]; then
            echo "The PR head moved from $HEAD_SHA to $current during the review, so nothing was posted."
            exit 1
          fi
          gh api -X POST "repos/$REPO/pulls/$PR_NUMBER/reviews" --input "$dir/review.json" ||
            gh api -X POST "repos/$REPO/pulls/$PR_NUMBER/reviews" --input "$dir/fallback.json"

      - name: Report a review that did not post
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$REPO" \
            --body "The Claude review did not complete, so nothing was posted. See the [workflow run]($RUN_URL)."
