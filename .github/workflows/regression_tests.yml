name: Regression tests

on:
  push:
    branches: ["pull-request/[0-9]+"]
    # NOTE: paths cannot be used since push happens to copied PR and only latest commit to PR is used
  # The merge queue re-runs the required checks on the PR merged with the target branch.
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "0 0 * * *" # Nightly
  workflow_dispatch:
    # On-demand


concurrency:
  # Cancel previous runs if new commit is pushed to the same PR
  group: ${{ github.workflow }}-${{ startsWith(github.ref, 'refs/heads/pull-request/') && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  pr-gate:
    uses: ./.github/workflows/_pr_gate.yml
    permissions:
      checks: read
    secrets: inherit
    with:
      files: |
        .github/actions/**
        .github/workflows/_pr_gate.yml
        .github/workflows/regression_tests.yml
        modelopt/torch/**
        noxfile.py
        pyproject.toml
        tests/_test_utils/**
        tests/conftest.py
        tests/regression/**
        examples/speculative_decoding/**
        examples/dataset/**
        modelopt_recipes/general/speculative_decoding/**
        tools/launcher/**

  # System tests: they run in the merge queue, on nightly and on-demand runs, and on a PR that
  # carries the `run-system-tests` label.
  regression-tests:
    needs: [pr-gate]
    if: needs.pr-gate.outputs.any_changed == 'true' && needs.pr-gate.outputs.run_system == 'true'
    runs-on: ${{ (startsWith(github.ref, 'refs/heads/pull-request/') || github.event_name == 'merge_group') && 'linux-amd64-gpu-rtxpro6000-latest-1' || 'linux-amd64-gpu-rtxpro6000-latest-2' }}
    timeout-minutes: 15
    container:
      image: nvcr.io/nvidia/pytorch:26.07-py3
      env:
        GIT_DEPTH: 1000 # For correct version
        PIP_CONSTRAINT: "" # Disable pip constraint for upgrading packages
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        # Build CUDA kernels only for the runner's RTX PRO 6000 (sm_120), not the image's ~6 archs.
        TORCH_CUDA_ARCH_LIST: "12.0"
    steps:
      - uses: actions/checkout@v6
      - uses: nv-gha-runners/setup-proxy-cache@main
      - name: Setup environment variables
        run: |
          echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH}:/usr/include:/usr/lib/x86_64-linux-gnu" >> $GITHUB_ENV
      - name: Run regression tests
        env:
          COVERAGE_PROCESS_START: ${{ github.workspace }}/pyproject.toml
          COVERAGE_FILE: ${{ github.workspace }}/.coverage
        run: python -m pip install nox && nox -s regression
      - name: Upload regression coverage to Codecov
        if: github.event_name != 'merge_group'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: regression
          fail_ci_if_error: false # test may be skipped if relevant file changes are not detected
          verbose: true

  regression-pr-required-check:
    # Run even if regression-tests is skipped
    if: ${{ (startsWith(github.ref, 'refs/heads/pull-request/') || github.event_name == 'merge_group') && always() }}
    needs: [pr-gate, regression-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Regression tests are left to the merge queue
        if: ${{ needs.pr-gate.outputs.any_changed == 'true' && needs.pr-gate.outputs.run_system != 'true' }}
        run: echo "::notice::The regression tests are system tests and run in the merge queue. Add the run-system-tests label and re-run this workflow to run them on this PR."
      - name: Required regression tests did not succeed
        if: |
          needs.pr-gate.result != 'success' ||
          (needs.pr-gate.outputs.any_changed == 'true' && needs.pr-gate.outputs.run_system == 'true' && needs.regression-tests.result != 'success')
        run: exit 1
