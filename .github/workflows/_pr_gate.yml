name: PR Gate

on:
  workflow_call:
    inputs:
      files:
        description: "Newline-separated list of file patterns to watch for changes"
        required: true
        type: string
      files_ignore:
        description: "Newline-separated patterns to ignore; defaults to docs-only files no test runs"
        required: false
        type: string
        default: |
          **/*.ipynb
          **/*.md
          **/*.png
          **/*.rst
    outputs:
      any_changed:
        description: "Whether any relevant files changed (always false for a stacked PR)"
        value: ${{ jobs.check-file-changes.outputs.any_changed }}
      stacked:
        description: "Whether the PR targets another PR's branch, so its GPU tests are deferred"
        value: ${{ jobs.check-file-changes.outputs.stacked }}

jobs:
  check-file-changes:
    runs-on: ubuntu-24.04
    outputs:
      # Stacked PRs (base is another PR's branch) skip GPU tests; only the bottom PR, targeting main, runs them.
      any_changed: ${{ steps.base.outputs.stacked != 'true' && (steps.changed-tests.outputs.any_modified || steps.non-pr.outputs.any_changed) || 'false' }}
      stacked: ${{ steps.base.outputs.stacked == 'true' }}
    steps:
      # For non-PR triggers (schedule, workflow_dispatch), always run tests
      - id: non-pr
        if: "!startsWith(github.ref, 'refs/heads/pull-request/')"
        run: echo "any_changed=true" >> $GITHUB_OUTPUT
      - if: startsWith(github.ref, 'refs/heads/pull-request/')
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - if: startsWith(github.ref, 'refs/heads/pull-request/')
        id: base
        uses: ./.github/actions/pr-merge-base
      - if: startsWith(github.ref, 'refs/heads/pull-request/')
        name: Check for changes in test-relevant directories
        id: changed-tests
        uses: step-security/changed-files@2e07db73e5ccdb319b9a6c7766bd46d39d304bad # v47.0.5
        with:
          base_sha: ${{ steps.base.outputs.merge_base }}
          sha: ${{ steps.base.outputs.head_sha }}
          files: ${{ inputs.files }}
          files_ignore: ${{ inputs.files_ignore }}
          fail_on_initial_diff_error: true
  wait-checks:
    needs: [check-file-changes]
    if: >-
      startsWith(github.ref, 'refs/heads/pull-request/') &&
      needs.check-file-changes.outputs.any_changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      checks: read
    steps:
      - uses: poseidon/wait-for-status-checks@e7e24423722c5b8e97a6dd5848827d2a412f812d # v0.7.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          match_pattern: "^linux$" # Wait for Unit tests / linux
          delay: 300s
