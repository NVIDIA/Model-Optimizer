name: PR Gate

on:
  workflow_call:
    inputs:
      files:
        description: "Newline-separated list of file patterns to watch for changes"
        required: true
        type: string
      files_ignore:
        description: "Newline-separated patterns to ignore; defaults to docs-only files no test runs"
        required: false
        type: string
        default: |
          **/*.ipynb
          **/*.md
          **/*.png
          **/*.rst
    outputs:
      any_changed:
        description: "Whether any relevant files changed"
        value: ${{ jobs.check-file-changes.outputs.any_changed }}
      run_system:
        description: "Whether the GPU system tests run: always except on a PR run without the run-system-tests label"
        value: ${{ jobs.check-file-changes.outputs.run_system }}

jobs:
  check-file-changes:
    runs-on: ubuntu-latest
    outputs:
      any_changed: ${{ steps.changed-tests.outputs.any_modified || steps.non-pr.outputs.any_changed }}
      # Empty outside PR runs (nightly, on demand), which run everything
      run_system: ${{ steps.base.outputs.run_system || 'true' }}
    steps:
      # For non-PR triggers (schedule, workflow_dispatch), always run tests. A PR run is a push to a
      # copy-pr-bot branch (pull-request/N) or a merge queue group, which both diff against the base.
      - id: non-pr
        if: "!(startsWith(github.ref, 'refs/heads/pull-request/') || github.event_name == 'merge_group')"
        run: echo "any_changed=true" >> $GITHUB_OUTPUT
      - if: startsWith(github.ref, 'refs/heads/pull-request/') || github.event_name == 'merge_group'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - if: startsWith(github.ref, 'refs/heads/pull-request/') || github.event_name == 'merge_group'
        id: base
        uses: ./.github/actions/pr-merge-base
      - if: startsWith(github.ref, 'refs/heads/pull-request/') || github.event_name == 'merge_group'
        name: Check for changes in test-relevant directories
        id: changed-tests
        uses: step-security/changed-files@v47.0.5
        with:
          base_sha: ${{ steps.base.outputs.merge_base }}
          sha: ${{ steps.base.outputs.head_sha }}
          files: ${{ inputs.files }}
          files_ignore: ${{ inputs.files_ignore }}
          fail_on_initial_diff_error: true
  wait-checks:
    needs: [check-file-changes]
    if: >-
      (startsWith(github.ref, 'refs/heads/pull-request/') || github.event_name == 'merge_group') &&
      needs.check-file-changes.outputs.any_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      checks: read
    steps:
      - uses: poseidon/wait-for-status-checks@v0.7.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          match_pattern: "^linux$" # Wait for Unit tests / linux
          delay: 300s
