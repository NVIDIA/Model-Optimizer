name: Save extensions
description: Save the JIT caches restored by ./.github/actions/cache-extensions. Run it with `always()` so a failing or timed-out job still populates the
  cache (actions/cache itself only saves when the job succeeds).

inputs:
  cache-key:
    description: The `cache-key` output of ./.github/actions/cache-extensions.
    required: true
  cache-hit:
    description: The `cache-hit` output of ./.github/actions/cache-extensions.
    required: true
  triton-key:
    description: The `triton-key` output of ./.github/actions/cache-extensions.
    required: true
  triton-count:
    description: The `triton-count` output of ./.github/actions/cache-extensions.
    required: true

runs:
  using: composite
  steps:
    # A job cancelled before building anything must not claim the key with an empty cache:
    # later runs would restore it as an exact hit and never save again.
    - id: built
      shell: bash
      run: find /root/.cache/torch_extensions -name '*.so' 2>/dev/null | grep -q . && echo "any=true" >> "$GITHUB_OUTPUT" || true
    - if: inputs.cache-hit != 'true' && steps.built.outputs.any == 'true'
      uses: actions/cache/save@v6
      with:
        path: /root/.cache/torch_extensions
        key: ${{ inputs.cache-key }}
    # A saved Triton cache holds everything restored plus the new kernels, so save it only when
    # a run compiled enough new ones, not on every run.
    - id: triton
      shell: bash
      env:
        RESTORED: ${{ inputs.triton-count }}
      run: |
        count=$( (find /root/.cache/triton -mindepth 1 -maxdepth 1 2>/dev/null || true) | wc -l)
        if [ "$count" -ge $((${RESTORED:-0} + 20)) ]; then echo "new=true" >> "$GITHUB_OUTPUT"; fi
    - if: steps.triton.outputs.new == 'true' && inputs.triton-key != ''
      uses: actions/cache/save@v6
      with:
        path: /root/.cache/triton
        key: ${{ inputs.triton-key }}
