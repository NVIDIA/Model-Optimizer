name: Cache extensions
description: Restore JIT-compiled extensions (e.g. CUDA extensions) cached by an earlier run. Pair with ./.github/actions/save-extensions.

inputs:
  cache-key:
    description: Environment discriminator for the cache key (e.g. GPU arch + container image).
    required: true

outputs:
  cache-hit:
    description: Whether the extensions were restored from the exact key.
    value: ${{ steps.cache.outputs.cache-hit }}
  cache-key:
    description: The key to pass to ./.github/actions/save-extensions.
    value: ${{ steps.cache.outputs.cache-primary-key }}

runs:
  using: composite
  steps:
    - shell: bash
      run: echo "TORCH_EXTENSIONS_DIR=/root/.cache/torch_extensions" >> "$GITHUB_ENV"
    - id: cache
      uses: actions/cache/restore@v6
      with:
        path: /root/.cache/torch_extensions
        # Only the JIT-built sources and their build scripts, so Triton-only edits keep the cache.
        key: torch-ext-${{ inputs.cache-key }}-${{ hashFiles('modelopt/torch/kernels/quantization/**/*.cpp', 'modelopt/torch/kernels/quantization/**/*.cu',
          'modelopt/torch/kernels/quantization/**/*.cuh', 'modelopt/torch/kernels/quantization/**/*.h', 'modelopt/torch/kernels/quantization/conv/implicit_gemm_cuda.py',
          'modelopt/torch/quantization/extensions.py', 'modelopt/torch/utils/cpp_extension.py') }}
    # On a cache hit, backdate sources below the cached objects so ninja reuses them (touching
    # the objects instead would desync ninja's .ninja_deps and force a rebuild).
    - if: steps.cache.outputs.cache-hit == 'true'
      shell: bash
      run: find modelopt/torch/kernels/quantization -exec touch -d '2000-01-01' {} +
