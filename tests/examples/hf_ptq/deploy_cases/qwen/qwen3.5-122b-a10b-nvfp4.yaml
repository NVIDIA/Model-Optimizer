test_qwen:
  - model_id: nvidia/Qwen3.5-122B-A10B-NVFP4
    tensor_parallel_size: 4
    mini_sm: 100
    backends:
      vllm:
        engine_kwargs:
          quantization: modelopt_fp4
          trust_remote_code: true
          max_model_len: 4096
          kv_cache_dtype: auto
        sampling_kwargs:
          temperature: 0.8
          top_p: 0.9
