# Recipe: https://huggingface.co/nvidia/Qwen-Image-NVFP4/blob/4928c00477453b3570521e70a32e34b54c3a6624/README.md
# Runtime: nvcr.io/nvidia/tensorrt-llm/release:1.4.0rc3 (release candidate).
# The reference model-card recipe was validated on GB300 with 1.3.0rc28.
test_qwen_image_nvfp4:
  - model_id: nvidia/Qwen-Image-NVFP4
    task: image-generation
    revision: 4928c00477453b3570521e70a32e34b54c3a6624
    pipeline_class: QwenImagePipeline
    tensor_parallel_size: 1
    mini_sm: 100
    input_config:
      prompt: >-
        A realistic photograph of a red ceramic teapot on a wooden
        table beside a window, soft morning light, detailed wood grain.
    backends:
      trtllm:
        engine_version: 1.4.0rc3
        # These are release-test candidates; neither SM alone nor collection qualifies a GPU.
        sm_versions: [100, 103]
        engine_kwargs:
          attention_config:
            backend: VANILLA
          parallel_config:
            cfg_size: 1
            ulysses_size: 1
          torch_compile_config:
            enable: false
          cuda_graph_config:
            enable: false
          compilation_config:
            skip_warmup: true
        sampling_kwargs:
          height: 512
          width: 512
          num_inference_steps: 50
          guidance_scale: 4.0
          seed: 42
          negative_prompt: ' '
          num_images_per_prompt: 1
      sglang:
        # SGLang v0.5.23 registers this published checkpoint in its native diffusion pipeline.
        engine_version: 0.5.23
        sm_versions: [100, 103]
        engine_kwargs:
          backend: sglang
          sp_degree: 1
          enable_cfg_parallel: false
          enable_torch_compile: false
          enable_breakable_cuda_graph: false
          warmup_mode: 'off'
          log_level: debug
        sampling_kwargs:
          height: 512
          width: 512
          num_inference_steps: 50
          guidance_scale: 4.0
          seed: 42
          negative_prompt: ' '
          num_outputs_per_prompt: 1
