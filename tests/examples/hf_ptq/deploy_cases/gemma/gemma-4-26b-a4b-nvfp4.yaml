test_gemma:
  - model_id: nvidia/Gemma-4-26B-A4B-NVFP4
    tensor_parallel_size: 2
    mini_sm: 100
    backends:
      vllm:
        engine_kwargs:
          quantization: modelopt_fp4
          trust_remote_code: true
          max_model_len: 4096
          kv_cache_dtype: auto
        sampling_kwargs:
          temperature: 0.8
          top_p: 0.9
