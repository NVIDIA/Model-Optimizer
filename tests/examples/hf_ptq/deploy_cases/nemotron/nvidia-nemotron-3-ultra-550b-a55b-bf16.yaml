test_nvidia_nemotron_3_ultra_550b_a55b_bf16:
  - model_id: nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-BF16
    tensor_parallel_size: 8
    backends:
      trtllm:
        engine_kwargs:
          backend: pytorch
          kv_cache_config:
            enable_block_reuse: true
            free_gpu_memory_fraction: 0.8
            mamba_ssm_cache_dtype: float32
          enable_attention_dp: false
          attn_backend: TRTLLM
          trust_remote_code: true
          max_batch_size: 8
        sampling_kwargs:
          max_tokens: 32
      vllm:
        engine_kwargs:
          quantization: modelopt
          trust_remote_code: true
          max_model_len: 4096
          kv_cache_dtype: auto
        sampling_kwargs:
          temperature: 0.8
          top_p: 0.9
      sglang:
        engine_kwargs:
          quantization: modelopt
          trust_remote_code: true
          context_length: 4096
