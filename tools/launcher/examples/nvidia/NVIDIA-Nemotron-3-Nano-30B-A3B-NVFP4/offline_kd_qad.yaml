# Nemotron-3-Nano-30B-A3B NVFP4 Offline KD QAD pipeline.
#
# Two-stage knowledge distillation using cached teacher logits:
#   task_0 (quantize): PTQ of BF16 teacher → NVFP4 MCore checkpoint.
#   task_1 (dump):     Run BF16 teacher frozen, save top-K logits to /scratchspace/logits.
#   task_2 (student):  Train NVFP4 student with --logits-load-dir.
#   task_3 (export):   Export trained student checkpoint to HF format.
#   task_4 (eval):     TRT-LLM evaluation of the exported checkpoint.
#
# Requirements:
#   - nvcr.io/nvidia/nemo:26.06 (ships nvidia-resiliency-ext>=0.6.0, needed
#     by task_1's --async-save + --use-persistent-ckpt-worker). Tasks 0-3 pin
#     this container explicitly since the launcher's default slurm_factory
#     container is a TensorRT-LLM image with no Megatron-LM/NeMo deps.
#   - GOTCHA: nemo containers install ModelOpt into a venv at /opt/venv, whose
#     site-packages precede /usr/local on sys.path, so the default
#     modelopt_install_path is never consulted. Point it at the venv
#     site-packages so the mounted (submodule-pinned) modelopt actually
#     overrides the container's.
#   - task_1's --finetune is required, not optional: MLM_MODEL_CKPT
#     (/hf-local/.../BF16-MCore) is a shared, multi-tenant path that may hold
#     another run's completed checkpoint (e.g. iter_0000128 with
#     consumed_train_samples already at --train-samples). Without --finetune,
#     Megatron resumes that state instead of starting the frozen dump forward
#     pass fresh, and MegatronPretrainingSampler asserts "no samples left to
#     consume" immediately.
#   - task_0 stays on ModelOpt's default "local spec" (no --export-default-
#     te-spec): common/megatron_lm/quantize/quantize.sh's inline MMLU/export
#     sub-steps each overwrite MLM_EXTRA_ARGS with their own hardcoded args,
#     dropping any custom spec flag, so a save-time-only --export-default-
#     te-spec would make those sub-steps reload the checkpoint under a
#     different (mismatched) spec default and hit an _extra_state KeyError.
#     RUN_MMLU=false / RUN_EXPORT=false skip those sub-steps regardless
#     (see below), so this isn't strictly load-bearing, but keeps task_0
#     simple and matches the sibling BF16 PTQ examples for this model family.
#   - task_2 needs --export-default-te-spec (switches MoE experts to
#     TEGroupedMLP), for TP=2 + EP=8 together: ModelOpt's default
#     SequentialMLP quant wrapper hard-disallows TP>1 and EP>1 at the same
#     time, which is required to avoid an OOM in the KD loss's full-vocab
#     softmax norm. task_1 doesn't need it: it loads the separate, unquantized
#     BF16-MCore teacher checkpoint (not task_0's output) at TP=1/EP=8, which
#     never hits that restriction regardless of spec, and it has completed
#     successfully without this flag. task_0 stays on the local spec (see
#     RUN_MMLU/RUN_EXPORT note below), so any task loading a checkpoint
#     task_2 saved (itself on the TE spec) can hit the same _extra_state key
#     mismatch the sibling Llama-3.2-1B QAD example hits -- task_2 and task_3
#     (export, which loads task_2's trained output) both carry
#     --export-default-te-spec / --dist-ckpt-strictness log_all to build
#     under the matching spec and tolerate mismatched keys (logs them instead
#     of hard-raising).
#   - task_0 sets RUN_MMLU=false and RUN_EXPORT=false: neither inline
#     sub-step is needed here (the MMLU gate is already bypassed below, and
#     task_3 does its own dedicated export), and skipping them avoids the
#     spec-mismatch risk noted above.
#
# MMLU_LOWER_BOUND=0.0 was the temporary bypass on task_0's inline MMLU gate;
# RUN_MMLU=false now skips that gate entirely (see above), so this value is
# currently a no-op. Revisit both before this pipeline is used for production
# runs (see OfflineKD MMLU accuracy note in project history).
#
# Usage:
#   source .env-slurm
#   cd tools/launcher
#   uv run launch.py --yaml examples/nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-NVFP4/offline_kd_qad.yaml --yes

job_name: NVIDIA-Nemotron-3-Nano-30B-A3B-NVFP4-QAD-OfflineKD
pipeline:
  task_0:
    script: common/megatron_lm/quantize/quantize.sh
    args:
      - --calib-dataset-path-or-name /hf-local/abisee/cnn_dailymail
      - --calib-size 32
      - --calib-max-sequence-length 512
      - --skip-generate
    environment:
      - MLM_MODEL_CFG: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16
      - QUANT_CFG: MAMBA_MOE_NVFP4_CONSERVATIVE_CFG
      - EP: 4
      - MMLU_LOWER_BOUND: 0.0
      - RUN_MMLU: "false"
      - RUN_EXPORT: "false"
      - PYTHONPATH: /nemo_run/code/modules/Megatron-LM
    slurm_config:
      _factory_: "slurm_factory"
      container: nvcr.io/nvidia/nemo:26.06
      modelopt_install_path: /opt/venv/lib/python3.12/site-packages/modelopt
      nodes: 1
      ntasks_per_node: 8
      gpus_per_node: 8

  task_1:
    script: common/megatron_lm/train/sft.sh
    args:
      - --seq-length 8192 --max-position-embeddings 8192
      - --train-samples 1024
      - --lr-decay-samples 256
      - --lr-warmup-samples 128
      - --sft
      - --sft-tokenizer-prompt-format identity
      - --tokenizer-type SFTTokenizer
      - --no-create-attention-mask-in-dataloader
      - --per-split-data-args-path /hf-local/modelopt/nemotron-3-super-sft/blend.json
      - --data-cache-path /hf-local/modelopt/test-nemotron-sft/cache
      - --micro-batch-size 1
      - --attention-dropout 0.0
      - --hidden-dropout 0.0
      - --no-check-for-nan-in-loss-and-grad
      - --recompute-granularity selective
      - --recompute-modules layernorm moe
      - --lr 5.0e-5
      - --min-lr 5.0e-6
      - --lr-decay-style cosine
      - --clip-grad 1.0
      - --weight-decay 0.0
      - --adam-beta1 0.9
      - --adam-beta2 0.95
      - --init-method-std 0.010
      - --use-distributed-optimizer
      - --eval-iters 4
      - --eval-interval 1000
      - --save-interval 1000
      - --log-interval 100
      - --finetune
      - --freeze-all-layers
      - --logits-save-top-k 16
      - --logits-save-dir /scratchspace/logits
      - --async-save
      - --use-persistent-ckpt-worker
    environment:
      - DP: 1
      - CP: 2
      - TP: 1
      - PP: 1
      - EP: 8
      - ETP: 1
      - MLM_MODEL_CFG: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16
      - MLM_MODEL_CKPT: /hf-local/nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16-MCore
      - MLM_DATA_ARGS: --sft
      - PYTHONPATH: /nemo_run/code/modules/Megatron-LM
    slurm_config:
      _factory_: "slurm_factory"
      container: nvcr.io/nvidia/nemo:26.06
      modelopt_install_path: /opt/venv/lib/python3.12/site-packages/modelopt
      nodes: 2
      ntasks_per_node: 8
      gpus_per_node: 8

  task_2:
    script: common/megatron_lm/train/sft.sh
    args:
      - --seq-length 8192 --max-position-embeddings 8192
      - --train-samples 1024
      - --lr-decay-samples 256
      - --lr-warmup-samples 128
      - --sft
      - --sft-tokenizer-prompt-format identity
      - --tokenizer-type SFTTokenizer
      - --no-create-attention-mask-in-dataloader
      - --per-split-data-args-path /hf-local/modelopt/nemotron-3-super-sft/blend.json
      - --data-cache-path /hf-local/modelopt/test-nemotron-sft/cache
      - --micro-batch-size 1
      - --global-batch-size 8
      - --attention-dropout 0.0
      - --hidden-dropout 0.0
      - --no-check-for-nan-in-loss-and-grad
      - --recompute-granularity selective
      - --recompute-modules layernorm moe
      - --lr 5.0e-5
      - --min-lr 5.0e-6
      - --lr-decay-style cosine
      - --clip-grad 1.0
      - --weight-decay 0.0
      - --adam-beta1 0.9
      - --adam-beta2 0.95
      - --init-method-std 0.010
      - --use-distributed-optimizer
      - --eval-iters 4
      - --eval-interval 1000
      - --save-interval 1000
      - --log-interval 100
      - --export-default-te-spec
      - --dist-ckpt-strictness log_all
      - --sequence-parallel
      - --logits-load-dir /scratchspace/logits
    environment:
      - DP: 1
      - CP: 2
      - TP: 2
      - PP: 1
      - EP: 8
      - ETP: 1
      - MLM_MODEL_CFG: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16
      - MLM_DATA_ARGS: --sft
      - PYTHONPATH: /nemo_run/code/modules/Megatron-LM
    slurm_config:
      _factory_: "slurm_factory"
      container: nvcr.io/nvidia/nemo:26.06
      modelopt_install_path: /opt/venv/lib/python3.12/site-packages/modelopt
      nodes: 2
      ntasks_per_node: 8
      gpus_per_node: 8

  task_3:
    script: common/megatron_lm/export/export.sh
    args:
      - --export-default-te-spec
      - --dist-ckpt-strictness log_all
    environment:
      - MLM_MODEL_CFG: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16
      - QUANT_CFG: MAMBA_MOE_NVFP4_CONSERVATIVE_CFG
      - HF_MODEL_CKPT: /hf-local/nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16
      - EXPORT_DIR: /scratchspace/export
      - PP: 4
    slurm_config:
      _factory_: "slurm_factory"
      container: nvcr.io/nvidia/nemo:26.06
      modelopt_install_path: /opt/venv/lib/python3.12/site-packages/modelopt
      nodes: 1
      ntasks_per_node: 8
      gpus_per_node: 8

  task_4:
    script: common/tensorrt_llm/eval.sh
    environment:
      - HF_MODEL_CKPT: /scratchspace/export
    slurm_config:
      _factory_: "slurm_factory"
      nodes: 1
      ntasks_per_node: 4
      gpus_per_node: 4
