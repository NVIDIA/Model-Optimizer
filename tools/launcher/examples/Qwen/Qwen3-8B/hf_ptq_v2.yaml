# V2 counterpart of hf_ptq.yaml, using the same Hugging Face PTQ wrapper.
# Supply an execution profile with artifact_store/artifact_publisher and tracking_uri.
api_version: modelopt/v2
name: hf_ptq_nvfp4
parameters:
  model: Qwen/Qwen3-8B
  quant: nvfp4
  calib_size: 512
  calib_seq: 512
  calib_batch_size: 0
  calib_dataset: cnn_nemotron_v2_mix
  output_ref: modelopt-examples/qwen3-8b-ptq
  output_version: trial-001
  model_name: qwen3-8b-ptq
inputs:
  /inputs/base_model:
    ref: ${parameters.model}
    env: BASE_MODEL
    role: base_model
tasks:
  quantize:
    # The wrapper names its export saved_models_<input basename>_<quant>.
    inline: >-
      test -f "$BASE_MODEL/config.json" &&
      export ROOT_SAVE_PATH="$(dirname "$QUANTIZED_MODEL")" &&
      bash common/hf/ptq.sh --repo "$MODEL_REF" --local-dir "$BASE_MODEL" --
      --quant "$QFORMAT" --tasks quant
      --calib "$CALIB_SIZE" --calib_seq "$CALIB_SEQ"
      --calib_batch_size "$CALIB_BATCH_SIZE" --calib_dataset "$CALIB_DATASET"
    environment:
      MODEL_REF: ${parameters.model}
      QFORMAT: ${parameters.quant}
      CALIB_SIZE: ${parameters.calib_size}
      CALIB_SEQ: ${parameters.calib_seq}
      CALIB_BATCH_SIZE: ${parameters.calib_batch_size}
      CALIB_DATASET: ${parameters.calib_dataset}
    resources:
      nodes: 1
      ntasks_per_node: 1
      gpus_per_node: 1
      time: "04:00:00"
    container: nvcr.io/nvidia/tensorrt-llm/release:1.3.0rc20
    outputs:
      checkpoint:
        path: saved_models_base_model_${parameters.quant}
        kind: checkpoint
        env: QUANTIZED_MODEL
        publish:
          ref: ${parameters.output_ref}
          version: ${parameters.output_version}
          model_name: ${parameters.model_name}
          metadata:
            model_ref: ${parameters.model}
            quantization: ${parameters.quant}
            calib_dataset: ${parameters.calib_dataset}
            calib_size: ${parameters.calib_size}
            calib_seq: ${parameters.calib_seq}
            calib_batch_size: ${parameters.calib_batch_size}
outputs:
  checkpoint:
    from: quantize.checkpoint
