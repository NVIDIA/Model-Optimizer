      - VLLM_USE_V2_MODEL_RUNNER: "1"
    slurm_config:
      _factory_: slurm_factory
      nodes: 1
      ntasks_per_node: 1
      gpus_per_node: 1
      time: 02:00:00
      container: vllm/vllm-openai:nightly

  # DSpark7 T1 C32
  task_3:
    script: common/specdec_bench/run.sh
    args:
      - --dataset speed
      - --dataset_path /hf-local/nvidia/SPEED-Bench/speed/qualitative
      - --engine VLLM
      - --speculative_algorithm DSPARK
      - --draft_model_dir <<global_vars.draft_model>>
      - --draft_length 7
      - --max_seq_len 16384
      - --tp_size 1
      - --ep_size 1
      - --concurrency 32
      - --num_requests 440
      - --output_length 4096
      - "--runtime_params '{\"sampling_kwargs\":{\"temperature\":1.0,\"top_p\":0.95,\"top_k\":20,\"presence_penalty\":1.5},\"engine_args\":{\"draft_sample_method\":\"probabilistic\"}}'"
      - --aa_timing
      - --show_progress
      - --save_dir <<global_vars.output_dir>>/dspark7/t1
    environment:
      - HF_MODEL_CKPT: <<global_vars.hf_model>>
      - VLLM_USE_V2_MODEL_RUNNER: "1"
