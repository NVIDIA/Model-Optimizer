# SPEED-Bench: Qwen3.5-9B Base / DSpark7 / MTP3 / MTP7 / DFlash8 (TP1 / C32 / T0+T1 / MRV2)

job_name: qwen3.5-9b-specdec-bench-tp1-c32

pipeline:
  global_vars:
    hf_model: /hf-local/Qwen/Qwen3.5-9B
    draft_model: /cicd/qwen3.5-9b-dspark/export
    output_dir: /cicd/qwen3.5-9b-dspark-benchmark-tp1-c32

  # Draft semantics: DSpark7 drafts 7 speculative tokens; DFlash8 drafts 7 speculative tokens (includes 1 anchor).

  # Prepare SPEED-Bench data
  task_0:
    inline: >-
      python3 -m pip install -r modules/Model-Optimizer/examples/specdec_bench/requirements.txt &&
      (test -f /hf-local/nvidia/SPEED-Bench/speed/qualitative/test.parquet ||
      python3 modules/Model-Optimizer/examples/specdec_bench/prepare_data.py
      --dataset speed --config qualitative --output_dir /hf-local/nvidia/SPEED-Bench)
    slurm_config:
      _factory_: slurm_factory
      nodes: 1
      ntasks_per_node: 1
      gpus_per_node: 1
      time: 02:00:00
      container: vllm/vllm-openai:nightly

  # Base T1 C32
  task_1:
    script: common/specdec_bench/run.sh
    args:
      - --dataset speed
      - --dataset_path /hf-local/nvidia/SPEED-Bench/speed/qualitative
      - --engine VLLM
      - --speculative_algorithm NONE
      - --tp_size 1
      - --ep_size 1
      - --concurrency 32
      - --num_requests 440
      - --output_length 4096
      - "--runtime_params '{\"sampling_kwargs\":{\"temperature\":1.0,\"top_p\":0.95,\"top_k\":20,\"presence_penalty\":1.5}}'"
      - --aa_timing
      - --show_progress
      - --save_dir <<global_vars.output_dir>>/base/t1
    environment:
      - HF_MODEL_CKPT: <<global_vars.hf_model>>
      - VLLM_USE_V2_MODEL_RUNNER: "1"
    slurm_config:
      _factory_: slurm_factory
      nodes: 1
      ntasks_per_node: 1
      gpus_per_node: 1
      time: 02:00:00
      container: vllm/vllm-openai:nightly

  # Base T0 C32
  task_2:
    script: common/specdec_bench/run.sh
    args:
      - --dataset speed
      - --dataset_path /hf-local/nvidia/SPEED-Bench/speed/qualitative
      - --engine VLLM
      - --speculative_algorithm NONE
      - --tp_size 1
      - --ep_size 1
      - --concurrency 32
      - --num_requests 440
      - --output_length 4096
      - "--runtime_params '{\"sampling_kwargs\":{\"temperature\":0.0,\"top_p\":0.95,\"top_k\":20,\"presence_penalty\":1.5}}'"
      - --aa_timing
      - --show_progress
      - --save_dir <<global_vars.output_dir>>/base/t0
    environment:
