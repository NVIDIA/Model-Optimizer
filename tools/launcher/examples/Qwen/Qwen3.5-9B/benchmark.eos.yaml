job_name: dspark.qwen3.5-9b-speed-bench

pipeline:
  global_vars:
    hf_model: /hf-local/Qwen/Qwen3.5-9B

  task_0:
    inline: >-
      python3 -m pip install -r modules/Model-Optimizer/examples/specdec_bench/requirements.txt && (test -f /hf-local/nvidia/SPEED-Bench/speed/qualitative/test.parquet || python3 modules/Model-Optimizer/examples/specdec_bench/prepare_data.py --dataset speed --config qualitative --output_dir /hf-local/nvidia/SPEED-Bench) && (test -f /hf-local/nvidia/SPEED-Bench/speed/throughput_8k/test.parquet || python3 modules/Model-Optimizer/examples/specdec_bench/prepare_data.py --dataset speed --config throughput_8k --output_dir /hf-local/nvidia/SPEED-Bench)
    slurm_config:
      _factory_: slurm_factory
      nodes: 1
      ntasks_per_node: 1
      gpus_per_node: null
      time: 02:00:00
      container: <project_path>/dspark-training/.cache/containers/vllm-openai-nightly.sqsh

  task_1:
    script: common/specdec_bench/run.sh
    args:
      - --dataset speed
      - --dataset_path /hf-local/nvidia/SPEED-Bench/speed/qualitative
      - --engine VLLM
      - --speculative_algorithm NONE
      - --tp_size 2
      - --ep_size 1
      - --concurrency 32
      - --output_length 4096
      - "--runtime_params '{\"sampling_kwargs\":{\"temperature\":1.0,\"top_p\":0.95,\"top_k\":20,\"presence_penalty\":1.5}}'"
      - --aa_timing
      - --show_progress
      - --save_dir /cicd/benchmark/results/base/qualitative-t1
    environment:
      - HF_MODEL_CKPT: <<global_vars.hf_model>>
    slurm_config:
      _factory_: slurm_factory
      nodes: 1
      ntasks_per_node: 1
      gpus_per_node: null
      time: 04:00:00
      container: <project_path>/dspark-training/.cache/containers/vllm-openai-nightly.sqsh

  task_2:
    script: common/specdec_bench/run.sh
    args:
      - --dataset speed
      - --dataset_path /hf-local/nvidia/SPEED-Bench/speed/qualitative
      - --engine VLLM
      - --speculative_algorithm DSPARK
      - --draft_model_dir /cicd/export-v3
      - --draft_length 7
      - --tp_size 2
      - --ep_size 1
      - --concurrency 32
      - --output_length 4096
      - "--runtime_params '{\"sampling_kwargs\":{\"temperature\":1.0,\"top_p\":0.95,\"top_k\":20,\"presence_penalty\":1.5},\"engine_args\":{\"draft_sample_method\":\"probabilistic\"}}'"
      - --aa_timing
      - --show_progress
      - --save_dir /cicd/benchmark/results/dspark/qualitative-t1-prob
    environment:
      - HF_MODEL_CKPT: <<global_vars.hf_model>>
    slurm_config:
      _factory_: slurm_factory
      nodes: 1
      ntasks_per_node: 1
      gpus_per_node: null
      time: 04:00:00
      container: <project_path>/dspark-training/.cache/containers/vllm-openai-nightly.sqsh

  task_3:
    script: common/specdec_bench/run.sh
    args:
      - --dataset speed
      - --dataset_path /hf-local/nvidia/SPEED-Bench/speed/throughput_8k
      - --engine VLLM
      - --speculative_algorithm NONE
      - --tp_size 2
      - --ep_size 1
      - --concurrency 8
      - --num_requests 80
      - --output_length 4096
      - --max_seq_len 16384
      - "--runtime_params '{\"sampling_kwargs\":{\"temperature\":1.0,\"top_p\":0.95,\"top_k\":20,\"presence_penalty\":1.5}}'"
      - --aa_timing
      - --show_progress
      - --save_dir /cicd/benchmark/results/base/throughput_8k-t1
    environment:
      - HF_MODEL_CKPT: <<global_vars.hf_model>>
    slurm_config:
      _factory_: slurm_factory
      nodes: 1
      ntasks_per_node: 1
      gpus_per_node: null
      time: 04:00:00
      container: <project_path>/dspark-training/.cache/containers/vllm-openai-nightly.sqsh

  task_4:
    script: common/specdec_bench/run.sh
    args:
      - --dataset speed
      - --dataset_path /hf-local/nvidia/SPEED-Bench/speed/throughput_8k
      - --engine VLLM
      - --speculative_algorithm DSPARK
      - --draft_model_dir /cicd/export-v3
      - --draft_length 7
      - --tp_size 2
      - --ep_size 1
      - --concurrency 8
      - --num_requests 80
      - --output_length 4096
      - --max_seq_len 16384
      - "--runtime_params '{\"sampling_kwargs\":{\"temperature\":1.0,\"top_p\":0.95,\"top_k\":20,\"presence_penalty\":1.5},\"engine_args\":{\"draft_sample_method\":\"probabilistic\"}}'"
      - --aa_timing
      - --show_progress
      - --save_dir /cicd/benchmark/results/dspark/throughput_8k-t1-prob
    environment:
      - HF_MODEL_CKPT: <<global_vars.hf_model>>
    slurm_config:
      _factory_: slurm_factory
      nodes: 1
      ntasks_per_node: 1
      gpus_per_node: null
      time: 04:00:00
      container: <project_path>/dspark-training/.cache/containers/vllm-openai-nightly.sqsh

  task_5:
    script: common/specdec_bench/run.sh
    args:
      - --dataset speed
      - --dataset_path /hf-local/nvidia/SPEED-Bench/speed/qualitative
      - --engine VLLM
      - --speculative_algorithm DSPARK
      - --draft_model_dir /cicd/export-v3
      - --draft_length 7
      - --tp_size 2
      - --ep_size 1
      - --concurrency 32
      - --output_length 4096
      - "--runtime_params '{\"sampling_kwargs\":{\"temperature\":0.0,\"top_p\":0.95,\"top_k\":20,\"presence_penalty\":1.5}}'"
      - --aa_timing
      - --show_progress
      - --save_dir /cicd/benchmark/results/dspark/qualitative-t0-greedy
    environment:
      - HF_MODEL_CKPT: <<global_vars.hf_model>>
    slurm_config:
      _factory_: slurm_factory
      nodes: 1
      ntasks_per_node: 1
      gpus_per_node: null
      time: 04:00:00
      container: <project_path>/dspark-training/.cache/containers/vllm-openai-nightly.sqsh
