# DSpark streaming speculative-decoding training for Kimi-K3 (multi-node).
# DSpark = the DFlash backbone + a lightweight Markov head + a confidence head,
# generating a causal block semi-autoregressively; see dspark.yaml for the head
# and loss config. Runs the shared streaming pipeline
# (common/eagle3/train_eagle_streaming.sh) with the K3-specific base, draft dims,
# mask token and sliding window; trained from scratch. A starting point for
# reproduction — tune node counts, batch, steps and serve limits for your cluster.
#
# Kimi-K3 specifics this yaml encodes (each was a silent failure mode):
#   * Loss mask. K3 replaces the K2/K2.5 <|im_*|> turn markers with an XTML tag
#     format (<|open|> message role assistant <|sep|> ... <|close|>) and ships a
#     slow tiktoken tokenizer, so answer_only_loss depends on the `kimi_k3`
#     loss-mask recovery. Without it the legacy `kimi` recovery matches (K3 keeps
#     the old markers for back-compat) and returns an ALL-ZERO mask.
#   * Final norm. K3 is a VLM whose outer config reports model_type "kimi_k3"
#     while its text backbone reports "kimi_linear"; the final-norm table is keyed
#     on the text config, so the `kimi_linear` entry is what stops FakeBaseModel
#     from silently building no norm and reconstructing target logits from an
#     un-normed hidden.
#   * EAGLE_CAPTURE_IDS ends at 93 == num_hidden_layers, the TRUE final hidden.
#     K3 has a block-residual backbone (attn_res_block_size=12) whose output is
#     produced after the layer loop by attn_res, so capturing that id requires
#     vllm#50815. Without it the "final" capture is prefix_sum + hidden_states,
#     which is missing the block-residual combination and skews the KD teacher.
#   * The DSpark draft does NOT inherit the base dims, so they are set explicitly
#     below. Note these are draft-side choices, not mirrors of the backbone: K3's
#     text config carries no rope_theta at all (so the draft's value is a free
#     hyperparameter), and its FFN is 33792 dense / 3072 MoE, neither of which the
#     draft copies.
#   * Serving K3 needs TP8, and this pipeline runs one serve replica per node, so
#     the serve nodes must have >= 8 GPUs.
#
# Run ON the cluster login node (paramiko can't reach it through the login proxy):
#   export SLURM_HOST=localhost SLURM_ACCOUNT=<your_account> \
#          SLURM_PARTITION=<multi_node_partition> \
#          SLURM_HF_LOCAL=<hf_models_dir> \
#          SLURM_JOB_DIR=<experiments_dir> \
#          NEMORUN_HOME=$PWD
#   uv run launch.py --yaml examples/moonshotai/Kimi-K3/hf_streaming_dspark_multi_node.yaml \
#          identity=$HOME/.ssh/id_ecdsa detach=True --yes
#
# The export lands in /scratchspace/export.

job_name: Kimi-K3_DSpark_streaming_multi_node
pipeline:
  allow_to_fail: false
  skip: false
  note:

  global_vars:
    hf_model: /hf-local/moonshotai/Kimi-K3

  # Build /scratchspace/data/train.jsonl. Point data.data_path at the full
  # Spec-Decoding-Dataset-v2 corpus to reproduce.
  task_0:
    script: common/eagle3/make_dataset.sh
    args:
      - -f modules/Model-Optimizer/examples/dataset/example_data_config.yaml
      - --full-conversations
    slurm_config:
      _factory_: "slurm_factory"
      nodes: 1
      ntasks_per_node: 1
      gpus_per_node: 8
      container: nvcr.io/nvidia/tensorrt-llm/release:1.3.0rc10

  task_1:
    script: common/eagle3/train_eagle_streaming.sh
    args:
      - --config modules/Model-Optimizer/modelopt_recipes/general/speculative_decoding/dspark.yaml
      - model.model_name_or_path=<<global_vars.hf_model>>
      - model.use_fake_base_for_offline=true
      - model.trust_remote_code=true
      - data.mode=streaming
      - data.data_path=/scratchspace/data/train.jsonl
      - training.output_dir=/scratchspace/dspark
      - training.training_seq_len=4096
      - training.disable_tqdm=true
      - training.ar_validate_steps=500000
      - training.num_train_epochs=1
      - training.per_device_train_batch_size=4
      - training.gradient_accumulation_steps=1
      - training.save_steps=1000
      - training.logging_steps=20
      - training.learning_rate=1.0e-4
      - training.warmup_steps=2000
      # K3's slow tokenizer can't emit assistant masks; the `kimi_k3` loss-mask
      # recovery reconstructs them from token ids (see header).
      - training.answer_only_loss=true
      # The vLLM serve container has no tensorboard -> trainer init crash.
      - training.report_to=none
      # Draft dims are NOT inherited from the base — set them explicitly or the
      # draft is silently built with the Qwen3Config defaults.
      - dflash.dflash_architecture_config.num_hidden_layers=6
      - dflash.dflash_architecture_config.num_key_value_heads=8
      - dflash.dflash_architecture_config.intermediate_size=12288
      # K3's text config exposes no rope_theta, so this is a draft-side choice
      # rather than a value inherited from the backbone.
      - dflash.dflash_architecture_config.rope_theta=10000
      # Semi-AR generation block (dspark.yaml ships 16; the Kimi backbone uses 8).
      - dflash.dflash_block_size=8
      # K3 has no dedicated mask token; 163606 is a reserved slot.
      - dflash.dflash_mask_token_id=163606
      # Sliding-window attention over the context; the block itself stays
      # bidirectional. Must be >= dflash_block_size.
      - dflash.dflash_swa_window_size=1024
    environment:
      - HF_MODEL_CKPT: <<global_vars.hf_model>>
      # 6 evenly-spaced aux capture ids + the true final hidden (93 == the base's
      # num_hidden_layers). The final id requires vllm#50815 on a block-residual
      # backbone; see header.
      - EAGLE_CAPTURE_IDS: "[2,19,36,52,69,86,93]"
      - SERVE_NODES: "8"
      - SERVE_TP: "8"
      - STREAMING_NUM_WORKERS: "4"
      # K3's custom-modeling base needs trust_remote_code at export and serve.
      - EXPORT_EXTRA_ARGS: "--trust_remote_code"
      - SERVE_EXTRA_ARGS: "--trust-remote-code"
      - SERVE_MAX_MODEL_LEN: "4160"
      - SERVE_MAX_NUM_SEQS: "16"
      - SERVE_GPU_MEM_UTIL: "0.9"
      # K3 is large; allow a long load before the trainer gives up on the serve.
      - SERVE_READY_TIMEOUT: "6000"
      - VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "1200"
      - VLLM_ENGINE_ITERATION_TIMEOUT_S: "1200"
      # RDMA transport is UCX (InfiniBand) by default. On AWS EFA, uncomment:
      # - NIXL_BACKENDS: "LIBFABRIC"
      # - FI_PROVIDER: "efa"
      # - NCCL_IB_DISABLE: "1"
    slurm_config:
      _factory_: "slurm_factory"
      nodes: 9
      ntasks_per_node: 1
      gpus_per_node: 8
      # vLLM build with native Kimi-K3 support (vllm/models/kimi_k3) and the
      # final-layer aux-capture fix (vllm#50815).
      container: <vllm-image-with-native-kimi-k3>
