# W4A16 variant of `huggingface/deepseek_v4/ptq/nvfp4_experts_only`, mirroring
# nvidia/DeepSeek-V4-Flash-NVFP4-W4A16.
#
# Identical scope -- routed experts only, everything else in the source format -- but
# the expert *activations* stay BF16, so only the weights drop to NVFP4. That needs no
# activation calibration at all, and it is the variant to reach for in low-concurrency
# deployments where decode is memory-bandwidth-bound rather than compute-bound.

imports:
  base_disable_all: configs/ptq/units/base_disable_all
  nvfp4: configs/numerics/nvfp4

metadata:
  recipe_type: ptq
  description: >-
    DeepSeek-V4 recipe quantizing only the routed-expert weights to NVFP4 (W4A16);
    expert activations stay BF16. Shared experts, attention, router gates, head and the
    MTP block stay in their source format.
quantize:
  algorithm:
    method: max
  quant_cfg:
    - $import: base_disable_all
    - quantizer_name: "*ffn.experts.*.w*_weight_quantizer"
      enable: true
      cfg:
        $import: nvfp4
    - quantizer_name: "*shared_experts*"
      enable: false
    - quantizer_name: "*mtp.*"
      enable: false
