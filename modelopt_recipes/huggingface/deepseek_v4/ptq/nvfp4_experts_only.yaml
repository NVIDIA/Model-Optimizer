# Routed-experts-only NVFP4 PTQ recipe for DeepSeek's native `deepseek_v4` models.
#
# Covers every DeepSeek-V4 release NVIDIA has published a checkpoint for --
# DeepSeek-V4-Pro, DeepSeek-V4-Pro-0813, DeepSeek-V4-Flash and
# DeepSeek-V4-Flash-0731 -- which all use the identical layout: NVFP4 W4A4 on the
# routed experts of every layer, and BF16 for the shared experts, MLA attention
# (`attn.wq_a/wq_b/wkv/wo_a/wo_b`, the `compressor` and `indexer` blocks), router
# gates, `head`, and the whole MTP block.
#
# The source checkpoints ship their routed experts packed as MXFP4 in DeepSeek's
# native layout, so PTQ runs through `examples/deepseek/deepseek_v4/ptq.py` (which
# collects activation ranges against that layout) followed by
# `examples/deepseek/deepseek_v4/quantize_to_nvfp4.py --cast_mxfp4_to_nvfp4`, rather
# than the in-memory `hf_ptq.py` flow. The activation amax collected here is therefore
# the only calibrated quantity that reaches the exported checkpoint.

# modelopt-schema: modelopt.recipe.config.ModelOptPTQRecipe
imports:
  shared_quant_cfg: huggingface/deepseek_v4/ptq/nvfp4_experts_only.quant_cfg

metadata:
  recipe_type: ptq
  description: >-
    DeepSeek-V4 recipe quantizing only the routed-expert linears to NVFP4 (weights and
    activations). Shared experts, attention, router gates, dense projections,
    embeddings, head and the MTP/DSpark speculative-decoding block stay in their source
    format.
quantize:
  algorithm:
    method: max
  quant_cfg:
    - $import: shared_quant_cfg
