# Shared `quant_cfg` snippet for the DeepSeek-V4 family's routed-experts-only NVFP4
# recipe. Imported by `huggingface/deepseek_v4/ptq/nvfp4_experts_only.yaml` and by the
# checkpoint mirrors under `models/deepseek-ai/DeepSeek-V4-*/ptq/`, which all publish
# the same layout: routed experts NVFP4, everything else in the source format.
#
# Module paths follow DeepSeek's native (non-transformers) layout, so the quantizers
# are `layers.<i>.ffn.experts.<j>.w{1,2,3}_{weight,input}_quantizer` -- registered on
# the expert, because `Expert` keeps w1/w2/w3 as plain `nn.Parameter`s (see
# `examples/deepseek/deepseek_v4/ptq.py`). The shared expert instantiates the same
# `Expert` class under a different MoE attribute, so it is disabled explicitly.

# modelopt-schema: modelopt.torch.quantization.config.QuantizerCfgListConfig
imports:
  base_disable_all: configs/ptq/units/base_disable_all
  nvfp4: configs/numerics/nvfp4
---
  # Start from everything disabled. Only Expert and MoE carry Quant wrappers,
  # so no other quantizer instances exist -- this is an explicit safety rail.
  - $import: base_disable_all
  # Routed experts only.
  - quantizer_name: "*ffn.experts.*.w*_weight_quantizer"
    enable: true
    cfg:
      $import: nvfp4
  - quantizer_name: "*ffn.experts.*.w*_input_quantizer"
    enable: true
    cfg:
      $import: nvfp4
  # The shared expert instantiates the same Expert class; keep it disabled
  # even if the patterns above were to match it.
  - quantizer_name: "*shared_experts*"
    enable: false
  # MTP is DeepSeek's speculative-decoding block. Left in the source format
  # unless a dedicated MTP quantization path is added.
  - quantizer_name: "*mtp.*"
    enable: false
