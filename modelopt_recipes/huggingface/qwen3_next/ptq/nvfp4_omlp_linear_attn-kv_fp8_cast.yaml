# NVFP4 "o_proj + MLP/MoE" PTQ recipe for HuggingFace `qwen3_next` models, mirroring
# nvidia/Qwen3-Next-80B-A3B-Instruct-NVFP4 and
# nvidia/Qwen3-Next-80B-A3B-Thinking-NVFP4 (which publish the identical layout).
#
# Qwen3-Next is a hybrid MoE: gated-delta linear-attention layers interleaved with
# full-attention layers (one full-attention layer every fourth layer: 3, 7, 11, ...),
# 512 routed experts plus a shared expert per layer, and a separate top-level `mtp`
# block.
#
# Quantized, NVFP4 W4A4:
#   * the routed experts (`mlp.experts.<i>.{gate,up,down}_proj`)
#   * the shared expert (`mlp.shared_expert.{gate,up,down}_proj`)
#   * the attention OUTPUT projection only (`self_attn.o_proj`)
#   * the linear-attention output projection (`linear_attn.out_proj`)
#
# BF16: `self_attn.{q,k,v}_proj`, the rest of the gated-delta path
# (`linear_attn.conv1d`, `in_proj_qkvz`, `in_proj_ba`), the `mlp.gate` router, the
# `mlp.shared_expert_gate`, `lm_head` and the whole MTP block. KV cache: FP8, cast.
#
# Why this is not the general `nvfp4_omlp_only-kv_fp8_cast`: that recipe stops at
# `self_attn.o_proj`, while this layout also takes `linear_attn.out_proj` -- the
# gated-delta block's output GEMM, which is the same shape and the same kind of "safe"
# projection, and is a large share of the linear-attention layers' weights. The rest of
# the gated-delta path stays BF16, matching the shared
# `default_disabled_quantizers` treatment of `linear_attn.conv1d` / `in_proj_a` /
# `in_proj_b`.

# modelopt-schema: modelopt.recipe.config.ModelOptPTQRecipe
imports:
  base_disable_all: configs/ptq/units/base_disable_all
  default_disabled_quantizers: configs/ptq/units/default_disabled_quantizers
  nvfp4: configs/numerics/nvfp4
  kv_fp8_cast: configs/ptq/units/kv_fp8_cast

metadata:
  recipe_type: ptq
  description: >-
    Qwen3-Next: NVFP4 (W4A4) on the routed experts, the shared expert, the attention
    output projection and the linear-attention output projection, plus an FP8 KV cache
    in cast mode; max calibration. Attention q/k/v, the rest of the gated-delta path,
    routers, lm_head and the MTP block stay BF16.
quantize:
  algorithm:
    method: max
    layerwise: {enable: false}
  quant_cfg:
    - $import: base_disable_all
    # Routed experts and the shared expert.
    - quantizer_name: '*mlp*gate_proj*weight_quantizer*'
      cfg: {$import: nvfp4}
    - quantizer_name: '*mlp*gate_proj*input_quantizer*'
      cfg: {$import: nvfp4}
    - quantizer_name: '*mlp*up_proj*weight_quantizer*'
      cfg: {$import: nvfp4}
    - quantizer_name: '*mlp*up_proj*input_quantizer*'
      cfg: {$import: nvfp4}
    - quantizer_name: '*mlp*down_proj*weight_quantizer*'
      cfg: {$import: nvfp4}
    - quantizer_name: '*mlp*down_proj*input_quantizer*'
      cfg: {$import: nvfp4}
    # Attention output projection only -- q/k/v stay BF16.
    - quantizer_name: '*self_attn.o_proj*weight_quantizer'
      cfg: {$import: nvfp4}
    - quantizer_name: '*self_attn.o_proj*input_quantizer'
      cfg: {$import: nvfp4}
    # Gated-delta output projection.
    - quantizer_name: '*linear_attn.out_proj*weight_quantizer'
      cfg: {$import: nvfp4}
    - quantizer_name: '*linear_attn.out_proj*input_quantizer'
      cfg: {$import: nvfp4}
    - $import: kv_fp8_cast
    - $import: default_disabled_quantizers
    # The remaining gated-delta inputs stay BF16 (in_proj_a / in_proj_b / conv1d are
    # already covered by default_disabled_quantizers; in_proj_qkvz is not).
    - {quantizer_name: '*linear_attn.in_proj_qkvz*', enable: false}
    # MTP block stays BF16 -- MUST stay after the broad `*mlp*` enables above.
    - {quantizer_name: 'mtp.*', enable: false}
