# Nemotron Super 3.5 VL -- **FP8 base** column of the recipe-tier table (plan doc section 4.2).
# 8-bit reference point: everything on the LLM backbone at FP8 W8A8, attention path FP8, vision BF16.
#   MoE experts + shared GEMM  FP8   |  QKV/Out proj  FP8  |  Latent MoE  FP8  |  Mamba Linear  FP8
#   KV cache FP8 | BMM1 FP8 | BMM2 FP8 | lm_head FP8 | embedding BF16 | router FP32 | vision BF16
# Serves on 2xH100 / 1xH200 / 1xB200.
#
# Style: per-model recipe with INLINE rules, matching the other
# huggingface/models/nvidia/*/ptq recipes. Only configs/numerics/* is imported; no
# configs/ptq/units/* composition, so every rule that applies to this model is visible
# in this one file. quant_cfg is ORDERED and the LAST match wins, which is why the
# blanket disable comes first and the vision / MTP guards come last.

imports:
  fp8: configs/numerics/fp8

metadata:
  recipe_type: ptq
  description: >-
    Nemotron 3.5 VL FP8 base tier: FP8 W8A8 across the LLM backbone (experts, shared experts, QKV/Out, l
    atent MoE, Mamba in/out), FP8 attention BMM1/BMM2 and FP8 KV cache, FP8 lm_head; C-RADIO vision enco
    der and connector stay BF16; router/gate and embeddings unquantized. Max calibration.
quantize:
  algorithm:
    method: max
    # layerwise.enable=false is required for VLMs: the decoder layers sit under
    # `model.language_model.layers`, where layerwise_calibrate cannot find them.
    layerwise:
      enable: false
  quant_cfg:
    - quantizer_name: '*'
      enable: false
    - quantizer_name: '*weight_quantizer'
      cfg:
        $import: fp8
    - quantizer_name: '*input_quantizer'
      cfg:
        $import: fp8
    - quantizer_name: '*[qkv]_bmm_quantizer'
      cfg:
        $import: fp8
    - quantizer_name: '*softmax_quantizer'
      cfg:
        $import: fp8
    - quantizer_name: '*p_bmm_quantizer'
      cfg:
        $import: fp8
    - quantizer_name: '*[kv]_bmm_quantizer'
      cfg:
        $import: fp8
    - quantizer_name: '*mixer.conv1d*'
      enable: false
    - quantizer_name: 'mtp.*'
      enable: false
    - quantizer_name: '*mtp.*'
      enable: false
    - quantizer_name: '*embed_vision*'
      enable: false
    - quantizer_name: '*lm_head*weight_quantizer'
      enable: true
      cfg:
        $import: fp8
    - quantizer_name: '*lm_head*input_quantizer'
      enable: true
      cfg:
        $import: fp8
    - quantizer_name: '*vision_model*'
      enable: false
    - quantizer_name: '*vision_projector*'
      enable: false
    - quantizer_name: '*radio_model*'
      enable: false
    - quantizer_name: '*vision_tower*'
      enable: false
    - quantizer_name: '*visual*'
      enable: false
    - quantizer_name: '*multi_modal_projector*'
      enable: false
    - quantizer_name: 'mlp1.*'
      enable: false
    - quantizer_name: '*.mlp1.*'
      enable: false
