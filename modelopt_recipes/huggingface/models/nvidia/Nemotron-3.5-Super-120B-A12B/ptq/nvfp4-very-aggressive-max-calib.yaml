# Nemotron Super 3.5 VL -- **Very-aggressive** tier (plan doc section 4.2). Attention ladder L3 (full):
# KV FP4 + BMM1 FP4 + BMM2 FP4. Blackwell ONLY -- needs FP4 attention kernels not yet in
# vLLM/TRT-LLM, so this tier is DLSim/study-only until the serving team confirms.
#   MoE experts + shared GEMM  NVFP4
#   QKV/Out proj  NVFP4  |  Latent MoE  NVFP4  |  Mamba Linear  NVFP4
#   KV cache FP4 | BMM1 FP4 | BMM2 FP4 | lm_head W4A16 (never W4A4) | embedding BF16 | router FP32
#   vision BF16
# Recovery: PTQ + QAD (+ QARL). Note the plan expects QAD to recover the WEIGHT deltas well but the
#
# Style: per-model recipe with INLINE rules, matching the other
# huggingface/models/nvidia/*/ptq recipes. Only configs/numerics/* is imported; no
# configs/ptq/units/* composition, so every rule that applies to this model is visible
# in this one file. quant_cfg is ORDERED and the LAST match wins, which is why the
# blanket disable comes first and the vision / MTP guards come last.

imports:
  nvfp4: configs/numerics/nvfp4

metadata:
  recipe_type: ptq
  description: >-
    Nemotron 3.5 VL Very-aggressive tier: NVFP4 across MoE routed + shared experts, QKV/Out projections,
     latent MoE and Mamba linears; NVFP4 attention BMM1/BMM2 and NVFP4 KV cache (attention ladder L3); l
    m_head at W4A16 (NVFP4 weights, BF16 activations -- never W4A4); C-RADIO vision BF16. Blackwell-only
    . Max calibration.
quantize:
  algorithm:
    method: max
    # layerwise.enable=false is required for VLMs: the decoder layers sit under
    # `model.language_model.layers`, where layerwise_calibrate cannot find them.
    layerwise:
      enable: false
  quant_cfg:
    # --- base_disable_all ---
    - quantizer_name: '*'
      enable: false
    # --- experts_nvfp4 ---
    - quantizer_name: '*.experts.*weight_quantizer'
      cfg:
        $import: nvfp4
    - quantizer_name: '*.experts.*input_quantizer'
      cfg:
        $import: nvfp4
    # --- shared_experts_nvfp4 ---
    - quantizer_name: '*shared_experts*weight_quantizer'
      cfg:
        $import: nvfp4
    - quantizer_name: '*shared_experts*input_quantizer'
      cfg:
        $import: nvfp4
    # --- attention_proj_nvfp4 ---
    - quantizer_name: '*[qkvo]_proj.weight_quantizer'
      cfg:
        $import: nvfp4
    - quantizer_name: '*[qkvo]_proj.input_quantizer'
      cfg:
        $import: nvfp4
    # --- latent_proj_nvfp4 ---
    - quantizer_name: '*latent_proj.weight_quantizer'
      cfg:
        $import: nvfp4
    - quantizer_name: '*latent_proj.input_quantizer'
      cfg:
        $import: nvfp4
    # --- mamba_proj_nvfp4 ---
    - quantizer_name: '*mixer.in_proj.weight_quantizer'
      cfg:
        $import: nvfp4
    - quantizer_name: '*mixer.in_proj.input_quantizer'
      cfg:
        $import: nvfp4
    - quantizer_name: '*mixer.out_proj.weight_quantizer'
      cfg:
        $import: nvfp4
    - quantizer_name: '*mixer.out_proj.input_quantizer'
      cfg:
        $import: nvfp4
    # --- attention_bmm_nvfp4 ---
    - quantizer_name: '*q_bmm_quantizer'
      cfg:
        $import: nvfp4
    - quantizer_name: '*p_bmm_quantizer'
      cfg:
        $import: nvfp4
    # --- kv_nvfp4 ---
    - quantizer_name: '*[kv]_bmm_quantizer'
      cfg:
        $import: nvfp4
    # --- default_disabled_quantizers ---
    - quantizer_name: '*block_sparse_moe.gate*'
      enable: false
    - quantizer_name: '*linear_attn.conv1d*'
      enable: false
    - quantizer_name: '*linear_attn.in_proj_a*'
      enable: false
    - quantizer_name: '*linear_attn.in_proj_b*'
      enable: false
    - quantizer_name: '*lm_head*'
      enable: false
    - quantizer_name: '*mixer.conv1d*'
      enable: false
    - quantizer_name: '*mlp.gate.*'
      enable: false
    - quantizer_name: '*mlp.shared_expert_gate.*'
      enable: false
    - quantizer_name: '*output_layer*'
      enable: false
    - quantizer_name: '*proj_out.*'
      enable: false
    - quantizer_name: '*router*'
      enable: false
    - quantizer_name: 'mtp.*'
      enable: false
    - quantizer_name: '*mtp.*'
      enable: false
    - quantizer_name: 'output.*'
      enable: false
    - quantizer_name: '*embed_vision*'
      enable: false
    - quantizer_name: '*vision_tower*'
      enable: false
    - quantizer_name: '*visual*'
      enable: false
    - quantizer_name: '*vision_model*'
      enable: false
    - quantizer_name: '*multi_modal_projector*'
      enable: false
    - quantizer_name: '*'
      parent_class: 'nn.BatchNorm1d'
      enable: false
    - quantizer_name: '*'
      parent_class: 'nn.BatchNorm2d'
      enable: false
    - quantizer_name: '*'
      parent_class: 'nn.BatchNorm3d'
      enable: false
    - quantizer_name: '*'
      parent_class: 'nn.LeakyReLU'
      enable: false
    - quantizer_name: '*'
      parent_class: 'nn.Embedding'
      enable: false
    # --- lm_head_w4a16_nvfp4 ---
    - quantizer_name: '*lm_head*weight_quantizer'
      enable: true
      cfg:
        $import: nvfp4
    - quantizer_name: '*lm_head*input_quantizer'
      enable: false
    # --- vision_never_quantize ---
    - quantizer_name: '*vision_model*'
      enable: false
    - quantizer_name: '*vision_projector*'
      enable: false
    - quantizer_name: '*radio_model*'
      enable: false
    - quantizer_name: '*vision_tower*'
      enable: false
    - quantizer_name: '*visual*'
      enable: false
    - quantizer_name: '*multi_modal_projector*'
      enable: false
    - quantizer_name: 'mlp1.*'
      enable: false
    - quantizer_name: '*.mlp1.*'
      enable: false
