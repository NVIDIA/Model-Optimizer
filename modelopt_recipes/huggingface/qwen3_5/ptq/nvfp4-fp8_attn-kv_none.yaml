# W4A4 (NVFP4) MLP / FP8 attention / no KV quantization PTQ recipe for HuggingFace
# `qwen3_5` models. This is the layout `nvidia/Qwen3.8-27B-NVFP4` publishes, and the
# W4A4 twin of `w4a16_nvfp4-fp8_attn-kv_fp8_cast` in this folder.

# modelopt-schema: modelopt.recipe.config.ModelOptPTQRecipe
imports:
  shared_quant_cfg: huggingface/qwen3_5/ptq/nvfp4-fp8_attn-kv_none.quant_cfg

metadata:
  description: >-
    W4A4 (NVFP4) MLP / FP8 attention PTQ recipe for HuggingFace `qwen3_5` models:
    NVFP4 weights and activations for MLP / shared-expert projections and lm_head; FP8
    W8A8 for self-attention and the large linear-attention projections
    (in_proj_qkv / in_proj_z / out_proj); KV cache left unquantized. The
    linear-attention conv1d, in_proj_a / in_proj_b, the vision tower and the MTP block
    stay BF16.
quantize:
  algorithm:
    method: max
    layerwise:
      enable: false
  quant_cfg:
    - $import: shared_quant_cfg
