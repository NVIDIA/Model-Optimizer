# Shared `quant_cfg` snippet for the W4A4 twin of
# `w4a16_nvfp4-fp8_attn-kv_fp8_cast`: the same layer map, but the NVFP4 targets get an
# input quantizer too, and the KV cache is left alone.
#
# This is the layout `nvidia/Qwen3.8-27B-NVFP4` publishes -- NVFP4 W4A4 on the MLP
# projections and `lm_head`, FP8 W8A8 on self-attention and the three large
# linear-attention projections, and no KV-cache quantization at all. Prefer the W4A16
# variant for low-concurrency decode; this one also quantizes the activations, which is
# what pays off at data-center concurrency where the GEMMs are compute-bound.

# modelopt-schema: modelopt.torch.quantization.config.QuantizerCfgListConfig
imports:
  base_disable_all: configs/ptq/units/base_disable_all
  default_disabled_quantizers: configs/ptq/units/default_disabled_quantizers
  fp8: configs/numerics/fp8
  nvfp4: configs/numerics/nvfp4
---
  - $import: base_disable_all

  # W4A4 NVFP4 on MLP projection targets. The gate/up/down projection patterns
  # cover dense MLPs, shared experts, and fused MoE expert quantizers
  # (e.g. gate_up_proj_weight_quantizers.N).
  - quantizer_name: '*mlp*gate_proj*weight_quantizer*'
    cfg: {$import: nvfp4}
  - quantizer_name: '*mlp*gate_proj*input_quantizer*'
    cfg: {$import: nvfp4}
  - quantizer_name: '*mlp*up_proj*weight_quantizer*'
    cfg: {$import: nvfp4}
  - quantizer_name: '*mlp*up_proj*input_quantizer*'
    cfg: {$import: nvfp4}
  - quantizer_name: '*mlp*down_proj*weight_quantizer*'
    cfg: {$import: nvfp4}
  - quantizer_name: '*mlp*down_proj*input_quantizer*'
    cfg: {$import: nvfp4}

  # FP8 self-attention projections.
  - quantizer_name: '*self_attn*weight_quantizer'
    cfg: {$import: fp8}
  - quantizer_name: '*self_attn*input_quantizer'
    cfg: {$import: fp8}

  # FP8 large linear-attention projections. in_proj_a and in_proj_b are
  # re-disabled explicitly below; conv1d stays disabled via base_disable_all
  # (no rule re-enables it).
  - quantizer_name: '*linear_attn.in_proj_qkv*weight_quantizer'
    cfg: {$import: fp8}
  - quantizer_name: '*linear_attn.in_proj_qkv*input_quantizer'
    cfg: {$import: fp8}
  - quantizer_name: '*linear_attn.in_proj_z*weight_quantizer'
    cfg: {$import: fp8}
  - quantizer_name: '*linear_attn.in_proj_z*input_quantizer'
    cfg: {$import: fp8}
  - quantizer_name: '*linear_attn.out_proj*weight_quantizer'
    cfg: {$import: fp8}
  - quantizer_name: '*linear_attn.out_proj*input_quantizer'
    cfg: {$import: fp8}

  # Standard exclusions. Includes `*lm_head*`, re-enabled below.
  - $import: default_disabled_quantizers

  # Qwen-specific exclusions: linear-attention sub-modules that are not in the
  # reference recipe, and any visual / MTP siblings on multimodal releases.
  - quantizer_name: '*linear_attn.in_proj_a*'
    enable: false
  - quantizer_name: '*linear_attn.in_proj_b*'
    enable: false
  - quantizer_name: '*visual*'
    enable: false
  - quantizer_name: '*vision_tower*'
    enable: false
  - quantizer_name: '*mtp*'
    enable: false

  # Re-enable NVFP4 on lm_head weights. Must come after
  # default_disabled_quantizers, which disables `*lm_head*`.
  - quantizer_name: '*lm_head*weight_quantizer'
    cfg: {$import: nvfp4}
  - quantizer_name: '*lm_head*input_quantizer'
    cfg: {$import: nvfp4}
