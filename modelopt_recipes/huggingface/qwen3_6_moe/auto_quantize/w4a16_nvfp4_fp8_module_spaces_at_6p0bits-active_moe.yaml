# Qwen3.6 MoE AutoQuantize search with a normal W4A16 PTQ baseline and explicit
# module-family search spaces. Unmatched modules, including routed experts, use
# the fixed PTQ config and remain in active-MoE effective-bit accounting.

# modelopt-schema: modelopt.recipe.config.ModelOptAutoQuantizeRecipe
imports:
  base_disabled_layers: configs/auto_quantize/units/base_disabled_layers
  fp8: configs/ptq/presets/model/fp8
  w4a16_nvfp4: configs/ptq/presets/model/w4a16_nvfp4

metadata:
  recipe_type: auto_quantize
  description: >-
    Qwen3.6 MoE module-specific search: routed experts fixed to W4A16 NVFP4,
    shared experts, attention, and lm_head searched over W4A16 NVFP4, FP8, and
    BF16, at 6.0 active-MoE effective bits.

# Reuse the normal PTQ preset for every module that is not explicitly searched.
# This baseline remains active during sensitivity scoring and is calibrated,
# costed, and exported as part of the same AutoQuantize operation.
quantize:
  $import: w4a16_nvfp4

auto_quantize:
  constraints:
    effective_bits: 6.0
    cost_model: active_moe
    cost:
      active_moe_expert_ratio: 0.03125

  module_search_spaces:
    # Search these active/sensitive families over W4A16, W8A8/FP8, and BF16.
    - module_name_patterns:
        - "*mlp.shared_expert*"
        - "*linear_attn*"
        - "*self_attn*"
        - "*lm_head*"
      candidate_formats:
        - $import: w4a16_nvfp4
        - $import: fp8
      allow_no_quant: true

  auto_quantize_method: gradient
  score_size: 128

  disabled_layers:
    - $import: base_disabled_layers

  cost_excluded_layers:
    - "*visual*"
    - "*mtp*"
    - "*vision_tower*"
