# Qwen3.6 MoE AutoQuantize search with module-family-specific candidate spaces.
# Routed experts are fixed to W4A16 NVFP4 but remain in active-MoE effective-bit
# accounting. Shared experts and hybrid-attention projections select between
# W4A16 NVFP4 and FP8. Routed experts remain W4A16 during scoring; searched
# multi-format families retain BF16 only as an internal scoring baseline.

# modelopt-schema: modelopt.recipe.config.ModelOptAutoQuantizeRecipe
imports:
  base_disabled_layers: configs/auto_quantize/units/base_disabled_layers
  fp8: configs/ptq/presets/model/fp8
  w4a16_nvfp4: configs/ptq/presets/model/w4a16_nvfp4

metadata:
  recipe_type: auto_quantize
  description: >-
    Qwen3.6 MoE module-specific search: routed experts fixed to W4A16 NVFP4,
    shared experts and attention searched over W4A16 NVFP4 and FP8, at 6.0
    active-MoE effective bits.

auto_quantize:
  constraints:
    effective_bits: 6.0
    cost_model: active_moe
    cost:
      active_moe_expert_ratio: 0.03125

  # Fallback for unmatched searchable modules, including lm_head. BF16/no-quant
  # remains an implicit choice only for this fallback search space.
  candidate_formats:
    - $import: w4a16_nvfp4
    - $import: fp8

  module_search_spaces:
    # One selectable format makes routed experts fixed W4A16. allow_no_quant
    # controls solver choices only; their BF16-equivalent denominator cost and
    # active-MoE ratio remain part of effective-bit accounting.
    - module_name_patterns:
        - "*mlp.experts*"
        - "*mixer.experts*"
      candidate_formats:
        - $import: w4a16_nvfp4
      allow_no_quant: false

    # Search these active/sensitive families only between W4A16 and W8A8/FP8.
    - module_name_patterns:
        - "*mlp.shared_expert*"
        - "*linear_attn*"
        - "*self_attn*"
      candidate_formats:
        - $import: w4a16_nvfp4
        - $import: fp8
      allow_no_quant: false

  auto_quantize_method: gradient
  score_size: 128

  disabled_layers:
    - $import: base_disabled_layers

  cost_excluded_layers:
    - "*visual*"
    - "*mtp*"
    - "*vision_tower*"
