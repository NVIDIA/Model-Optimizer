# Qwen3.6 MoE P0 reproduction lane. The HF PTQ command selects the long-code
# calibration data; this recipe captures the old P0 score and allocation axes.

# modelopt-schema: modelopt.recipe.config.ModelOptAutoQuantizeRecipe
imports:
  base_disabled_layers: configs/auto_quantize/units/base_disabled_layers
  fp8: configs/ptq/presets/model/fp8
  w4a16_nvfp4: configs/ptq/presets/model/w4a16_nvfp4

metadata:
  recipe_type: auto_quantize
  description: >-
    Qwen3.6 MoE: local-gradient scores with grouped FP8/W4A16 NVFP4 decisions at
    6.0 active-MoE effective bits, matching the confirmed P0 score provenance.

auto_quantize:
  constraints:
    effective_bits: 6.0
    cost_model: active_moe
    cost:
      active_moe_expert_ratio: 0.03125
    score_model: per_element

  candidate_formats:
    - $import: fp8
    - $import: w4a16_nvfp4

  auto_quantize_method: gradient
  score_boundary: local
  quant_grouping_scheme: runtime_fused+linear_attn_layer+self_attn_layer
  score_size: 64

  disabled_layers:
    - $import: base_disabled_layers

  cost_excluded_layers:
    - "*visual*"
    - "*mtp*"
    - "*vision_tower*"
