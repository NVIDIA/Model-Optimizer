# Qwen3.6 MoE AutoQuantize: normalized group-output reconstruction scoring over
# mixed FP8 + NVFP4 weight-only candidates with active-MoE cost accounting.

# modelopt-schema: modelopt.recipe.config.ModelOptAutoQuantizeRecipe
imports:
  base_disabled_layers: configs/auto_quantize/units/base_disabled_layers
  fp8: configs/ptq/presets/model/fp8
  w4a16_nvfp4: configs/ptq/presets/model/w4a16_nvfp4

metadata:
  recipe_type: auto_quantize
  description: >-
    Qwen3.6 MoE: FP8 + NVFP4-weight-only search at 5.5 effective bits using
    per-element normalized group reconstruction scores and active-MoE cost accounting.

auto_quantize:
  constraints:
    effective_bits: 5.5
    cost_model: active_moe
    cost:
      active_moe_expert_ratio: 0.03125
    score_model: per_element

  candidate_formats:
    - $import: fp8
    - $import: w4a16_nvfp4

  auto_quantize_method: group_recon
  score_boundary: group
  score_size: 128

  disabled_layers:
    - $import: base_disabled_layers

  cost_excluded_layers:
    - "*visual*"
    - "*mtp*"
    - "*vision_tower*"
