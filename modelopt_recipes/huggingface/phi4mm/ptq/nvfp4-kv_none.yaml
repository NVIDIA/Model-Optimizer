# NVFP4 W4A4 PTQ recipe for HuggingFace `phi4mm` (Phi-4-multimodal) models, mirroring
# nvidia/Phi-4-multimodal-instruct-NVFP4.
#
# Quantizes the language decoder's four projections -- `self_attn.qkv_proj`,
# `self_attn.o_proj`, `mlp.gate_up_proj`, `mlp.down_proj` -- at their LoRA
# `base_layer`, and nothing else. The speech/vision LoRA adapters, both encoders under
# `model.embed_tokens_extend`, and `lm_head` stay BF16; see
# `disabled_quantizers.yaml` in this folder for why those need patterns of their own.
# The KV cache is left unquantized, matching the published checkpoints
# (`kv_cache_quant_algo: null`).

imports:
  base_disable_all: configs/ptq/units/base_disable_all
  disabled_quantizers: huggingface/phi4mm/ptq/disabled_quantizers
  w4a4_nvfp4_nvfp4: configs/ptq/units/w4a4_nvfp4_nvfp4

metadata:
  recipe_type: ptq
  description: >-
    Phi-4-multimodal: NVFP4 W4A4 on the language decoder's LoRA base layers
    (qkv_proj / o_proj / gate_up_proj / down_proj); max calibration; KV cache left
    unquantized. The speech and vision LoRA adapters, both multimodal encoders and
    lm_head stay BF16.
quantize:
  algorithm: max
  quant_cfg:
    - $import: base_disable_all
    - $import: w4a4_nvfp4_nvfp4
    - $import: disabled_quantizers
