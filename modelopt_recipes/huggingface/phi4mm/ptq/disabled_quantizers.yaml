# Shared exclusions for HuggingFace `phi4mm` (Phi-4-multimodal) models.
#
# Phi-4-multimodal keeps the language decoder's four projections wrapped in LoRA
# containers -- `self_attn.qkv_proj`, `self_attn.o_proj`, `mlp.gate_up_proj` and
# `mlp.down_proj` each expose a `base_layer` plus `lora_A.{speech,vision}` /
# `lora_B.{speech,vision}` adapters -- and hangs both encoders off
# `model.embed_tokens_extend` (`image_embed.img_processor.*` for the SigLIP vision
# tower, `audio_embed.encoder.*` for the Conformer speech encoder).
#
# Neither shape is covered by the shared `default_disabled_quantizers`: its
# `*vision_tower*` / `*visual*` / `*embed_vision*` patterns do not match
# `embed_tokens_extend.image_embed.*`, and it says nothing about LoRA adapters. Both
# published Phi-4-multimodal checkpoints quantize only the `base_layer` of the four
# decoder projections, so these extra patterns are what make a full-model recipe
# reproduce them.
#
# The LoRA adapters must stay full precision: they are low-rank (rank 320 / 256 here),
# so 4-bit blocks would swamp them, and they are the modality-switching path -- an
# adapter degraded by quantization degrades exactly the multimodal behaviour the
# checkpoint exists for.

# Recipes that import this should NOT also import `default_disabled_quantizers`.

# modelopt-schema: modelopt.torch.quantization.config.QuantizerCfgListConfig
imports:
  default_disabled_quantizers: configs/ptq/units/default_disabled_quantizers
---
  - $import: default_disabled_quantizers
  - quantizer_name: '*lora_A*'
    enable: false
  - quantizer_name: '*lora_B*'
    enable: false
  - quantizer_name: '*embed_tokens_extend*'
    enable: false
