# Llama-Nemotron embedding/reranking PTQ recipe: FP8 W8A8 plus per-tensor FP8
# output quantizers on the projection Linears, so TensorRT picks FP8-output
# GEMM kernels and carries FP8 activations between layers. Without output-side
# quantization, FP8 GEMMs emit FP16 and each input Q/DQ adds an FP8 copy on
# top of the FP16 activations, so the engine uses MORE activation memory than
# an unquantized FP16 engine. [5726458]

imports:
  base_disable_all: configs/ptq/units/base_disable_all
  w8a8_fp8_fp8: configs/ptq/units/w8a8_fp8_fp8
  default_disabled_quantizers: configs/ptq/units/default_disabled_quantizers
  fp8: configs/numerics/fp8

metadata:
  recipe_type: ptq
  description: 'Llama-Nemotron embedding/reranking PTQ recipe (fp8 + projection output quantizers): same numerics as the general fp8 preset, plus per-tensor
    FP8 output quantizers on the projection Linears so TensorRT engines carry FP8 activations between layers.'
quantize:
  algorithm: max
  quant_cfg:
    - $import: base_disable_all
    - $import: w8a8_fp8_fp8
    - $import: default_disabled_quantizers
    - quantizer_name: '*_proj.output_quantizer'
      cfg:
        $import: fp8
    - quantizer_name: '*score*'
      enable: false
