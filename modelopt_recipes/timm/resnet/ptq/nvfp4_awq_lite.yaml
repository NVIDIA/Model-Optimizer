imports:
  base_disable_all: configs/ptq/units/base_disable_all
  default_disabled_quantizers: configs/ptq/units/default_disabled_quantizers
  nvfp4: configs/ptq/units/w4a4_nvfp4_nvfp4
  resnet: timm/resnet/ptq/static_fp8.quant_cfg

metadata:
  recipe_type: ptq
  description: NVFP4 AWQ-lite ResNet PTQ with FP8 convolution and residual inputs.

quantize:
  algorithm: awq_lite
  quant_cfg:
    - $import: base_disable_all
    - $import: nvfp4
    - $import: default_disabled_quantizers
    - $import: resnet
