# modelopt-schema: modelopt.torch.quantization.config.QuantizerCfgListConfig
imports:
  fp8: configs/numerics/fp8
---
  - parent_class: nn.Conv2d
    quantizer_name: '*weight_quantizer'
    cfg:
      $import: fp8
  - parent_class: nn.Conv2d
    quantizer_name: '*input_quantizer'
    cfg:
      $import: fp8
  - parent_class: timm.ResNetInputConv2d
    quantizer_name: '*input_quantizer'
    enable: false
  - quantizer_name: '*block_input_activation_quantizer'
    cfg:
      $import: fp8
  - quantizer_name: '*residual_quantizer'
    cfg:
      $import: fp8
  - parent_class: timm.ResNetStemConv2d
    quantizer_name: '*'
    enable: false
  - parent_class: nn.MaxPool2d
    quantizer_name: '*input_quantizer'
    enable: false
  - parent_class: nn.AvgPool2d
    quantizer_name: '*input_quantizer'
    enable: false
  - parent_class: nn.AdaptiveAvgPool2d
    quantizer_name: '*input_quantizer'
    enable: false
