# Alias recipe for nvidia/MiniMax-M3-NVFP4 (source MiniMaxAI/MiniMax-M3). Same recipe as `model_type/minimax_m3_vl/ptq/mxfp8_nvfp4_experts`: MXFP8 on the
# language-model linears with MSE-calibrated NVFP4 routed experts whose `input_scale` is
# pinned to 1.0; the vision branch, routers, `lm_head` and KV cache stay unquantized.
# This entry makes that architecture recipe reachable from the checkpoint's own hub path.

imports:
  base: model_type/minimax_m3_vl/ptq/mxfp8_nvfp4_experts

$import: base
metadata:
  description: >-
    MiniMaxAI/MiniMax-M3 quantized with the minimax_m3_vl mixed MXFP8 + NVFP4-experts
    scheme, as published in nvidia/MiniMax-M3-NVFP4.
