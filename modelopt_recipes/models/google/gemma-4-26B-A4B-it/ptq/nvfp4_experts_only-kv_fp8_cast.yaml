# Alias recipe for nvidia/Gemma-4-26B-A4B-NVFP4 (source google/gemma-4-26B-A4B-it). Same recipe as `general/ptq/nvfp4_experts_only-kv_fp8_cast`: NVFP4 on the routed experts
# only, max calibration, with an FP8 KV cache in cast mode. The dense MLPs, router,
# attention, vision tower and `lm_head` stay BF16.

imports:
  base: general/ptq/nvfp4_experts_only-kv_fp8_cast

$import: base
metadata:
  description: >-
    google/gemma-4-26B-A4B-it quantized with the general expert-only NVFP4 scheme (max
    calibration) and an FP8 KV cache in cast mode, as published in
    nvidia/Gemma-4-26B-A4B-NVFP4.
