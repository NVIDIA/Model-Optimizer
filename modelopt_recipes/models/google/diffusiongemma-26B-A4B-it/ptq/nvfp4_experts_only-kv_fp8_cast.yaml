# Alias recipe for nvidia/diffusiongemma-26B-A4B-it-NVFP4 (source google/diffusiongemma-26B-A4B-it). Same recipe as `general/ptq/nvfp4_experts_only-kv_fp8_cast`: NVFP4 on the routed experts
# only, max calibration, with an FP8 KV cache in cast mode -- the same scheme as the
# gemma-4-26B-A4B-it release. This model nests its decoder under `model.decoder.layers`
# rather than `model.language_model.layers`, which the recipe's `*.experts.*` patterns
# match either way.

imports:
  base: general/ptq/nvfp4_experts_only-kv_fp8_cast

$import: base
metadata:
  description: >-
    google/diffusiongemma-26B-A4B-it quantized with the general expert-only NVFP4 scheme
    (max calibration) and an FP8 KV cache in cast mode, as published in
    nvidia/diffusiongemma-26B-A4B-it-NVFP4.
