# Alias recipe for nvidia/GLM-5.1-NVFP4 (source zai-org/GLM-5.1). Same recipe as
# `general/ptq/nvfp4_experts_only-kv_fp8_cast`: NVFP4 on the routed experts with calibrated
# activation scales, and an FP8 KV cache in cast mode.
#
# Not the `input_scale1` variant, despite the sibling GLM-5.2 entry using it. That recipe
# pins the expert activation amax to a constant 2688.0 (E2M1_MAX * E4M3_MAX) so every
# exported expert `input_scale` is exactly 1.0. GLM-5.2's are; GLM-5.1's are calibrated
# values (sampled 0 of 8 equal to 1.0, spanning 3.4e-4 to 1.3e-2), so this release used
# ordinary activation calibration.

imports:
  base: general/ptq/nvfp4_experts_only-kv_fp8_cast

$import: base
metadata:
  description: >-
    zai-org/GLM-5.1 quantized with the general expert-only NVFP4 scheme (max calibration)
    and an FP8 KV cache in cast mode, as published in nvidia/GLM-5.1-NVFP4.
