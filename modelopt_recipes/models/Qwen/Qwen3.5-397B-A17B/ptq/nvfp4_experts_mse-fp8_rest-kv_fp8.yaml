# Alias recipe for nvidia/Qwen3.5-397B-A17B-NVFP4-V2 (source Qwen/Qwen3.5-397B-A17B). The
# qwen3_5_moe architecture recipe already produces this release's scheme -- NVFP4 (MSE static
# weights, dynamic inputs) on the LM routed experts, ModelOpt-default FP8 elsewhere, and an FP8
# KV cache -- so this entry imports that recipe wholesale instead of copying its body.

imports:
  base: model_type/qwen3_5_moe/ptq/nvfp4_experts_mse-fp8_rest-kv_fp8

$import: base
metadata:
  description: >-
    Qwen/Qwen3.5-397B-A17B quantized with the qwen3_5_moe architecture recipe -- NVFP4 (MSE
    static weights, dynamic inputs) on the LM routed experts, ModelOpt-default FP8 on every other
    Linear layer, and an FP8 KV cache -- as published in nvidia/Qwen3.5-397B-A17B-NVFP4-V2.
