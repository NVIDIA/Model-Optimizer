# Recipe for Qwen/Qwen3.5-397B-A17B, mirroring nvidia/Qwen3.5-397B-A17B-NVFP4-V2 --
# the second, mixed-precision release. (The first release,
# nvidia/Qwen3.5-397B-A17B-NVFP4, is plain routed-experts-only NVFP4 and is reproduced
# by the general `general/ptq/nvfp4_experts_only-kv_fp8_cast`.)
#
# Qwen3.5-397B-A17B is a `qwen3_5_moe` VLM MoE: 60 decoder layers with hybrid attention
# -- gated-delta (linear-attention) layers interleaved with full-attention layers
# (3, 7, 11, ... every fourth) -- 512 routed experts plus a shared expert per layer, a
# vision tower, and a separate top-level `mtp` block.
#
# What V2 adds over the first release is FP8 on everything the first release left BF16
# in the language path:
#
#   routed experts             NVFP4  (W4A4)
#   shared expert              FP8    (W8A8 per-tensor)
#   self-attention q/k/v/o     FP8    (W8A8, the 15 full-attention layers)
#   linear-attention           FP8    (W8A8, in_proj_qkv / in_proj_z / out_proj only)
#   linear-attention conv1d,
#     in_proj_a, in_proj_b     BF16
#   router gate,
#     shared_expert_gate       BF16
#   vision tower, lm_head, MTP BF16
#   KV cache                   FP8    (calibrated -- the published k_scale is 0.0234,
#                                      not the 1.0 a constant amax would give)
#
# Contrast with `models/Qwen/Qwen3.8-2.4T-A95B`, the other hybrid-attention Qwen mirror:
# there the *whole* gated-delta path including `conv1d`, `in_proj_a` and `in_proj_b`
# goes to FP8, and the routed-expert weight scales are MSE-searched. Here only the three
# large linear-attention projections are quantized and the experts use max calibration.

# modelopt-schema: modelopt.recipe.config.ModelOptPTQRecipe
imports:
  base_disable_all: configs/ptq/units/base_disable_all
  default_disabled_quantizers: configs/ptq/units/default_disabled_quantizers
  nvfp4: configs/numerics/nvfp4
  fp8: configs/numerics/fp8
  kv_fp8: configs/ptq/units/kv_fp8

metadata:
  description: >-
    Qwen3.5-397B-A17B (V2 release): NVFP4 (W4A4) on the routed experts; FP8 (W8A8) on
    the shared expert, all self-attention projections and the large linear-attention
    projections (in_proj_qkv / in_proj_z / out_proj); calibrated FP8 KV cache; max
    calibration. The linear-attention conv1d / in_proj_a / in_proj_b, the routers, the
    vision tower, lm_head and the MTP block stay BF16.
quantize:
  algorithm:
    method: max
    # Required for VLMs: the decoder layers nest under `model.language_model.layers`,
    # where layerwise_calibrate cannot find them.
    layerwise: {enable: false}
  quant_cfg:
    - $import: base_disable_all
    # Routed experts -> NVFP4 W4A4.
    - quantizer_name: '*mlp.experts.*weight_quantizer'
      cfg: {$import: nvfp4}
    - quantizer_name: '*mlp.experts.*input_quantizer'
      cfg: {$import: nvfp4}
    # Shared expert -> FP8 W8A8.
    - quantizer_name: '*mlp.shared_expert.*weight_quantizer'
      cfg: {$import: fp8}
    - quantizer_name: '*mlp.shared_expert.*input_quantizer'
      cfg: {$import: fp8}
    # Self-attention -> FP8 W8A8.
    - quantizer_name: '*self_attn*weight_quantizer'
      cfg: {$import: fp8}
    - quantizer_name: '*self_attn*input_quantizer'
      cfg: {$import: fp8}
    # The three large linear-attention projections -> FP8 W8A8.
    - quantizer_name: '*linear_attn.in_proj_qkv*weight_quantizer'
      cfg: {$import: fp8}
    - quantizer_name: '*linear_attn.in_proj_qkv*input_quantizer'
      cfg: {$import: fp8}
    - quantizer_name: '*linear_attn.in_proj_z*weight_quantizer'
      cfg: {$import: fp8}
    - quantizer_name: '*linear_attn.in_proj_z*input_quantizer'
      cfg: {$import: fp8}
    - quantizer_name: '*linear_attn.out_proj*weight_quantizer'
      cfg: {$import: fp8}
    - quantizer_name: '*linear_attn.out_proj*input_quantizer'
      cfg: {$import: fp8}
    # Calibrated FP8 KV cache.
    - $import: kv_fp8
    - $import: default_disabled_quantizers
    # MUST stay last: the vision tower and the MTP block reuse the leaf names the
    # broad patterns above match.
    - {quantizer_name: '*visual*', enable: false}
    - {quantizer_name: 'mtp.*', enable: false}
