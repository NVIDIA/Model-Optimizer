# modelopt-schema: modelopt.recipe.config.ModelOptAutoQuantizeRecipe
imports:
  iq2_xxs: configs/numerics/iq2_xxs
  iq2_xs: configs/numerics/iq2_xs
  iq2_s: configs/numerics/iq2_s
  w4a16_nvfp4: configs/ptq/presets/model/w4a16_nvfp4
  fp8: configs/numerics/fp8

metadata:
  description: >-
    Qwen3.6-35B-A3B routed experts searched over IQ2_XXS/IQ2_XS/IQ2_S (local GPTQ + imatrix),
    NVFP4, FP8 and BF16 at 2.75 effective bits over all linears except embeddings, lm_head and
    vision; other linears stay BF16. Sequential GPTQ finalizes the selected formats: run once to
    search, then rerun the same command to finalize and export (shared --auto_quantize_checkpoint).
quantize:
  quant_cfg:
    - quantizer_name: "*"
      enable: false
# Routed experts choose IQ2_XXS, IQ2_XS, IQ2_S, NVFP4, FP8 or BF16; every other linear stays BF16
# and counts toward the budget. All candidates are weight-only, since the cost counts weight bits
# and the IQ2 formats are W2A16.
auto_quantize:
  constraints:
    effective_bits: 2.75
  module_search_spaces:
    - module_name_patterns: ["*mlp.experts*"]
      candidate_formats:
        # GPTQ on BF16 inputs (local): a layer's score must not depend on earlier layers' picks.
        - algorithm: &local_gptq
            - method: gptq
              block_size: 256
              perc_damp: 0.3
              importance_weighted: true
              layerwise: {enable: true, get_qdq_activations_from_prev_layer: false}
            - method: imatrix
          quant_cfg:
            - &disable_all {quantizer_name: "*", enable: false}
            - quantizer_name: "*weight_quantizer"
              cfg: {$import: iq2_xxs}
        - algorithm: *local_gptq
          quant_cfg:
            - *disable_all
            - quantizer_name: "*weight_quantizer"
              cfg: {$import: iq2_xs}
        - algorithm: *local_gptq
          quant_cfg:
            - *disable_all
            - quantizer_name: "*weight_quantizer"
              cfg: {$import: iq2_s}
        - $import: w4a16_nvfp4
        - quant_cfg:
            - *disable_all
            - quantizer_name: "*weight_quantizer"
              cfg: {$import: fp8}
      allow_no_quant: true
  # Score each candidate's output KL with every other expert layer at IQ2_XXS: at these budgets a
  # layer's damage compounds with the others', which BF16-context scores underrate for late layers.
  auto_quantize_method: kl_div
  method_options: {context_quant_level: lowest}
  # Once the formats are frozen, sequential GPTQ calibrates each layer on its quantized predecessors.
  finalize_algorithm:
    - method: gptq
      block_size: 256
      perc_damp: 0.3
      importance_weighted: true
      layerwise: {enable: true}
    - method: imatrix
  cost_excluded_layers: ["*embed*", "*lm_head*", "*visual*", "*vision*"]
