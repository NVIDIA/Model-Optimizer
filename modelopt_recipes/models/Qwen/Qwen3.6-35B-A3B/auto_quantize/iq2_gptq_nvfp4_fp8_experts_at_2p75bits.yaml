# modelopt-schema: modelopt.recipe.config.ModelOptAutoQuantizeRecipe
imports:
  search: models/Qwen/Qwen3.6-35B-A3B/auto_quantize/iq2_gptq_nvfp4_fp8_experts.search

metadata:
  description: >-
    Qwen3.6-35B-A3B routed experts searched over IQ2_XXS/IQ2_XS/IQ2_S (local GPTQ + imatrix),
    NVFP4, FP8 and BF16 at 2.75 effective bits over all linears except embeddings, lm_head and
    vision; other linears stay BF16. Sequential GPTQ finalizes the selected formats: run once to
    search, then rerun the same command to finalize and export (shared --auto_quantize_checkpoint).
quantize:
  quant_cfg:
    - quantizer_name: "*"
      enable: false
auto_quantize:
  $import: search
  constraints:
    effective_bits: 2.75
