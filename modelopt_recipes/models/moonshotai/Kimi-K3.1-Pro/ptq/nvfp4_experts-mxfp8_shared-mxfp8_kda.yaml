# Checkpoint-mirror recipe for nvidia/Kimi-K3.1-Pro-NVFP4. The source
# moonshotai/Kimi-K3.1-Pro routed experts are already packed as MXFP4, so
# examples/kimi/kimi_k3/quantize_to_nvfp4.py applies this layout as a streaming
# checkpoint conversion (no calibration data, no GPU) rather than loading the
# complete model through examples/hf_ptq/hf_ptq.py.
#
# Layer map (0-indexed module names; config.json linear_attn_config is 1-indexed):
#   MLA layers: 3, 7, 11, ..., 91 and 92 (24 layers)  -> attention stays BF16
#   KDA layers: the other 69 (0-92)                   -> attention MXFP8
#   Layer 0 has a dense MLP (no experts, no shared experts) -> BF16

# modelopt-schema: modelopt.recipe.config.ModelOptPTQRecipe
imports:
  base_disable_all: configs/ptq/units/base_disable_all
  default_disabled_quantizers: configs/ptq/units/default_disabled_quantizers
  mxfp8: configs/numerics/mxfp8
  nvfp4: configs/numerics/nvfp4

metadata:
  description: >-
    Kimi-K3.1-Pro checkpoint-mirror recipe: calibration-free MXFP4-to-NVFP4
    routed experts with input_scale fixed to 1.0, dynamic MXFP8 (W8A8, E8M0
    scale per 32) shared experts and KDA attention projections. MLA attention,
    KDA f_b_proj, the dense layer-0 MLP, LatentMoE routed_expert projections,
    routers, convolutions, norms, the DSA indexer, the vision tower, lm_head,
    and KV cache stay unquantized.

quantize:
  algorithm:
    method: max
    layerwise:
      enable: false
    skip_forward_without_activation_calib: true
  quant_cfg:
    - $import: base_disable_all
    # Routed experts: cast directly from the source MXFP4 representation.
    - quantizer_name: "*block_sparse_moe.experts.*weight_quantizer"
      cfg:
        $import: nvfp4
    - quantizer_name: "*block_sparse_moe.experts.*input_quantizer"
      cfg:
        $import: nvfp4
        # 2688 = E2M1_MAX * E4M3_MAX = 6 * 448, so input_scale is exactly 1.0.
        constant_amax: 2688.0
    # Shared experts: MXFP8 weights and dynamic MXFP8 activations.
    - quantizer_name: "*block_sparse_moe.shared_experts.*weight_quantizer"
      cfg: &mxfp8
        $import: mxfp8
    - quantizer_name: "*block_sparse_moe.shared_experts.*input_quantizer"
      cfg: *mxfp8
    # KDA projections. q/k/v/b/f_a exist only on KDA layers; vLLM fuses them
    # with g_proj into in_proj_qkvgfab, so all six share one format.
    - quantizer_name: "*self_attn.q_proj*_quantizer"
      cfg: *mxfp8
    - quantizer_name: "*self_attn.k_proj*_quantizer"
      cfg: *mxfp8
    - quantizer_name: "*self_attn.v_proj*_quantizer"
      cfg: *mxfp8
    - quantizer_name: "*self_attn.b_proj*_quantizer"
      cfg: *mxfp8
    - quantizer_name: "*self_attn.f_a_proj*_quantizer"
      cfg: *mxfp8
    # o_proj / g_proj exist on both attention types: enable everywhere, then
    # turn them back off on the 24 MLA layers below.
    - quantizer_name: "*self_attn.o_proj*_quantizer"
      cfg: *mxfp8
    - quantizer_name: "*self_attn.g_proj*_quantizer"
      cfg: *mxfp8
    - {quantizer_name: "*.layers.3.self_attn.*", enable: false}
    - {quantizer_name: "*.layers.7.self_attn.*", enable: false}
    - {quantizer_name: "*.layers.11.self_attn.*", enable: false}
    - {quantizer_name: "*.layers.15.self_attn.*", enable: false}
    - {quantizer_name: "*.layers.19.self_attn.*", enable: false}
    - {quantizer_name: "*.layers.23.self_attn.*", enable: false}
    - {quantizer_name: "*.layers.27.self_attn.*", enable: false}
    - {quantizer_name: "*.layers.31.self_attn.*", enable: false}
    - {quantizer_name: "*.layers.35.self_attn.*", enable: false}
    - {quantizer_name: "*.layers.39.self_attn.*", enable: false}
    - {quantizer_name: "*.layers.43.self_attn.*", enable: false}
    - {quantizer_name: "*.layers.47.self_attn.*", enable: false}
    - {quantizer_name: "*.layers.51.self_attn.*", enable: false}
    - {quantizer_name: "*.layers.55.self_attn.*", enable: false}
    - {quantizer_name: "*.layers.59.self_attn.*", enable: false}
    - {quantizer_name: "*.layers.63.self_attn.*", enable: false}
    - {quantizer_name: "*.layers.67.self_attn.*", enable: false}
    - {quantizer_name: "*.layers.71.self_attn.*", enable: false}
    - {quantizer_name: "*.layers.75.self_attn.*", enable: false}
    - {quantizer_name: "*.layers.79.self_attn.*", enable: false}
    - {quantizer_name: "*.layers.83.self_attn.*", enable: false}
    - {quantizer_name: "*.layers.87.self_attn.*", enable: false}
    - {quantizer_name: "*.layers.91.self_attn.*", enable: false}
    - {quantizer_name: "*.layers.92.self_attn.*", enable: false}
    - $import: default_disabled_quantizers
