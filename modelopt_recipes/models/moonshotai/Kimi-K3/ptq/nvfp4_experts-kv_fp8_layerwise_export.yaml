imports:
  base_disable_all: configs/ptq/units/base_disable_all
  default_disabled_quantizers: configs/ptq/units/default_disabled_quantizers
  nvfp4: configs/numerics/nvfp4
  kv_fp8: configs/ptq/units/kv_fp8

metadata:
  recipe_type: ptq
  description: >-
    Kimi-K3 NVFP4 W4A4 on routed experts only with an FP8 KV cache, max layerwise
    calibration, and each decoder layer exported to its own shard as soon as it is
    calibrated. Shared experts, attention, routers, norms and lm_head stay unquantized:
    the expert scope is narrower than the general layerwise-export recipe's, which is why
    this lives here rather than in the general tier.

    An interrupted run resumes without recalibrating or re-exporting finished layers,
    losing at most the in-flight one. Resume state goes beside the checkpoint at
    <export_path>.layerwise_resume unless layerwise.checkpoint_dir says otherwise; keep it
    off container-local storage, or a run that outlasts its session finds a wiped manifest.
    Because a resumed run never recalibrates the layers it skipped, the exported checkpoint
    is complete but the in-memory model is not and must not be used for inference.

    Validated on a model too large to hold resident, but nothing here configures offload:
    that comes from --offload_folder and the memory budgets.

quantize:
  algorithm:
    method: max
    layerwise:
      enable: true
      # max only updates _amax, so the exported shard stays valid for its layer.
      calib_mutates_weights: false
      # Presence enables per-layer export; the value is replaced with --export_path.
      export_dir: /tmp/modelopt_layerwise_export
  quant_cfg:
    - $import: base_disable_all
    - quantizer_name: '*.experts.*weight_quantizer'
      cfg:
        $import: nvfp4
    - quantizer_name: '*.experts.*input_quantizer'
      cfg:
        $import: nvfp4
    - $import: kv_fp8
    - $import: default_disabled_quantizers
