# Checkpoint-mirror recipe for nvidia/Kimi-K3-NVFP4. The source Kimi-K3 routed
# experts are already packed as MXFP4, so examples/kimi/kimi_k3/quantize_to_nvfp4.py
# applies this layout as a streaming checkpoint conversion rather than loading
# the complete model through examples/hf_ptq/hf_ptq.py.

imports:
  base_disable_all: configs/ptq/units/base_disable_all
  default_disabled_quantizers: configs/ptq/units/default_disabled_quantizers
  fp8: configs/numerics/fp8
  nvfp4: configs/numerics/nvfp4

metadata:
  recipe_type: ptq
  description: >-
    Kimi-K3 checkpoint-mirror recipe with calibration-free MXFP4-to-NVFP4
    routed experts, expert input_scale fixed to 1.0, and 128x128 block-FP8
    weight-only KDA and MLA attention projections. Shared and latent experts,
    routers, convolutions, norms, the vision tower, lm_head, and KV cache stay
    unquantized.

quantize:
  algorithm:
    method: max
    layerwise:
      enable: false
    skip_forward_without_activation_calib: true
  quant_cfg:
    - $import: base_disable_all
    # Routed experts are cast directly from the source MXFP4 representation.
    - quantizer_name: "*block_sparse_moe.experts.*weight_quantizer"
      cfg:
        $import: nvfp4
    - quantizer_name: "*block_sparse_moe.experts.*input_quantizer"
      cfg:
        $import: nvfp4
        # 2688 = E2M1_MAX * E4M3_MAX = 6 * 448, so input_scale is exactly 1.0.
        constant_amax: 2688.0
    # KDA projections.
    - quantizer_name: "*self_attn.q_proj*weight_quantizer"
      cfg: &fp8_pb_weight
        $import: fp8
        block_sizes:
          -1: 128
          -2: 128
    - quantizer_name: "*self_attn.k_proj*weight_quantizer"
      cfg: *fp8_pb_weight
    - quantizer_name: "*self_attn.v_proj*weight_quantizer"
      cfg: *fp8_pb_weight
    - quantizer_name: "*self_attn.b_proj*weight_quantizer"
      cfg: *fp8_pb_weight
    - quantizer_name: "*self_attn.f_a_proj*weight_quantizer"
      cfg: *fp8_pb_weight
    - quantizer_name: "*self_attn.f_b_proj*weight_quantizer"
      cfg: *fp8_pb_weight
    # MLA projections.
    - quantizer_name: "*self_attn.q_a_proj*weight_quantizer"
      cfg: *fp8_pb_weight
    - quantizer_name: "*self_attn.q_b_proj*weight_quantizer"
      cfg: *fp8_pb_weight
    - quantizer_name: "*self_attn.kv_a_proj_with_mqa*weight_quantizer"
      cfg: *fp8_pb_weight
    - quantizer_name: "*self_attn.kv_b_proj*weight_quantizer"
      cfg: *fp8_pb_weight
    # Present in both attention variants.
    - quantizer_name: "*self_attn.o_proj*weight_quantizer"
      cfg: *fp8_pb_weight
    - quantizer_name: "*self_attn.g_proj*weight_quantizer"
      cfg: *fp8_pb_weight
    - $import: default_disabled_quantizers
