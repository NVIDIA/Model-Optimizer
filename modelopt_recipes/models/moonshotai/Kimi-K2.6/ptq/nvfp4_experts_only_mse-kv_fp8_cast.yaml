# Alias recipe for nvidia/Kimi-K2.6-NVFP4 (source moonshotai/Kimi-K2.6). The general
# expert-only NVFP4 scheme -- MSE-swept static weight scales, dynamic NVFP4 inputs, FP8
# KV cache in cast mode -- reproduces this release with no checkpoint-specific deviation,
# so this entry imports that recipe wholesale instead of copying its body.

imports:
  base: general/ptq/nvfp4_experts_only_mse-kv_fp8_cast

$import: base
metadata:
  description: >-
    moonshotai/Kimi-K2.6 quantized with the general expert-only NVFP4 scheme (MSE static
    weight scales, dynamic inputs) and an FP8 KV cache in cast mode, as published in
    nvidia/Kimi-K2.6-NVFP4.
