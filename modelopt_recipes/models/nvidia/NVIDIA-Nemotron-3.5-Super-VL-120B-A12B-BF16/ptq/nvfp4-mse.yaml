# NVIDIA Nemotron 3.5 Super VL -- NVFP4, weight-MSE calibration.
#
# The PTQ stage for NVIDIA Nemotron 3.5 Super VL, keyed to the BF16 source checkpoint it runs
# on: nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-BF16. It reproduces the released precision
# assignment, not the released weights -- the published
# nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4 is refined by quantization-aware
# distillation after this stage, which no PTQ recipe performs.
#
# The model is a hybrid Mamba-MoE NemotronH omni checkpoint, and nothing here is specific to
# this release beyond the calibration choices, so the rules apply to NemotronH hybrids
# generally. The MTP rules are inert on a checkpoint with no MTP tail.
#
#   MoE routed + shared experts   NVFP4 W4A4, static weight scales
#   attention q/k/v/o, Mamba in/out_proj, lm_head   FP8
#   MTP block-1 routed + shared experts   NVFP4 W4A4, static weight scales
#   latent MoE, embeddings, router, C-RADIO vision, Parakeet audio   BF16
#   KV cache                      FP8 (see the kv rules below)
#
# quant_cfg is ordered and the LAST match wins, so the blanket disable comes first and the
# vision / MTP rules come last. Only configs/numerics/* is imported, so every rule that
# applies to this model is visible in this file.
#
# Rules are written for both Hugging Face (hf_ptq) and Megatron-Core (Megatron-Bridge) module
# names. Where the two differ -- attention, lm_head and the MTP block -- both spellings are
# listed; each is inert on the other framework's model.

# modelopt-schema: modelopt.recipe.config.ModelOptPTQRecipe
imports:
  nvfp4: configs/numerics/nvfp4
  nvfp4_static: configs/numerics/nvfp4_static
  fp8: configs/numerics/fp8

metadata:
  description: >-
    PTQ stage for NVIDIA Nemotron 3.5 Super VL, run on
    nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-BF16 and weight-MSE calibrated: NVFP4 routed
    and shared MoE experts with static weight scales and dynamic NVFP4 activations, the same for
    the MTP block-1 experts; FP8 attention projections, Mamba in/out_proj and lm_head; BF16
    latent MoE, router, embeddings and vision stack. FP8 KV cache, with the backbone cast at a
    fixed range and MTP calibrated. The released NVFP4 checkpoint adds quantization-aware
    distillation on top of this stage.
quantize:
  algorithm:
    method: mse
    # Sweeps the 128 e4m3 scale values; requires static weight quantizers (below).
    fp8_scale_sweep: true
    # Required for VLMs: decoder layers sit under `model.language_model.layers`,
    # where layerwise_calibrate cannot find them.
    layerwise:
      enable: false
  quant_cfg:
    - quantizer_name: '*'
      enable: false
    - quantizer_name: '*.experts.*weight_quantizer'
      cfg:
        $import: nvfp4_static
    - quantizer_name: '*.experts.*input_quantizer'
      cfg:
        $import: nvfp4
    - quantizer_name: '*shared_experts*weight_quantizer'
      cfg:
        $import: nvfp4_static
    - quantizer_name: '*shared_experts*input_quantizer'
      cfg:
        $import: nvfp4
    - quantizer_name: '*[qkvo]_proj.weight_quantizer'
      cfg:
        $import: fp8
    - quantizer_name: '*[qkvo]_proj.input_quantizer'
      cfg:
        $import: fp8
    - quantizer_name: '*mixer.in_proj.weight_quantizer'
      cfg:
        $import: fp8
    - quantizer_name: '*mixer.in_proj.input_quantizer'
      cfg:
        $import: fp8
    - quantizer_name: '*mixer.out_proj.weight_quantizer'
      cfg:
        $import: fp8
    - quantizer_name: '*mixer.out_proj.input_quantizer'
      cfg:
        $import: fp8
    # Megatron-Core attention: q/k/v_proj are fused into linear_qkv, o_proj is linear_proj.
    - quantizer_name: '*self_attention.linear_qkv.weight_quantizer'
      cfg:
        $import: fp8
    - quantizer_name: '*self_attention.linear_qkv.input_quantizer'
      cfg:
        $import: fp8
    - quantizer_name: '*self_attention.linear_proj.weight_quantizer'
      cfg:
        $import: fp8
    - quantizer_name: '*self_attention.linear_proj.input_quantizer'
      cfg:
        $import: fp8
    # Backbone KV casts at a fixed FP8 range: no _amax buffer, so no k_scale/v_scale is
    # exported, matching configs/ptq/units/kv_fp8_cast. MTP KV below stays calibrated and
    # keeps its pair.
    - quantizer_name: '*[kv]_bmm_quantizer'
      cfg:
        $import: fp8
        use_constant_amax: true
    - quantizer_name: '*mtp.*'
      enable: false
    - quantizer_name: '*mtp.layers.1.mixer.experts.*weight_quantizer'
      cfg:
        $import: nvfp4_static
    - quantizer_name: '*mtp.layers.1.mixer.experts.*input_quantizer'
      cfg:
        $import: nvfp4
    - quantizer_name: '*mtp.layers.1.mixer.shared_experts.*weight_quantizer'
      cfg:
        $import: nvfp4_static
    - quantizer_name: '*mtp.layers.1.mixer.shared_experts.*input_quantizer'
      cfg:
        $import: nvfp4
    # Megatron-Core MTP block 1 is mtp.layers.0.mtp_model_layer.layers.1.
    - quantizer_name: '*mtp_model_layer.layers.1.mlp.experts.*weight_quantizer'
      cfg:
        $import: nvfp4_static
    - quantizer_name: '*mtp_model_layer.layers.1.mlp.experts.*input_quantizer'
      cfg:
        $import: nvfp4
    - quantizer_name: '*mtp_model_layer.layers.1.mlp.shared_experts.*weight_quantizer'
      cfg:
        $import: nvfp4_static
    - quantizer_name: '*mtp_model_layer.layers.1.mlp.shared_experts.*input_quantizer'
      cfg:
        $import: nvfp4
    # Restated so this rule cannot inherit the backbone setting above. It also matches the
    # Megatron-Core MTP attention (mtp.layers.0.mtp_model_layer.layers.0...), so it needs no
    # separate Megatron-Core rule.
    - quantizer_name: '*mtp.layers.0.*[kv]_bmm_quantizer'
      cfg:
        $import: fp8
        use_constant_amax: false
    - quantizer_name: '*embed_vision*'
      enable: false
    - quantizer_name: '*lm_head*weight_quantizer'
      enable: true
      cfg:
        $import: fp8
    - quantizer_name: '*lm_head*input_quantizer'
      enable: true
      cfg:
        $import: fp8
    # Megatron-Core lm_head. Effective only with untied embeddings: for a tied output_layer the
    # Megatron checkpoint save drops its quantizer state, so it reloads and exports BF16.
    - quantizer_name: '*output_layer.weight_quantizer'
      enable: true
      cfg:
        $import: fp8
    - quantizer_name: '*output_layer.input_quantizer'
      enable: true
      cfg:
        $import: fp8
    - quantizer_name: '*vision_model*'
      enable: false
    - quantizer_name: '*vision_projector*'
      enable: false
    # Megatron-Bridge names the projector vision_projection.
    - quantizer_name: '*vision_projection*'
      enable: false
    - quantizer_name: '*radio_model*'
      enable: false
    - quantizer_name: '*vision_tower*'
      enable: false
    - quantizer_name: '*visual*'
      enable: false
    - quantizer_name: '*multi_modal_projector*'
      enable: false
    - quantizer_name: 'mlp1.*'
      enable: false
    - quantizer_name: '*.mlp1.*'
      enable: false
    # Audio branch of the omni wrapper, present when the config carries a `sound_config`.
    # The Parakeet encoder names its projections `self_attn.{q,k,v,o,relative_k}_proj`, so the
    # FP8 attention rules above match it, and its attention class is registered for KV-cache
    # quantization like any other. Image calibration supplies no audio, so those input
    # quantizers collect no amax and the export drops the input scale while still writing an
    # FP8 weight scale -- a layer that claims W8A8 with no activation scale. Keep it BF16.
    # Megatron-Bridge builds no audio branch for the omni wrapper; these guards also cover the
    # Megatron-Core attention rules should it name one sound_encoder / sound_projector.
    - quantizer_name: '*audio_tower*'
      enable: false
    - quantizer_name: '*sound_encoder*'
      enable: false
    - quantizer_name: '*sound_projector*'
      enable: false
