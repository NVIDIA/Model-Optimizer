# Recipe for nvidia/Nemotron-3-Nano-Omni-30B-A3B-Reasoning-BF16, mirroring
# nvidia/Nemotron-3-Nano-Omni-30B-A3B-Reasoning-NVFP4.
#
# Nemotron-3-Nano-Omni is the omni-modal (text + vision + audio) sibling of
# NVIDIA-Nemotron-3-Nano-30B-A3B: the same 52-layer Nemotron-H hybrid decoder, nested
# under `language_model.backbone.layers`, plus a RADIO vision tower
# (`vision_model.radio_model.*`), a Conformer sound encoder (`sound_encoder.*`) and the
# `mlp1` / `sound_projection` modality projectors.
#
# Only the language decoder is quantized. The vision tower, the sound encoder and both
# projectors stay BF16 -- and `sound_encoder*`, `sound_projection*` and `mlp1*` match
# none of the shared `default_disabled_quantizers` patterns, so this recipe disables
# them explicitly. That extra exclusion is the model-specific part.
#
# `layerwise.enable=false` is required: the decoder layers nest under
# `language_model.backbone.layers`, where layerwise_calibrate cannot find them.
#
# `hf_quant_config.json` records `kv_cache_quant_algo: FP8` but the checkpoint ships no
# `k_scale`/`v_scale` tensors, which is the constant-amax (cast) KV cache.
#
# Mixed precision, unlike the FP8 sibling:
#
#   MoE routed experts     NVFP4  (W4A4)
#   MoE shared experts     FP8    (W8A8 per-tensor)
#   Mamba in/out_proj      FP8    (W8A8, every Mamba layer)
#   attention o_proj       FP8    (W8A8, the six attention layers)
#   attention q/k/v_proj   BF16
#   conv1d, routers, head  BF16
#   KV cache               FP8    (cast)
#
# The attention split is the notable part: only the output projection drops to FP8,
# while q/k/v stay BF16 -- the same `omlp`-style scoping the general
# `nvfp4_omlp_only` recipe uses, but with FP8 rather than NVFP4 on that projection.

# modelopt-schema: modelopt.recipe.config.ModelOptPTQRecipe
imports:
  base_disable_all: configs/ptq/units/base_disable_all
  default_disabled_quantizers: configs/ptq/units/default_disabled_quantizers
  nvfp4: configs/numerics/nvfp4
  fp8: configs/numerics/fp8
  kv_fp8_cast: configs/ptq/units/kv_fp8_cast

metadata:
  description: >-
    Nemotron-3-Nano-Omni-30B-A3B-Reasoning: NVFP4 (W4A4) on the MoE routed experts; FP8
    (W8A8) on the shared experts, the Mamba in/out projections and the attention output
    projection; FP8 KV cache in cast mode; max calibration. Attention q/k/v, conv1d,
    routers, lm_head, the RADIO vision tower, the Conformer sound encoder and both
    modality projectors stay BF16.
quantize:
  algorithm:
    method: max
    layerwise: {enable: false}
  quant_cfg:
    - $import: base_disable_all
    # MoE routed experts -> NVFP4 W4A4.
    - quantizer_name: '*mixer.experts.*weight_quantizer'
      cfg: {$import: nvfp4}
    - quantizer_name: '*mixer.experts.*input_quantizer'
      cfg: {$import: nvfp4}
    # Shared experts, Mamba projections and the attention output projection -> FP8 W8A8.
    - quantizer_name: '*mixer.shared_experts.*weight_quantizer'
      cfg: {$import: fp8}
    - quantizer_name: '*mixer.shared_experts.*input_quantizer'
      cfg: {$import: fp8}
    - quantizer_name: '*mixer.in_proj*weight_quantizer'
      cfg: {$import: fp8}
    - quantizer_name: '*mixer.in_proj*input_quantizer'
      cfg: {$import: fp8}
    - quantizer_name: '*mixer.out_proj*weight_quantizer'
      cfg: {$import: fp8}
    - quantizer_name: '*mixer.out_proj*input_quantizer'
      cfg: {$import: fp8}
    - quantizer_name: '*mixer.o_proj*weight_quantizer'
      cfg: {$import: fp8}
    - quantizer_name: '*mixer.o_proj*input_quantizer'
      cfg: {$import: fp8}
    - $import: kv_fp8_cast
    - $import: default_disabled_quantizers
    # Non-language branches; none match a `default_disabled_quantizers` pattern.
    - {quantizer_name: '*sound_encoder*', enable: false}
    - {quantizer_name: '*sound_projection*', enable: false}
    - {quantizer_name: '*radio_model*', enable: false}
    - {quantizer_name: 'mlp1.*', enable: false}
