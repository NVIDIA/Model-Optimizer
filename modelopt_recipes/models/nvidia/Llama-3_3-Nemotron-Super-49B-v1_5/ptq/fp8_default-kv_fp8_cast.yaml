# Alias for `general/ptq/fp8_default-kv_fp8_cast`, at the hub path of
# nvidia/Llama-3_3-Nemotron-Super-49B-v1_5, so the recipe behind a released
# checkpoint can be found from the model rather than only under the general tier.
#
# `nvidia/Llama-3_3-Nemotron-Super-49B-v1_5-FP8` is an FP8 W8A8 release with an
# FP8 KV cache; its `hf_quant_config.json` excludes only `lm_head`, which is what the
# general recipe's standard exclusions already leave out.
#
# A top-level `$import` brings in the imported recipe whole, so `quantize` -- its
# algorithm and every `quant_cfg` entry -- comes from there and only `metadata` is local.
# Edit the base recipe to change what this produces.

imports:
  base: general/ptq/fp8_default-kv_fp8_cast

$import: base
metadata:
  description: >-
    nvidia/Llama-3_3-Nemotron-Super-49B-v1_5 quantized with the general FP8
    W8A8 scheme and an FP8 KV cache in cast mode, as published in
    nvidia/Llama-3_3-Nemotron-Super-49B-v1_5-FP8.
