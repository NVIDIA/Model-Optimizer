# DFlash2 drafter for meta-models/Muse-Spark-Open-816B-A42B, as released in
# nvidia/Muse-Spark-Open-816B-A42B-DFlash2. Stage 2 of 2: continues the stage-1 export
# (dflash2.yaml, step 390,000) at 12K tokens on the corpus's long samples. The release is
# step 25,000 of this schedule; later steps did not improve acceptance. See README.md.
#
# Launcher example:
#   tools/launcher/examples/meta-models/Muse-Spark-Open-816B-A42B/hf_streaming_dflash2_long_context.yaml

# modelopt-schema: modelopt.recipe.config.ModelOptDFlashRecipe
metadata:
  description: Muse-Spark-Open DFlash2 drafter, stage 2 (long-context continuation, 12K tokens).

model:
  model_name_or_path: <path to meta-models/Muse-Spark-Open-816B-A42B-NVFP4>
  trust_remote_code: false
  use_fake_base_for_offline: true

data:
  mode: streaming
  # The stage-1 corpus, keeping only the samples whose rendered conversation is longer than
  # 4,096 tokens (about 18% of it).
  data_path: <path to the long samples of the synthesized corpus>
  offline_data_path:
  chat_template:

training:
  output_dir:
  num_train_epochs: 6
  # Global batch 64 = 1 per GPU x 2 accumulation steps x 32 trainer GPUs.
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 2
  # A continuation: low peak, short warmup.
  learning_rate: 3.0e-5
  warmup_steps: 1500
  training_seq_len: 12288
  logging_steps: 20
  save_steps: 2500
  save_total_limit: 3
  cp_size: 1
  dp_shard_size: 1
  disable_tqdm: true
  estimate_ar: false
  ar_validate_steps: 0
  answer_only_loss: true
  do_eval: false
  lr_scheduler_type: linear
  save_strategy: steps
  weight_decay: 0.0
  max_grad_norm: 1.0
  dataloader_drop_last: true
  ignore_data_skip: false
  data_seed: 153313048
  bf16: true
  tf32: true
  remove_unused_columns: false
  ddp_find_unused_parameters: true
  ddp_timeout: 1800
  report_to: tensorboard

dflash:
  # The stage-1 drafter as exported (a deployment checkpoint, not a training one).
  dflash_init_checkpoint: <path to the stage-1 export>
  dflash_block_size: 8
  # More anchors per sample for the 3x longer sequences.
  dflash_num_anchors: 512
  dflash_swa_window_size: 2048
  dflash_use_torch_compile: true
  dflash_use_flex_attention: true
  dflash_fused_loss: true
  dflash_self_logit_distillation: true
  dflash_lk_loss_type: ce
  dflash_loss_objective: dpace
  dflash_mask_token_id: 201817
  dflash_selector_loss_alpha: 1.0
  dflash_fp32_master_weights: true
  dflash_architecture_config:
    num_hidden_layers: 5
    num_attention_heads: 128
    num_key_value_heads: 16
    head_dim: 64
    intermediate_size: 24576
    projector_type: dflash2
    target_layer_ids: [3, 19, 31, 47, 59]
    conv_kernel_size: 2
    conv_group_size: 16
    selector_rank: 256
    selector_top_k: 16
