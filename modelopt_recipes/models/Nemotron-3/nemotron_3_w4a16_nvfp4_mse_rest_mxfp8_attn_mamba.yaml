metadata:
  recipe_type: ptq
  description: >
    Nemotron 3 mixed weight-only MSE PTQ. Attention and Mamba
    projection weights use W8A16 MXFP8. Other target linears, including
    routed/shared experts and lm_head, use W4A16 NVFP4 with MSE-calibrated
    static weight scales. KV cache uses FP8 casting with constant amax.
    Routers, convolutions, unsupported operators, and MTP layers remain BF16.
quantize:
  algorithm:
    method: mse
    fp8_scale_sweep: true
    layerwise:
      enable: false
  quant_cfg:
    - quantizer_name: '*'
      enable: false

    - quantizer_name: '*weight_quantizer'
      enable: true
      cfg:
        block_sizes:
          -1: 16
          type: static
          scale_bits: e4m3
        num_bits: e2m1

    - quantizer_name: '*mixer.q_proj*weight_quantizer'
      enable: true
      cfg: &mxfp8_weight_cfg
        num_bits: e4m3
        block_sizes:
          -1: 32
          type: dynamic
          scale_bits: e8m0
    - quantizer_name: '*mixer.k_proj*weight_quantizer'
      enable: true
      cfg: *mxfp8_weight_cfg
    - quantizer_name: '*mixer.v_proj*weight_quantizer'
      enable: true
      cfg: *mxfp8_weight_cfg
    - quantizer_name: '*mixer.o_proj*weight_quantizer'
      enable: true
      cfg: *mxfp8_weight_cfg
    - quantizer_name: '*mixer.in_proj*weight_quantizer'
      enable: true
      cfg: *mxfp8_weight_cfg
    - quantizer_name: '*mixer.out_proj*weight_quantizer'
      enable: true
      cfg: *mxfp8_weight_cfg

    - quantizer_name: '*[kv]_bmm_quantizer'
      enable: true
      cfg:
        num_bits: e4m3
        axis:
        use_constant_amax: true
    - quantizer_name: '*mixer.gate*'
      enable: false
    - quantizer_name: '*mixer.conv1d*'
      enable: false
    - quantizer_name: '*block_sparse_moe.gate*'
      enable: false
    - quantizer_name: '*mlp.gate.*'
      enable: false
    - quantizer_name: '*mlp.shared_expert_gate.*'
      enable: false
    - quantizer_name: '*shared_expert_gate*'
      enable: false
    - quantizer_name: '*router*'
      enable: false
    - parent_class: 'nn.BatchNorm1d'
      quantizer_name: '*'
      enable: false
    - parent_class: 'nn.BatchNorm2d'
      quantizer_name: '*'
      enable: false
    - parent_class: 'nn.BatchNorm3d'
      quantizer_name: '*'
      enable: false
    - parent_class: 'nn.Embedding'
      quantizer_name: '*'
      enable: false
    - parent_class: 'nn.LeakyReLU'
      quantizer_name: '*'
      enable: false
    - quantizer_name: '*mtp*'
      enable: false
