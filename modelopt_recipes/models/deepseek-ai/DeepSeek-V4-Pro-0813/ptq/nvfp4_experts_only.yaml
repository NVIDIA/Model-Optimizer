# Recipe for nvidia/DeepSeek-V4-Pro-0813-NVFP4. The source DeepSeek-V4-Pro-0813
# routed experts already ship as MXFP4, so examples/deepseek/deepseek_v4/ptq.py
# collects activation ranges against this layout and
# examples/deepseek/deepseek_v4/quantize_to_nvfp4.py then applies
# --cast_mxfp4_to_nvfp4, a bit-exact MXFP4-to-NVFP4 cast of the expert weights.
# The activation amax collected here is therefore the only calibrated quantity
# that reaches the exported checkpoint.
#
# Module paths follow DeepSeek's native (non-transformers) layout: routed experts
# are model.layers.<i>.ffn.experts.<j>.w{1,2,3}. The shared expert is the same
# Expert class under a different MoE attribute, so it is disabled explicitly.

imports:
  base_disable_all: configs/ptq/units/base_disable_all
  nvfp4: configs/numerics/nvfp4

metadata:
  recipe_type: ptq
  description: >-
    DeepSeek-V4-Pro-0813 recipe quantizing only the routed-expert linears to
    NVFP4 (weights and activations). Shared experts, attention, router gates,
    dense projections, embeddings, lm_head and the MTP/DSpark speculative
    decoding block stay in their source format.

quantize:
  algorithm:
    method: max
  quant_cfg:
    # Start from everything disabled. Only Expert and MoE carry Quant wrappers,
    # so no other quantizer instances exist -- this is an explicit safety rail.
    - $import: base_disable_all
    # Routed experts only.
    - quantizer_name: "*ffn.experts.*.w*_weight_quantizer"
      enable: true
      cfg:
        $import: nvfp4
    - quantizer_name: "*ffn.experts.*.w*_input_quantizer"
      enable: true
      cfg:
        $import: nvfp4
    # The shared expert instantiates the same Expert class; keep it disabled
    # even if the patterns above were to match it.
    - quantizer_name: "*shared_experts*"
      enable: false
    # MTP is DeepSeek's speculative-decoding block. Left in the source format
    # unless a dedicated MTP quantization path is added.
    - quantizer_name: "*mtp.*"
      enable: false
