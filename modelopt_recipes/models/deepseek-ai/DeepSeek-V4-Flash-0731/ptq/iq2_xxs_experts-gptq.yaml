# Bridge PTQ: IQ2_XXS only on the routed experts. Keep floating-point training
# weights (no --compress), disable grouped GEMM and prepare an MTP=0 HF view.
# Mergeable QAD attaches rank 8 / alpha 16 adapters using quantize.py's LoRA flags.
# modelopt-schema: modelopt.recipe.config.ModelOptPTQRecipe
imports:
  base_disable_all: configs/ptq/units/base_disable_all
  iq2_xxs: configs/numerics/iq2_xxs
metadata:
  description: >-
    DeepSeek-V4-Flash-0731 (Megatron-Bridge): routed-expert IQ2_XXS with
    importance-weighted layerwise GPTQ; all other imported weights stay floating point.
quantize:
  algorithm:
    method: gptq
    block_size: 256
    perc_damp: 0.3
    importance_weighted: true
    layerwise: {enable: true}
  quant_cfg:
    - $import: base_disable_all
    - quantizer_name: '*mlp.experts.local_experts.*.linear_fc1.weight_quantizer'
      cfg:
        $import: iq2_xxs
    - quantizer_name: '*mlp.experts.local_experts.*.linear_fc2.weight_quantizer'
      cfg:
        $import: iq2_xxs
    - {quantizer_name: '*mtp*', enable: false}
