# QuantizerCfgList snippet that HARD-DISABLES every vision-path quantizer. Import LAST so it is the
# final word regardless of what earlier units enabled.
#
# Why this exists even though default_disabled_quantizers already lists vision patterns:
#   1. that unit covers '*vision_model*' / '*visual*' / '*vision_tower*' / '*multi_modal_projector*'
#      but NOT this model's projector, which is named 'vision_projector' (top-level mlp1.*);
#   2. the attention-BMM globs ('*[qkv]_bmm_quantizer', '*p_bmm_quantizer') textually match the
#      C-RADIO tower's own attention -- measured: 120 [qkv]_bmm hits, of which the vision encoder's
#      32 layers are the majority. Without a trailing guard, an attention tier would quantize vision.
# Per the Super 3.5 VL plan section 2.1: quantizing the vision encoder caused severe unrecoverable
# degradation in V1/V2-VL. Vision is BF16 in EVERY tier, including Very-aggressive.

# modelopt-schema: modelopt.torch.quantization.config.QuantizerCfgListConfig
  - quantizer_name: '*vision_model*'
    enable: false
  - quantizer_name: '*vision_projector*'
    enable: false
  - quantizer_name: '*radio_model*'
    enable: false
  - quantizer_name: '*vision_tower*'
    enable: false
  - quantizer_name: '*visual*'
    enable: false
  - quantizer_name: '*multi_modal_projector*'
    enable: false
  # The HF checkpoint exposes the projector as TOP-LEVEL `mlp1.*` (mlp1.0/1/3). The header above
  # noted this but no RULE covered it, so the guard documented the gap without closing it.
  # Caught by probe/verify_recipes.py: nemotron35vl_fp8_base imports the broad w8a8_fp8_fp8 unit,
  # whose '*input_quantizer' rule enabled mlp1.0/1/3 -- the vision projector was quantized in that
  # tier even though this unit is imported last.
  - quantizer_name: 'mlp1.*'
    enable: false
  - quantizer_name: '*.mlp1.*'
    enable: false
