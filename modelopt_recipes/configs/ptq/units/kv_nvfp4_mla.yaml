# QuantizerCfgList snippet that fake-quantizes the vLLM MLA KV cache in the formats of vLLM's
# `nvfp4_ds_mla` cache. It sets two MLAAttention quantizers, which the KV-cache units
# (`*[kv]_bmm_quantizer`) do not match:
# - `kv_c_bmm_quantizer`, the normalized latent that vLLM caches and attention reads as both K and
#   V: NVFP4 (E2M1, block 16, E4M3 scales) with the global scale fixed to 1 (amax = 6 * 448), so the
#   per-block E4M3 scales carry the whole range.
# - `k_pe_bmm_quantizer`, the RoPE key: FP8 E4M3 with scale 1 (amax = 448). NoPE MLA models such as
#   GLM-5.3-Flash have an empty k_pe, which passes through unchanged.
# No scale is calibrated or exported. The NVFP4 fake-quant kernel needs compute capability 8.9+
# (Ada, Hopper or newer).

# modelopt-schema: modelopt.torch.quantization.config.QuantizerCfgListConfig
imports:
  nvfp4: configs/numerics/nvfp4
  fp8: configs/numerics/fp8
---
  - quantizer_name: '*kv_c_bmm_quantizer'
    cfg:
      $import: nvfp4
      constant_amax: 2688.0
  - quantizer_name: '*k_pe_bmm_quantizer'
    cfg:
      $import: fp8
      use_constant_amax: true
