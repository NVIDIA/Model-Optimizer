# QuantizerCfgList: per-tensor FP8 E4M3 on attention q/k/v/o PROJECTIONS.

# modelopt-schema: modelopt.torch.quantization.config.QuantizerCfgListConfig
imports:
  fp8: configs/numerics/fp8
---
  - quantizer_name: '*[qkvo]_proj.weight_quantizer'
    cfg:
      $import: fp8
  - quantizer_name: '*[qkvo]_proj.input_quantizer'
    cfg:
      $import: fp8
