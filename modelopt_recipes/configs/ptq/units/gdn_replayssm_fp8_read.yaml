# FP8 reads use value-first [H,V,K] checkpoints, with one scale per 128 key channels.
# The recurrence anchor remains FP32; keep gdn_state_quantizer disabled.
# modelopt-schema: modelopt.torch.quantization.config.QuantizerCfgListConfig
  - quantizer_name: '*gdn_read_quantizer'
    cfg:
      num_bits: e4m3
      type: dynamic
      block_sizes: {-1: 128}
      pass_through_bwd: true
