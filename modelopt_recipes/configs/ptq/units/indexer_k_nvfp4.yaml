# QuantizerCfgList snippet that enables NVFP4 (E2M1, block 16, E4M3 scales) fake quantization of the
# sparse-attention indexer key cache (DeepSeek-V3.2, DeepSeek-V4, GLM-5.x,
# GLM-5.3-Flash). The quantizer lives on the indexer module and is not covered by the KV-cache
# units (`*[kv]_bmm_quantizer`).
# Requires Blackwell+ GPUs for the NVFP4 fake-quant kernels.

# modelopt-schema: modelopt.torch.quantization.config.QuantizerCfgListConfig
imports:
  nvfp4: configs/numerics/nvfp4
---
  - quantizer_name: '*indexer_k_quantizer'
    cfg:
      $import: nvfp4
