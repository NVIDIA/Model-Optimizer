# QuantizerCfgList snippet that enables NVFP4 (E2M1, block 16, E4M3 scales) fake quantization of the
# sparse-attention indexer key cache. Supported models: DeepSeek-V4 (vLLM and Megatron-Core) and
# GLM-5.3-Flash (vLLM). The quantizer lives on the indexer module and is not covered by the
# KV-cache units (`*[kv]_bmm_quantizer`).
# The global scale is fixed to 1 (amax = 6 * 448) instead of calibrated, so the per-block E4M3 scales
# carry the whole range and Megatron QAD and vLLM serving use the same scale without exporting it.
# Requires Blackwell+ GPUs for the NVFP4 fake-quant kernels.

# modelopt-schema: modelopt.torch.quantization.config.QuantizerCfgListConfig
imports:
  nvfp4: configs/numerics/nvfp4
---
  - quantizer_name: '*indexer_k_quantizer'
    cfg:
      $import: nvfp4
      constant_amax: 2688.0
