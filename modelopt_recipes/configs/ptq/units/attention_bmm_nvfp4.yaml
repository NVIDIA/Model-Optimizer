# QuantizerCfgList snippet enabling NVFP4 on the attention BMM path: BMM1 (Q.K^T) via the q/k bmm
# quantizers and BMM2 (P.V) via the p/v bmm quantizers. Pair with kv_nvfp4 for the KV cache itself.
# NB: these globs also match the VISION tower's attention (vision_model.encoder.layer.*), so this
# unit MUST be followed by default_disabled_quantizers to keep C-RADIO in BF16.

# modelopt-schema: modelopt.torch.quantization.config.QuantizerCfgListConfig
imports:
  nvfp4: configs/numerics/nvfp4
---
  - quantizer_name: '*q_bmm_quantizer'
    cfg:
      $import: nvfp4
  - quantizer_name: '*p_bmm_quantizer'
    cfg:
      $import: nvfp4
