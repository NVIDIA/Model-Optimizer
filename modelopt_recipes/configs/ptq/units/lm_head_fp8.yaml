# QuantizerCfgList snippet RE-ENABLING per-tensor FP8 on lm_head. Import AFTER
# default_disabled_quantizers (which disables '*lm_head*') or it is a no-op.

# modelopt-schema: modelopt.torch.quantization.config.QuantizerCfgListConfig
imports:
  fp8: configs/numerics/fp8
---
  - quantizer_name: '*lm_head*weight_quantizer'
    enable: true
    cfg:
      $import: fp8
  - quantizer_name: '*lm_head*input_quantizer'
    enable: true
    cfg:
      $import: fp8
