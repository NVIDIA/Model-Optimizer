# FP8 E4M3 fake quantization of the GatedDeltaNet (linear attention) recurrent state with a
# dynamic scale computed inside the kernel from the state itself (no calibration). The state is
# ``[N, H, K, V]`` for ``N`` sequences; ``axis: [0, 1]`` scales each sequence's head state on its
# own, with one scale per full-K by 64-value-column tile (two scales per head for V = 128).
# This is the only configuration the module supports. Applied at every kernel chunk boundary
# (64 tokens) during calibration, QAT and QAD; needs fla-core==0.5.1 and Triton.
# See ``modelopt.torch.quantization.plugins.gated_delta_net``.

# modelopt-schema: modelopt.torch.quantization.config.QuantizerCfgListConfig
  - quantizer_name: '*gdn_state_quantizer'
    cfg:
      num_bits: e4m3
      axis: [0, 1]
      type: dynamic
