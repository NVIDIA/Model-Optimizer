# Dynamic per-tile FP8 E4M3 fake quantization of the GatedDeltaNet recurrent state.
# Recompute amax over each [K, BV] tile inside the kernel, independently per sequence and head
# of the [N, H, K, V] state (no calibration). ``axis: [0, 1]`` specifies sequence/head grouping;
# BV is ``gdn_state_qdq_block_v`` (default: the kernel's 64-column tile,
# two scales per head for V = 128; set 128 on the quantized module for one scale per head). This
# selects the FP8 state format. Applied at every kernel chunk boundary
# (64 tokens) during calibration, QAT and QAD; needs fla-core==0.5.1 and Triton.
# See ``modelopt.torch.quantization.plugins.gated_delta_net``.

# modelopt-schema: modelopt.torch.quantization.config.QuantizerCfgListConfig
  - quantizer_name: '*gdn_state_quantizer'
    cfg:
      num_bits: e4m3
      axis: [0, 1]
      type: dynamic
