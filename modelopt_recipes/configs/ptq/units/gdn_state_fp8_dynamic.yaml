# Dynamic per-tile FP8 E4M3 fake quantization of the GatedDeltaNet recurrent state.
# TensorQuantizer computes amax over each [K, BV] tile of the [N, H, K, V] state,
# independently per sequence/head (axis: [0, 1]), without calibration.
# Set BV through linear_attention[].cfg.state_block_v (default: 64).
# This unit enables only the quantizer. Select backend='serving' in the execution
# policy and provide prefill lengths through linear_attention_training_phase.
# With precision='vllm_0_15', state QDQ applies at the handoff to a nonempty decode
# suffix and at each suffix token's cache write; fresh prefill has no internal QDQ.
# The serving profile requires public vLLM's GDN kernels.
# See modelopt.torch.quantization.plugins.gdn.

# modelopt-schema: modelopt.torch.quantization.config.QuantizerCfgListConfig
  - quantizer_name: '*gdn_state_quantizer'
    cfg:
      num_bits: e4m3
      axis: [0, 1]
      type: dynamic
