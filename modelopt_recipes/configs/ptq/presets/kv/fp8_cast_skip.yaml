# Partial QuantizeConfig that enables FP8 E4M3 skip-token KV-cache quantizers
# (k_bmm_fp8_quantizer / v_bmm_fp8_quantizer) with constant amax.
# Merge with a primary model quantization config via update_quant_cfg_with_kv_cache_quant.

# modelopt-schema: modelopt.torch.quantization.config.QuantizeConfig
imports:
  fp8: configs/numerics/fp8

quant_cfg:
  - quantizer_name: '*[kv]_bmm_fp8_quantizer'
    cfg:
      $import: fp8
      use_constant_amax: true
