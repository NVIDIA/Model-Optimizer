# QuantizeConfig preset for W8A8 FP8 E4M3 (AMD float8_e4m3fnuz) for MI300X/MI325X.
# Uses the AMD CDNA exponent bias (fnuz) for correct hardware mapping on gfx942.
# Provides 1.3-1.8x speedup over FP16 via hipBLASLt FP8 GEMM kernels.
#
# Usage:
#   import modelopt.torch.quantization as mtq
#   mtq.quantize(model, mtq.AMD_FP8_DEFAULT_CFG, forward_loop=lambda m: m(x_cal))

# modelopt-schema: modelopt.torch.quantization.config.QuantizeConfig
algorithm: max
quant_cfg:
  - quantizer_name: '*'
    enable: false
  - quantizer_name: '*weight_quantizer'
    cfg:
      num_bits: [4, 3]
      axis: null
  - quantizer_name: '*input_quantizer'
    cfg:
      num_bits: [4, 3]
      axis: null
