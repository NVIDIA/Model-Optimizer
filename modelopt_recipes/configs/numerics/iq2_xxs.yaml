# IQ2_XXS weight quantizer using the built-in fixed-scale codebook search.

# modelopt-schema: modelopt.torch.quantization.config.QuantizerAttributeConfig
num_bits: iq2_xxs
# Cost metadata for AutoQuantize's compression estimate only; it drives no packing or
# numerics. num_bits is the string "iq2_xxs", so the generic estimator cannot derive the
# storage cost: 66 packed bytes * 8 / 256 weights. Keep in sync with IQ2_XXS_BLOCK_BYTES.
effective_bits: 2.0625
block_sizes:
  -1: 256
backend: ggml
