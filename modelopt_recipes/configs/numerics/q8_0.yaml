# Q8_0 weight quantizer using one symmetric int8 scale per 32 weights.

# modelopt-schema: modelopt.torch.quantization.config.QuantizerAttributeConfig
num_bits: q8_0
# Cost metadata for AutoQuantize's compression estimate only; it drives no packing or
# numerics. num_bits is the string "q8_0", so the generic estimator cannot derive the
# storage cost: 34 packed bytes * 8 / 32 weights. Keep in sync with Q8_0_BLOCK_BYTES.
effective_bits: 8.5
block_sizes:
  -1: 32
backend: ggml
