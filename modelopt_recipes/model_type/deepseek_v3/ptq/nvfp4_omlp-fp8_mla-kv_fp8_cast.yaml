# Model-specific PTQ recipe: DeepSeek-V3 NVFP4 on the MLP/MoE and the attention output projection,
# per-tensor FP8 on the other MLA projections, with FP8 KV-cache cast.
#
# MLA splits the query and the key/value projections into a low-rank down-projection (`q_a_proj`,
# `kv_a_proj_with_mqa`) and an up-projection (`q_b_proj`, `kv_b_proj`). The general recipes leave
# these in BF16 (`nvfp4_omlp_only`) or reach them only through `*self_attn*` wildcards, which on
# DeepSeek-V3.2 also match the sparse-attention indexer; this recipe names the four projections, so
# the indexer stays in BF16.

# modelopt-schema: modelopt.recipe.config.ModelOptPTQRecipe
imports:
  base_disable_all: configs/ptq/units/base_disable_all
  default_disabled_quantizers: configs/ptq/units/default_disabled_quantizers
  fp8: configs/numerics/fp8
  nvfp4: configs/numerics/nvfp4
  kv_fp8_cast: configs/ptq/units/kv_fp8_cast

metadata:
  description: >-
    Applies dynamic NVFP4 to DeepSeek-V3 MLP/MoE and attention output-projection weight and input
    quantizers, per-tensor FP8 to the MLA q_a/q_b/kv_a/kv_b projections, plus FP8 KV-cache cast
    mode using constant amax; uses max calibration.

quantize:
  algorithm: max
  quant_cfg:
    - $import: base_disable_all
    - quantizer_name: '*mlp*weight_quantizer'
      cfg:
        $import: nvfp4
    - quantizer_name: '*mlp*input_quantizer'
      cfg:
        $import: nvfp4
    - quantizer_name: '*self_attn.o_proj.weight_quantizer'
      cfg:
        $import: nvfp4
    - quantizer_name: '*self_attn.o_proj.input_quantizer'
      cfg:
        $import: nvfp4
    # q_a_proj, q_b_proj
    - quantizer_name: '*self_attn.q_[ab]_proj.weight_quantizer'
      cfg:
        $import: fp8
    - quantizer_name: '*self_attn.q_[ab]_proj.input_quantizer'
      cfg:
        $import: fp8
    # kv_a_proj_with_mqa, kv_b_proj
    - quantizer_name: '*self_attn.kv_[ab]_proj*.weight_quantizer'
      cfg:
        $import: fp8
    - quantizer_name: '*self_attn.kv_[ab]_proj*.input_quantizer'
      cfg:
        $import: fp8
    - $import: kv_fp8_cast
    - $import: default_disabled_quantizers
