# Model-specific PTQ recipe: DeepSeek-V3 NVFP4 on the MLP/MoE and on every MLA projection except
# `kv_b_proj`, with FP8 KV-cache cast.
#
# `kv_b_proj` stays in BF16: TensorRT-LLM folds it into the attention BMMs instead of running it
# as a GEMM. The other MLA projections -- `q_a_proj`, `q_b_proj`, `kv_a_proj_with_mqa` and the
# output projection `o_proj` -- run as NVFP4 GEMMs, which is faster than `nvfp4_omlp_only` at a
# higher accuracy cost. The sparse-attention indexer of DeepSeek-V3.2 matches none of these names
# and stays in BF16.

# modelopt-schema: modelopt.recipe.config.ModelOptPTQRecipe
imports:
  base_disable_all: configs/ptq/units/base_disable_all
  default_disabled_quantizers: configs/ptq/units/default_disabled_quantizers
  nvfp4: configs/numerics/nvfp4
  kv_fp8_cast: configs/ptq/units/kv_fp8_cast

metadata:
  description: >-
    Applies dynamic NVFP4 to DeepSeek-V3 MLP/MoE weight and input quantizers and to the MLA
    q_a/q_b/kv_a/o projections (kv_b_proj stays BF16), plus FP8 KV-cache cast mode using constant
    amax; uses max calibration.

quantize:
  algorithm: max
  quant_cfg:
    - $import: base_disable_all
    - quantizer_name: '*mlp*weight_quantizer'
      cfg:
        $import: nvfp4
    - quantizer_name: '*mlp*input_quantizer'
      cfg:
        $import: nvfp4
    # q_a_proj, q_b_proj, o_proj
    - quantizer_name: '*self_attn.[qo]*_proj.weight_quantizer'
      cfg:
        $import: nvfp4
    - quantizer_name: '*self_attn.[qo]*_proj.input_quantizer'
      cfg:
        $import: nvfp4
    - quantizer_name: '*self_attn.kv_a_proj_with_mqa.weight_quantizer'
      cfg:
        $import: nvfp4
    - quantizer_name: '*self_attn.kv_a_proj_with_mqa.input_quantizer'
      cfg:
        $import: nvfp4
    - $import: kv_fp8_cast
    - $import: default_disabled_quantizers
