# modelopt-schema: modelopt.recipe.config.ModelOptAutoQuantizeRecipe
imports:
  mtp: model_type/nemotron_h/auto_quantize/mtp_w4a4_nvfp4-kv_fp8
  search: model_type/nemotron_h/auto_quantize/nvfp4_mse_fp8_search

metadata:
  recipe_type: auto_quantize
  description: >-
    Nemotron-H AutoQuantize at 4.9 effective bits over weight-MSE NVFP4, FP8, and BF16,
    with a fixed MTP quantization policy and vision/audio paths kept in BF16.

quantize: {$import: mtp}
auto_quantize:
  $import: search
  constraints:
    effective_bits: 4.9
