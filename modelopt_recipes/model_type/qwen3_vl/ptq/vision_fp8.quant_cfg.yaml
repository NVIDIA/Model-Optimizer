# Keep vision blocks in high precision: vLLM's FP8 GEMM flattens the 3D
# attention inputs expected by the vision encoder. Merger Linears use 2D inputs.

# modelopt-schema: modelopt.torch.quantization.config.QuantizerCfgListConfig
imports:
  fp8: configs/numerics/fp8
---
  - quantizer_name: '*visual.*merger*.weight_quantizer'
    parent_class: 'nn.Linear'
    cfg:
      $import: fp8
  - quantizer_name: '*visual.*merger*.input_quantizer'
    parent_class: 'nn.Linear'
    cfg:
      $import: fp8
  # Keep this defense-in-depth rule last when the snippet follows a KV-cache unit.
  - quantizer_name: '*visual.*_bmm_quantizer'
    enable: false
