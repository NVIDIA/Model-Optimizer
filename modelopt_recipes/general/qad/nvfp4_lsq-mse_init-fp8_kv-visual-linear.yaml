# modelopt-schema: modelopt.recipe.config.ModelOptPTQRecipe
metadata:
  description: >-
    QAD recipe using static NVFP4 E2M1 weights, dynamic NVFP4 E2M1
    activations and FP8 KV cache. Unlike the default multimodal-safe recipe,
    this recipe explicitly re-enables Qwen3-VL visual attention, MLP and
    merger Linear modules after importing the default visual exclusions.
imports:
  base_disable_all: configs/ptq/units/base_disable_all
  default_disabled_quantizers: configs/ptq/units/default_disabled_quantizers
  kv_fp8: configs/ptq/units/kv_fp8
  nvfp4: configs/numerics/nvfp4
  nvfp4_static: configs/numerics/nvfp4_static
quantize:
  algorithm:
    method: lsq
    learnable_amax:
      - pre
      - post
    tied_amax: true
    quantize_pre_scale: true
    scale_algorithm:
      method: mse
      fp8_scale_sweep: true
  quant_cfg:
    - $import: base_disable_all
    - quantizer_name: '*weight_quantizer'
      cfg:
        $import: nvfp4_static
    - quantizer_name: '*input_quantizer'
      cfg:
        $import: nvfp4
    - $import: kv_fp8
    - $import: default_disabled_quantizers
    - quantizer_name: '*visual*.attn.*.weight_quantizer'
      cfg:
        $import: nvfp4_static
    - quantizer_name: '*visual.*input_quantizer'
      cfg:
        $import: nvfp4
    - quantizer_name: '*visual*.linear_fc*.weight_quantizer'
      cfg:
        $import: nvfp4_static
    - quantizer_name: '*visual.*patch_embed*'
      enable: false
    - quantizer_name: '*visual.*_bmm_quantizer'
      enable: false
