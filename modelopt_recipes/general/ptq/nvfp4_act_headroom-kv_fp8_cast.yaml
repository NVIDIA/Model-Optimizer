# Composed PTQ recipe for dynamic NVFP4 W4A4 model quantization with FP8 KV-cache cast mode,
# using nvfp4_act_headroom calibration: NVFP4 weights on plain max, NVFP4 activation global
# scales anchored with headroom. Module coverage matches nvfp4_default-kv_fp8_cast.

imports:
  base_disable_all: configs/ptq/units/base_disable_all
  default_disabled_quantizers: configs/ptq/units/default_disabled_quantizers
  w4a4_nvfp4_nvfp4: configs/ptq/units/w4a4_nvfp4_nvfp4
  kv_fp8_cast: configs/ptq/units/kv_fp8_cast

metadata:
  recipe_type: ptq
  description: >-
    Composes dynamic NVFP4 W4A4 model quantization with FP8 KV-cache cast mode using constant
    amax; uses nvfp4_act_headroom calibration. Weight quantizers use plain max, while the NVFP4
    activation global scales are anchored to a low percentile of the per-block amax distribution
    to leave headroom for activations larger than any seen during calibration. Module coverage
    matches nvfp4_default-kv_fp8_cast.
quantize:
  algorithm:
    method: nvfp4_act_headroom
    # amax = max(rho * anchor, upper), where anchor and upper are the per-block activation
    # amaxes at anchor_percentile and upper_percentile. All three are shown at their defaults.
    # Set upper_percentile to 100 to use the literal observed max, which never clips
    # calibration data but lets a single outlier block dominate the global scale.
    anchor_percentile: 1
    upper_percentile: 99.99
    rho: 16384
    # Weight scales are an orthogonal axis: swap in mse or local_hessian here to combine a
    # different weight calibration with the same activation policy.
    weight_scale_algorithm:
      method: max
  quant_cfg:
    - $import: base_disable_all
    - $import: w4a4_nvfp4_nvfp4
    - $import: kv_fp8_cast
    - $import: default_disabled_quantizers
