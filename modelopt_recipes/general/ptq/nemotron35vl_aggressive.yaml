# Nemotron Super 3.5 VL -- **Aggressive** tier (plan doc section 4.2). Attention ladder L1
# (identical to L0: Conservative and Aggressive share the attention rung; they differ in WEIGHT breadth).
#   MoE experts + shared GEMM  NVFP4
#   QKV/Out proj  FP8    |  Latent MoE  BF16 (still)   |  Mamba Linear  FP8   |  lm_head  FP8
#   KV cache FP8 | BMM1 FP8 | BMM2 FP8 | embedding BF16 | router FP32 | vision BF16
# Serves on Hopper + Blackwell. Recovery: PTQ + QAD.
imports:
  base_disable_all: configs/ptq/units/base_disable_all
  experts_nvfp4: configs/ptq/units/experts_nvfp4
  shared_experts_nvfp4: configs/ptq/units/shared_experts_nvfp4
  attention_proj_fp8: configs/ptq/units/attention_proj_fp8
  mamba_proj_fp8: configs/ptq/units/mamba_proj_fp8
  attention_qkv_fp8: configs/ptq/units/attention_qkv_fp8
  kv_fp8: configs/ptq/units/kv_fp8
  default_disabled_quantizers: configs/ptq/units/default_disabled_quantizers
  lm_head_fp8: configs/ptq/units/lm_head_fp8
  vision_never_quantize: configs/ptq/units/vision_never_quantize

metadata:
  recipe_type: ptq
  description: >-
    Nemotron 3.5 VL Aggressive tier: NVFP4 MoE routed + shared experts; FP8 QKV/Out projections,
    FP8 Mamba in/out projections and FP8 lm_head; latent MoE stays BF16; FP8 attention BMM1/BMM2 +
    FP8 KV cache; C-RADIO vision BF16. Max calibration.
quantize:
  algorithm:
    method: max
    # layerwise.enable=false is required for VLMs: the decoder layers sit under
    # `model.language_model.layers`, where layerwise_calibrate cannot find them.
    layerwise:
      enable: false
  quant_cfg:
    - $import: base_disable_all
    - $import: experts_nvfp4
    - $import: shared_experts_nvfp4
    - $import: attention_proj_fp8
    - $import: mamba_proj_fp8
    - $import: attention_qkv_fp8
    - $import: kv_fp8
    - $import: default_disabled_quantizers
    - $import: lm_head_fp8
    - $import: vision_never_quantize
