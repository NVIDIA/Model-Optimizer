imports:
  base_disable_all: configs/ptq/units/base_disable_all
  gdn_state_int8_dynamic: configs/ptq/units/gdn_state_int8_dynamic

metadata:
  recipe_type: ptq
  description: >-
    Dynamic INT8 GDN state QDQ with 32-value Hadamard rotation during decode.
    Prefill state remains unquantized; supply per-sequence prefix lengths through
    linear_attention_training_phase. No calibration is required.
quantize:
  algorithm:
  quant_cfg:
    - $import: base_disable_all
    - $import: gdn_state_int8_dynamic
  linear_attention:
    - module_name: '*'
      cfg:
        backend: matmul
        decode:
          mode: token
          state_codec: int8_hadamard32
          prefill_state_qdq: false
