# Composed PTQ recipe for expert-only dynamic NVFP4 quantization, KV cache left unquantized.

# modelopt-schema: modelopt.recipe.config.ModelOptPTQRecipe
imports:
  base_disable_all: configs/ptq/units/base_disable_all
  default_disabled_quantizers: configs/ptq/units/default_disabled_quantizers
  experts_nvfp4: configs/ptq/units/experts_nvfp4
  block_sparse_moe_nvfp4: configs/ptq/units/block_sparse_moe_nvfp4

metadata:
  description: >-
    Applies dynamic NVFP4 only to expert-layer weight and input quantizers, with the KV
    cache left in BF16/FP16; uses max calibration. The KV-quantized variants are
    nvfp4_experts_only-kv_fp8_cast / -kv_fp8.
quantize:
  algorithm:
    method: max
    # layerwise.enable=false required for VLMs where the decoder layers are nested under
    # `model.language_model.layers` (layerwise_calibrate can't find them otherwise).
    layerwise: {enable: false}
  quant_cfg:
    - $import: base_disable_all
    - $import: experts_nvfp4
    - $import: block_sparse_moe_nvfp4
    - $import: default_disabled_quantizers
