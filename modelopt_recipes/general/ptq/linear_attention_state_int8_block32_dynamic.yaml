# modelopt-schema: modelopt.recipe.config.ModelOptPTQRecipe
imports:
  base_disable_all: configs/ptq/units/base_disable_all
  state_int8: configs/ptq/units/linear_attention_state_int8_block32_dynamic

metadata:
  description: >-
    Dynamic INT8 GDN/KDA state QDQ with per-key 32-value scales and working-state readout.
    Emulates vLLM 0.15 BF16 prefill arithmetic without additional state QDQ.
    Supply per-sequence prefix lengths through
    linear_attention_training_phase. No calibration is required.
quantize:
  algorithm:
  quant_cfg:
    - $import: base_disable_all
    - $import: state_int8
  linear_attention:
    - module_name: '*'
      cfg:
        backend: matmul
        decode:
          mode: token
          state_codec: tile
          readout: working
          quantize_initial: true
          prefill_state_qdq: false
          precision: vllm_0_15
