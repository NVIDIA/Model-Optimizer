# modelopt-schema: modelopt.recipe.config.ModelOptPTQRecipe
imports:
  base_disable_all: configs/ptq/units/base_disable_all
  read_fp8: configs/ptq/units/gdn_replayssm_fp8_read

metadata:
  description: >-
    GDN ReplaySSM with an FP32 recurrence anchor and an FP8 block128 read copy.
    Requires upstream ReplaySSM emulation and a fixed 16-token decode window.
    This is floating-storage QAT emulation; the vLLM engine adapter is separate.
quantize:
  algorithm:
  quant_cfg:
    - $import: base_disable_all
    - $import: read_fp8
  linear_attention:
    - module_name: '*'
      cfg:
        backend: serving
        precision: replayssm_two_precision
        replay_window: 16
