# Nemotron Super 3.5 VL -- **FP8 base** column of the recipe-tier table (plan doc section 4.2).
# 8-bit reference point: everything on the LLM backbone at FP8 W8A8, attention path FP8, vision BF16.
#   MoE experts + shared GEMM  FP8   |  QKV/Out proj  FP8  |  Latent MoE  FP8  |  Mamba Linear  FP8
#   KV cache FP8 | BMM1 FP8 | BMM2 FP8 | lm_head FP8 | embedding BF16 | router FP32 | vision BF16
# Serves on 2xH100 / 1xH200 / 1xB200.
imports:
  base_disable_all: configs/ptq/units/base_disable_all
  w8a8_fp8_fp8: configs/ptq/units/w8a8_fp8_fp8
  attention_qkv_fp8: configs/ptq/units/attention_qkv_fp8
  kv_fp8: configs/ptq/units/kv_fp8
  default_disabled_quantizers: configs/ptq/units/default_disabled_quantizers
  lm_head_fp8: configs/ptq/units/lm_head_fp8
  vision_never_quantize: configs/ptq/units/vision_never_quantize

metadata:
  recipe_type: ptq
  description: >-
    Nemotron 3.5 VL FP8 base tier: FP8 W8A8 across the LLM backbone (experts, shared experts, QKV/Out,
    latent MoE, Mamba in/out), FP8 attention BMM1/BMM2 and FP8 KV cache, FP8 lm_head; C-RADIO vision
    encoder and connector stay BF16; router/gate and embeddings unquantized. Max calibration.
quantize:
  algorithm:
    method: max
    # layerwise.enable=false is required for VLMs: the decoder layers sit under
    # `model.language_model.layers`, where layerwise_calibrate cannot find them.
    layerwise:
      enable: false
  quant_cfg:
    - $import: base_disable_all
    - $import: w8a8_fp8_fp8
    - $import: attention_qkv_fp8
    - $import: kv_fp8
    - $import: default_disabled_quantizers
    - $import: lm_head_fp8
    - $import: vision_never_quantize
