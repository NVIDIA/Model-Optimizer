# IQ2_XS weights with NVFP4 activations (W2A4) on MLP/MoE layers, with GPTQ.

# modelopt-schema: modelopt.recipe.config.ModelOptPTQRecipe
imports:
  base_disable_all: configs/ptq/units/base_disable_all
  default_disabled_quantizers: configs/ptq/units/default_disabled_quantizers
  iq2_xs: configs/numerics/iq2_xs
  nvfp4: configs/numerics/nvfp4

metadata:
  description: >-
    Applies GGML-compatible IQ2_XS weights with dynamic NVFP4 activations (W2A4) to MLP/MoE layers.
    The FP4 GEMM takes NVFP4 weights too, so fake quant transcodes each decoded IQ2_XS weight to
    NVFP4 and GPTQ compensates that error; any weight GPTQ leaves gets an imatrix-weighted encode.
    The export holds the IQ2_XS payloads and NVFP4 input scales. Attention and the other linears stay
    in BF16. Requires calibration data.
quantize:
  algorithm:
    - method: gptq
      # GGML encodes 256-weight blocks jointly, so GPTQ updates one block at a time.
      block_size: 256
      # Heavier than GPTQ's usual 0.01: low damping overfits the calibration Hessian at these bit widths.
      perc_damp: 0.3
      # Weight each block's codebook search by the square root of the Hessian diagonal.
      importance_weighted: true
      layerwise:
        enable: true
    - method: imatrix
  quant_cfg:
    - $import: base_disable_all
    - quantizer_name: '*mlp*weight_quantizer'
      cfg:
        $import: iq2_xs
        backend_extra_args:
          transcode: nvfp4
    - quantizer_name: '*mlp*input_quantizer'
      cfg:
        $import: nvfp4
    - quantizer_name: '*block_sparse_moe*weight_quantizer'
      cfg:
        $import: iq2_xs
        backend_extra_args:
          transcode: nvfp4
    - quantizer_name: '*block_sparse_moe*input_quantizer'
      cfg:
        $import: nvfp4
    - $import: default_disabled_quantizers
