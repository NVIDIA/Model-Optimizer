# modelopt-schema: modelopt.recipe.config.ModelOptPTQRecipe
imports:
  nvfp4_gsq: configs/ptq/nvfp4_gsq

metadata:
  description: NVFP4 weight-only local-shift GSQ initialized with awq_lite; activations and KV cache remain unquantized.
quantize:
  $import: nvfp4_gsq
  algorithm:
    method: gsq
    reconstruction: staged
    layerwise:
      enable: true
      activation_cache_device: cpu
    initializer:
      method: awq_lite
