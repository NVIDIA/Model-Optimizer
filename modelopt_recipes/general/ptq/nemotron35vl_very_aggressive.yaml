# Nemotron Super 3.5 VL -- **Very-aggressive** tier (plan doc section 4.2). Attention ladder L3 (full):
# KV FP4 + BMM1 FP4 + BMM2 FP4. Blackwell ONLY -- needs FP4 attention kernels not yet in
# vLLM/TRT-LLM, so this tier is DLSim/study-only until the serving team confirms.
#   MoE experts + shared GEMM  NVFP4
#   QKV/Out proj  NVFP4  |  Latent MoE  NVFP4  |  Mamba Linear  NVFP4
#   KV cache FP4 | BMM1 FP4 | BMM2 FP4 | lm_head W4A16 (never W4A4) | embedding BF16 | router FP32
#   vision BF16
# Recovery: PTQ + QAD (+ QARL). Note the plan expects QAD to recover the WEIGHT deltas well but the
# FP4 KV / FP4 BMM1 activation-path losses poorly.
imports:
  base_disable_all: configs/ptq/units/base_disable_all
  experts_nvfp4: configs/ptq/units/experts_nvfp4
  shared_experts_nvfp4: configs/ptq/units/shared_experts_nvfp4
  attention_proj_nvfp4: configs/ptq/units/attention_proj_nvfp4
  latent_proj_nvfp4: configs/ptq/units/latent_proj_nvfp4
  mamba_proj_nvfp4: configs/ptq/units/mamba_proj_nvfp4
  attention_bmm_nvfp4: configs/ptq/units/attention_bmm_nvfp4
  kv_nvfp4: configs/ptq/units/kv_nvfp4
  default_disabled_quantizers: configs/ptq/units/default_disabled_quantizers
  lm_head_w4a16_nvfp4: configs/ptq/units/lm_head_w4a16_nvfp4
  vision_never_quantize: configs/ptq/units/vision_never_quantize

metadata:
  recipe_type: ptq
  description: >-
    Nemotron 3.5 VL Very-aggressive tier: NVFP4 across MoE routed + shared experts, QKV/Out
    projections, latent MoE and Mamba linears; NVFP4 attention BMM1/BMM2 and NVFP4 KV cache
    (attention ladder L3); lm_head at W4A16 (NVFP4 weights, BF16 activations -- never W4A4);
    C-RADIO vision BF16. Blackwell-only. Max calibration.
quantize:
  algorithm:
    method: max
    layerwise: false
  quant_cfg:
    - $import: base_disable_all
    - $import: experts_nvfp4
    - $import: shared_experts_nvfp4
    - $import: attention_proj_nvfp4
    - $import: latent_proj_nvfp4
    - $import: mamba_proj_nvfp4
    - $import: attention_bmm_nvfp4
    - $import: kv_nvfp4
    - $import: default_disabled_quantizers
    - $import: lm_head_w4a16_nvfp4
    - $import: vision_never_quantize
