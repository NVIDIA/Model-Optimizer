# IQ2_XS weight-only PTQ and unified-checkpoint export.

imports:
  preset: configs/ptq/presets/model/iq2_xs

metadata:
  recipe_type: ptq
  description: >-
    Applies GGML-compatible IQ2_XS weight-only quantization. No calibration data is required;
    unified export writes the GGML block payload to weight for every quantized Linear weight.
quantize:
  $import: preset
