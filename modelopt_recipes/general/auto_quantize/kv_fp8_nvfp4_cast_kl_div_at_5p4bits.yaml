# Layer-wise KV-cache search over full FP8, FP8-K/NVFP4-V, and full NVFP4 at
# 5.4 bits/scalar.
# Cast mode fixes amax and skips PTQ calibration; isolated full-vocabulary forward
# KL is measured with every other eligible attention layer kept in BF16.

# modelopt-schema: modelopt.recipe.config.ModelOptAutoQuantizeRecipe
imports:
  base_disabled_layers: configs/auto_quantize/units/base_disabled_layers
  base_cost_excluded_layers: configs/auto_quantize/units/base_cost_excluded_layers
  kv_fp8_cast: configs/ptq/units/kv_fp8_cast
  kv_nvfp4_cast: configs/ptq/units/kv_nvfp4_cast
  fp8: configs/numerics/fp8
  nvfp4: configs/numerics/nvfp4

metadata:
  recipe_type: auto_quantize
  description: Layer-wise three-format KV-cache cast search at 5.4 bits using forward KL.

auto_quantize:
  constraints:
    kv_effective_bits: 5.4

  candidate_formats:
    - quant_cfg:
        - $import: kv_fp8_cast
      algorithm:
        method: max
        skip_forward_without_activation_calib: true
      effective_bits: 8.0
    - quant_cfg:
        - quantizer_name: '*k_bmm_quantizer'
          cfg:
            $import: fp8
            use_constant_amax: true
        - quantizer_name: '*v_bmm_quantizer'
          cfg:
            $import: nvfp4
            use_constant_amax: true
      algorithm:
        method: max
        skip_forward_without_activation_calib: true
      effective_bits: 6.25
    - quant_cfg:
        - $import: kv_nvfp4_cast
      algorithm:
        method: max
        skip_forward_without_activation_calib: true
      effective_bits: 4.5

  auto_quantize_method: kl_div
  score_size: 128

  disabled_layers:
    - $import: base_disabled_layers

  cost_excluded_layers:
    - $import: base_cost_excluded_layers
