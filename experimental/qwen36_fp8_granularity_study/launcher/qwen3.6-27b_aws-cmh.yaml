# Qwen3.6-27B FP8 granularity/distortion study on aws-cmh.
# Submit through modelopt-mcp with the aws_cmh cluster factory and a source_ref
# containing this study subtree. Tasks are sequential; later candidates still run
# after one candidate fails so the matrix can collect as much evidence as possible.

job_name: qwen3.6-27b_fp8_granularity
pipeline:
  skip: false
  allow_to_fail: true
  note: "Qwen/Qwen3.6-27B: per-tensor FP8, static block-128 weight-only, research dynamic block-128 W8A8, and MXFP8 distortion study"

  task_0:
    script: modules/Model-Optimizer/experimental/qwen36_fp8_granularity_study/launcher/run_study.sh
    args:
      - stage
      - --model
      - Qwen/Qwen3.6-27B
    environment:
      - STUDY_ROOT: /study
    slurm_config:
      _factory_: "slurm_factory"
      account: coreai_numerics_edge
      partition: cpu_datamover
      nodes: 1
      ntasks_per_node: 1
      # Zero is the launcher CLI-safe spelling for no GPU GRES; core normalizes it to None.
      gpus_per_node: 0
      time: "04:00:00"
      container: /lustre/fsw/portfolios/coreai/users/weimingc/vllm_container_images/qwen36_pr_stack_latest_runtime_only_20260519_234147/images/vllm_qwen36_pr_stack_latest_runtime_only.sqsh
      container_mounts:
        - /lustre/fsw/portfolios/coreai/projects/coreai_numerics_edge/users/weimingc/qwen36_fp8_granularity_study:/study

  task_1:
    script: modules/Model-Optimizer/experimental/qwen36_fp8_granularity_study/launcher/run_study.sh
    args:
      - run
      - --model
      - Qwen/Qwen3.6-27B
      - --candidates
      - per_tensor_fp8,per_tensor_fp8_weight_only_control
    environment:
      - STUDY_ROOT: /study
    slurm_config:
      _factory_: "slurm_factory"
      account: coreai_numerics_edge
      partition: batch_long
      nodes: 1
      ntasks_per_node: 1
      gpus_per_node: 4
      time: "24:00:00"
      container: /lustre/fsw/portfolios/coreai/users/weimingc/vllm_container_images/qwen36_pr_stack_latest_runtime_only_20260519_234147/images/vllm_qwen36_pr_stack_latest_runtime_only.sqsh
      container_mounts:
        - /lustre/fsw/portfolios/coreai/projects/coreai_numerics_edge/users/weimingc/qwen36_fp8_granularity_study:/study

  task_2:
