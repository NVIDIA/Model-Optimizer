<svg xmlns="http://www.w3.org/2000/svg" width="640" height="796" viewBox="0 0 640 796" role="img" aria-labelledby="title desc">
<title id="title">From layer sensitivity to a mixed-precision KV recipe</title>
<desc id="desc">Illustrative search with four equal-width layers. GEMM settings stay fixed in the reference and every trial, whether BF16 or already quantized. Compare each isolated layer/candidate trial with a BF16 KV reference. NVFP4 sensitivities are 0.03, 0.32, 0.09, 0.02; FP8 sensitivities are 0.01, 0.02, 0.01, 0.01. Under a 5.375-bit budget, select NVFP4, FP8, NVFP4, NVFP4. Upgrading layer 2 gives the largest sensitivity reduction, 0.30.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/></marker></defs>
<style>
text { font-family: Arial, Helvetica, sans-serif; fill: #172b3a; }
.heading { font-size: 25px; font-weight: 700; }
.label { font-size: 21px; }
.small { font-size: 20px; fill: #475569; }
.layer { font-size: 20px; fill: #64748b; text-anchor: middle; }
.format { font-size: 20px; font-weight: 700; text-anchor: middle; }
.score { font-size: 25px; font-weight: 600; text-anchor: middle; }
.panel { fill: #f8fafc; stroke: #dbe3eb; }
.bf16 { fill: #e9edf2; stroke: #cbd5e1; }
.nvfp4 { fill: #eaf5d8; stroke: #7ea93e; }
.fp8 { fill: #e2edff; stroke: #4d83c8; }
.flow { fill: none; stroke: #64748b; stroke-width: 1.7; marker-end: url(#arrow); }
</style>
<rect x="0" y="0" width="640" height="796" rx="16" class="" fill="#fff"/>
<text x="24" y="34" class="" font-size="28" font-weight="700">From sensitivity to a KV recipe</text>
<text x="24" y="62" class="small" >Illustrative example · four equal-width layers</text>
<rect x="12" y="84" width="616" height="222" rx="14" class="panel" />
<circle cx="40" cy="114" r="17" fill="#172b3a"/>
<text x="40" y="121" class="format" style="fill: #fff">1</text>
<text x="68" y="122" class="heading" >Measure each layer / candidate</text>
<text x="32" y="151" class="small" >GEMM fixed; change one layer’s KV format.</text>
<text x="212" y="178" class="layer" >L1</text>
<text x="312" y="178" class="layer" >L2</text>
<text x="412" y="178" class="layer" >L3</text>
<text x="512" y="178" class="layer" >L4</text>
<text x="32" y="212" class="label" >Reference</text>
<rect x="172" y="186" width="80" height="36" rx="6" class="bf16" />
<text x="212" y="211" class="format" >BF16</text>
<path d="M 253 204 H 268" class="flow"/>
<rect x="272" y="186" width="80" height="36" rx="6" class="bf16" />
<text x="312" y="211" class="format" >BF16</text>
<path d="M 353 204 H 368" class="flow"/>
<rect x="372" y="186" width="80" height="36" rx="6" class="bf16" />
<text x="412" y="211" class="format" >BF16</text>
<path d="M 453 204 H 468" class="flow"/>
<rect x="472" y="186" width="80" height="36" rx="6" class="bf16" />
<text x="512" y="211" class="format" >BF16</text>
<text x="32" y="256" class="label" >Trial</text>
<rect x="172" y="230" width="80" height="36" rx="6" class="bf16" />
<text x="212" y="255" class="format" >BF16</text>
<path d="M 253 248 H 268" class="flow"/>
<rect x="272" y="230" width="80" height="36" rx="6" class="nvfp4" stroke-width="2.2"/>
<text x="312" y="255" class="format" >NVFP4</text>
<path d="M 353 248 H 368" class="flow"/>
<rect x="372" y="230" width="80" height="36" rx="6" class="bf16" />
<text x="412" y="255" class="format" >BF16</text>
<path d="M 453 248 H 468" class="flow"/>
<rect x="472" y="230" width="80" height="36" rx="6" class="bf16" />
<text x="512" y="255" class="format" >BF16</text>
<path d="M 555 204 H 606 V 287 H 592" class="flow"/>
<path d="M 555 248 H 580 V 271 H 472 V 278" class="flow"/>
<text x="32" y="292" class="small" >Restore, then repeat for all choices</text>
<rect x="428" y="279" width="164" height="24" rx="5" class="" fill="#e4eaf1"/>
<text x="510" y="298" class="" font-size="20" font-weight="700" text-anchor="middle">Output KL</text>
<path d="M 320 313 V 331" class="flow"/>
<rect x="12" y="342" width="616" height="192" rx="14" class="panel" />
<circle cx="40" cy="372" r="17" fill="#172b3a"/>
<text x="40" y="379" class="format" style="fill: #fff">2</text>
<text x="68" y="380" class="heading" >Build the sensitivity map</text>
<text x="32" y="409" class="small" >Lower KL = closer to the reference</text>
<text x="212" y="436" class="layer" >L1</text>
<text x="312" y="436" class="layer" >L2</text>
<text x="412" y="436" class="layer" >L3</text>
<text x="512" y="436" class="layer" >L4</text>
<rect x="28" y="446" width="105" height="30" rx="6" class="nvfp4" />
<text x="80" y="468" class="format" >NVFP4</text>
<rect x="172" y="442" width="80" height="38" rx="6" class="" fill="#edf1f5"/>
<text x="212" y="469" class="score" style="fill: #172b3a">0.03</text>
<rect x="272" y="442" width="80" height="38" rx="6" class="" fill="#ffdfce"/>
<text x="312" y="469" class="score" style="fill: #953c12">0.32</text>
<rect x="372" y="442" width="80" height="38" rx="6" class="" fill="#edf1f5"/>
<text x="412" y="469" class="score" style="fill: #172b3a">0.09</text>
<rect x="472" y="442" width="80" height="38" rx="6" class="" fill="#edf1f5"/>
<text x="512" y="469" class="score" style="fill: #172b3a">0.02</text>
<rect x="28" y="490" width="105" height="30" rx="6" class="fp8" />
<text x="80" y="512" class="format" >FP8</text>
<rect x="172" y="486" width="80" height="38" rx="6" class="" fill="#edf1f5"/>
<text x="212" y="513" class="score" style="fill: #172b3a">0.01</text>
<rect x="272" y="486" width="80" height="38" rx="6" class="" fill="#e2edff"/>
<text x="312" y="513" class="score" style="fill: #285e9d">0.02</text>
<rect x="372" y="486" width="80" height="38" rx="6" class="" fill="#edf1f5"/>
<text x="412" y="513" class="score" style="fill: #172b3a">0.01</text>
<rect x="472" y="486" width="80" height="38" rx="6" class="" fill="#edf1f5"/>
<text x="512" y="513" class="score" style="fill: #172b3a">0.01</text>
<path d="M 320 541 V 573" class="flow"/>
<rect x="376" y="545" width="238" height="30" rx="15" class="" fill="#172b3a"/>
<text x="495" y="567" class="label" style="fill: #fff" text-anchor="middle">Budget: 5.375 bits</text>
<path d="M 372 560 H 324" class="flow"/>
<rect x="12" y="586" width="616" height="162" rx="14" class="panel" />
<circle cx="40" cy="616" r="17" fill="#172b3a"/>
<text x="40" y="623" class="format" style="fill: #fff">3</text>
<text x="68" y="624" class="heading" >Optimize and assign formats</text>
<text x="32" y="653" class="small" >Minimum total KL within the bit budget</text>
<text x="212" y="680" class="layer" >L1</text>
<text x="312" y="680" class="layer" >L2</text>
<text x="412" y="680" class="layer" >L3</text>
<text x="512" y="680" class="layer" >L4</text>
<text x="32" y="715" class="label" >Selected KV</text>
<rect x="172" y="689" width="80" height="36" rx="6" class="nvfp4" />
<text x="212" y="714" class="format" >NVFP4</text>
<rect x="272" y="689" width="80" height="36" rx="6" class="fp8" stroke-width="2.2"/>
<text x="312" y="714" class="format" >FP8</text>
<rect x="372" y="689" width="80" height="36" rx="6" class="nvfp4" />
<text x="412" y="714" class="format" >NVFP4</text>
<rect x="472" y="689" width="80" height="36" rx="6" class="nvfp4" />
<text x="512" y="714" class="format" >NVFP4</text>
<text x="320" y="779" class="label" text-anchor="middle">(4.5 + 8 + 4.5 + 4.5) / 4 = 5.375 bits</text>
</svg>
