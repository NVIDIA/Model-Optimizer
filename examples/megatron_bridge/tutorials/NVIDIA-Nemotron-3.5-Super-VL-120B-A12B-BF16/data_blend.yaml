# Weighted text-only chat blend for this tutorial's QAD, distilled on assistant tokens only
# (`distill.py --sft --sft_hf_dataset ... --sft_loss_mode assistant`). Prepare it with
# `python -m modelopt.torch.utils.plugins.prepare_megatron_data_blend --config data_blend.yaml`;
# see examples/dataset/MEGATRON_DATA_PREP.md. Set `output_dir` first.

output_dir: /path/to/qad_blend
output_format: chat_jsonl
# 600 iterations x 64 conversations read the 37,000-row training split about once.
target_samples: 38_000
# Buffer-shuffle each source before selection; keep all dataset revisions fixed.
shuffle: true
seed: 1234
shuffle_buffer_size: 10_000
validation_samples: 1_000
group_split: true
filter_image_references: true
filter_tool_calls: true
filter_invalid_reasoning: true
sources:
  - hf_dataset: nvidia/Nemotron-Pretraining-SFT-v1
    revision: 3f1a5b884d0b890f02ead979ce698dc95debd953
    config: Nemotron-SFT-Code
    split: train
    content_field: text
    weight: 5
  - hf_dataset: nvidia/Nemotron-Pretraining-SFT-v1
    revision: 3f1a5b884d0b890f02ead979ce698dc95debd953
    config: Nemotron-SFT-General
    split: train
    content_field: text
    weight: 20
  - hf_dataset: nvidia/Nemotron-Pretraining-SFT-v1
    revision: 3f1a5b884d0b890f02ead979ce698dc95debd953
    config: Nemotron-SFT-MATH
    split: train
    content_field: text
    weight: 5
  - hf_dataset: nvidia/Nemotron-Math-v2
    revision: 8e793210e175b6406c752a870f585f62de98c0d3
    config: default
    split: high_part00
    content_field: messages
    weight: 10
  - hf_dataset: nvidia/Nemotron-SFT-Math-v3
    revision: ff4439c1073c87e006ab7ee5f1e5e28c4790dab3
    config: default
    split: train
