# AA-Omniscience (public set) eval for Qwen3.6-35B-A3B: knowledge recall and calibration. See the tutorial
# README, "Knowledge recall and calibration".
#
# Set `execution.hostname`, `execution.account` and `deployment.checkpoint_path` (BF16, W4A4 PTQ or QAD)
# before running. Serves BF16 and NVFP4 unchanged: vLLM reads the FP8 KV-cache setting from the
# checkpoint's own `quantization_config`. NVFP4 needs a Blackwell GPU.
#
# Sampling as for the other benchmarks: T=1.0, top_p=0.95, max_new_tokens=131072.
# 600 questions x num_repeats 10 in a SINGLE run; report `pass@1[avg-of-10]` (judge_correct,
# judge_omni_index = correct - incorrect, judge_omni_hallucination = incorrect / not correct), not
# plain `pass@1`. ~1.5-2 h on one node; the slowest QAD checkpoint needed a second 4 h job.
# JUDGE-SCORED (we used Gemini 3 Flash): needs NS_JUDGE_URL / OMNI_JUDGE_MODEL_ID / INFERENCE_API_KEY.
# Keep the judge fixed across compared models.
#
#   pip install "nemo-evaluator-launcher[all]==0.2.6"
#   export HF_TOKEN=<token>; export SLURM_JOB_DIR=<dir>; export HF_HOME=<cache>
#   nemo-evaluator-launcher run --config evaluation/omniscience.yaml
defaults:
  - execution: slurm/default
  - deployment: vllm
  - _self_

execution:
  type: slurm
  hostname: ???
  username: ${oc.env:USER}
  account: ???
  partition: batch
  num_nodes: 1
  ntasks_per_node: 1
  gpus_per_node: 4
  gres: "gpu:4"
  walltime: 04:00:00
  output_dir: ${oc.env:SLURM_JOB_DIR}
  mode: sequential
  mounts:
    mount_home: false

deployment:
  checkpoint_path: ???
  served_model_name: qwen3.6-35b-a3b
  port: 8000
  image: vllm/vllm-openai:v0.28.0
  env_vars:
    HF_TOKEN: host:HF_TOKEN
  command: >-
    vllm serve /checkpoint
    --served-model-name ${deployment.served_model_name}
    --host 0.0.0.0
    --port ${deployment.port}
    --tensor-parallel-size 4
    --data-parallel-size 1
    --enable-expert-parallel
    --max-model-len 262144
    --reasoning-parser qwen3
    --model-loader-extra-config '{"enable_multithread_load": true, "num_threads": 128}'
    --max-num-batched-tokens 8192
    --enable-chunked-prefill
    --max-num-seqs 32
  endpoints:
    chat: /v1/chat/completions
    completions: /v1/completions
    health: /health

evaluation:
  env_vars:
    HF_TOKEN: host:HF_TOKEN
    DUMMY_API_KEY: lit:dummy
    # The judge is a separate endpoint and needs its own key.
    INFERENCE_API_KEY: host:INFERENCE_API_KEY
  nemo_evaluator_config:
    config:
      params:
        parallelism: 32
        request_timeout: 3600
        max_retries: 10
        max_new_tokens: 131072
        temperature: 1.0
        top_p: 0.95
    target:
      api_endpoint:
        api_key_name: DUMMY_API_KEY
        adapter_config:
          use_caching: true
          use_reasoning: true
          log_failed_requests: true
          use_request_logging: true
          max_logged_requests: 2
          use_response_logging: true
          max_logged_responses: 2
          params_to_add:
            chat_template_kwargs:
              enable_thinking: true
  tasks:
    - name: ns_omniscience
      env_vars:
        INFERENCE_API_KEY: host:INFERENCE_API_KEY
      nemo_evaluator_config:
        config:
          params:
            extra:
              num_repeats: 10
              # vLLM's reasoning parser already strips the thinking; NeMo-Skills' own parse would find no
              # </think> in the answer and grade it as empty.
              args: "++parse_reasoning=False"
              # Always judge-scored, so unlike AA-LCR it needs no `judge_support: true`.
              judge:
                url: ${oc.env:NS_JUDGE_URL}
                model_id: ${oc.env:OMNI_JUDGE_MODEL_ID}
                api_key: INFERENCE_API_KEY
