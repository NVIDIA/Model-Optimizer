# Shared single-GPU Slurm execution settings for H100 evaluation.
execution:
  hostname: ${oc.env:NEL_SLURM_HOST}
  username: ${oc.env:SLURM_USER}
  account: ${oc.env:NEL_SLURM_ACCOUNT}
  partition: ${oc.env:NEL_SLURM_PARTITION}
  output_dir: ${oc.env:NEL_OUTPUT_DIR}
  num_nodes: 1
  ntasks_per_node: 1
  gres: gpu:1
  walltime: 04:00:00
  sbatch_extra_flags:
    exclusive: false
    mem: 64G
  mounts:
    mount_home: false
    deployment:
      /path/to/checkpoint: /checkpoint
    evaluation:
      /path/to/checkpoint: /checkpoint
