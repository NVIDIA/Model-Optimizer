    The configured 256-step finalist continuation was not run and has not been
    established as a necessary or sufficient convergence threshold.
  - The final bounded matched teacher comparison was not run.
  - The downstream screen covers only RealWorldQA and MMMU.
  - The first 100 rows per task were reused across deterministic repetitions.
  - A frozen per-item source-ID manifest and per-item outputs are not retained here.
  - >-
    Corrected pre-KD downstream scores are omitted because their exact source
    artifact was not retained with a verifiable hash.
  - The exact execution Git revision and accelerator model were not recorded.
  - The public runner is a placeholder template, not the executed site contract.
  - Teacher serving performance was not measured under the student contract.
  - Single-GPU uncapped full-objective KD did not fit the observed memory envelope.
  - Failed and superseded attempts remain external and are not quality evidence.
