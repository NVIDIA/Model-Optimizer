schema_version: 1
definition: >-
  Reported with known slicing warnings means that a campaign executed the
  listed pruning dimensions and settings through its stated stage boundary,
  while its report also records unresolved slicing-equivalence warnings. A
  completed stage status records execution and artifacts, not a successful
  correctness gate or a model support claim.

