# Template for the optional distributed evaluator.  Existing Puzzletron configs
# remain unchanged; the shell launchers translate these values to CLI arguments.
campaign_dir: /path/to/puzzle_dir/distributed_eval/campaign
config_path: /path/to/existing/clean/experiment.yaml
solutions_path: /path/to/puzzle_dir/single_sequence_replacement_solutions.json
output_dir: /path/to/puzzle_dir/distributed_eval/output
compatibility_output_dir: /path/to/puzzle_dir/single_sequence_replacement_solutions--validation

worker:
  world_size: 8
  port: 5010
  heartbeat_seconds: 10

coordinator:
  stale_seconds: 45
  connect_timeout_seconds: 10
  task_timeout_seconds: 7200
  retry_initial_seconds: 5
  retry_max_seconds: 60

prefix_activation_cache:
  enabled: false
  reason: topology-specific AutoModel correctness is not yet validated
