# Evaluate up to four independent 4B candidates concurrently. Most candidate
# stages use one GPU per instance; TP2 KD uses two. Selected-student TP2 KD
# uses two GPUs while the remaining selected-student stages use one.
execution:
  defaults:
    failure_policy: strict
    halt_policy: drain
    # Node capacity used by the orchestrator when packing independent
    # candidate instances. Partial-node stages request only their active GPUs.
    gpus_per_node: 8
  stages:
    depth_importance: {strategy: single}
    replacement_scoring: {strategy: single}
    post.candidate-evaluation.online_eval: &candidate_instances {instances: 4}
    post.candidate-evaluation.materialized: *candidate_instances
    post.candidate-evaluation.serving: *candidate_instances
    post.candidate-evaluation.screening_kd: *candidate_instances
    post.candidate-evaluation.screening_eval: *candidate_instances
    post.candidate-evaluation.quality_screen: *candidate_instances
    final_report: {partition: cpu}
