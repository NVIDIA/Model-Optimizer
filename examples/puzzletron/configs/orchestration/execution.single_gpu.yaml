# Shared one-GPU execution profile for bounded Puzzletron examples. Most stages
# already default to one instance with the strategy implied by their stage or
# post-MIP node type. These two stages otherwise use a persistent worker pool.
execution:
  defaults:
    failure_policy: strict
    halt_policy: drain
    gpus_per_node: 1
  stages:
    depth_importance: {strategy: single}
    replacement_scoring: {strategy: single}
