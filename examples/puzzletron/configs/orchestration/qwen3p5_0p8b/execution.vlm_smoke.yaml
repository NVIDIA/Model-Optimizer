# Compact lifecycle smoke inside one reusable eight-GPU Slurm allocation. Each
# logical stage keeps its own attempt and log; independent work may share the
# configured GPU capacity without additional scheduler submissions.
execution:
  mode: reusable_allocation
  defaults:
    failure_policy: strict
    halt_policy: drain
    gpus_per_node: 8
  stages:
    prepare_dataset: {strategy: single, resource: cpu}
    mip: {strategy: single, resource: cpu}
    depth_importance: {strategy: single}
    replacement_scoring: {strategy: single}
