# VLM admitted-axis campaign execution profile. Candidate and control work is
# sharded across at most two one-GPU instances. Each retained architecture keeps
# one sequential optimizer-resume trajectory across cumulative KD milestones.
execution:
  defaults:
    failure_policy: strict
    halt_policy: drain
    gpus_per_node: 1
  stages:
    prepare_dataset: {strategy: single, resource: cpu}
    convert: {strategy: single, resource: cpu}
    mip: {strategy: single, resource: cpu}
    depth_importance: {strategy: single}
    replacement_scoring: {strategy: single}
    post.candidate-evaluation.online_eval: &candidate_instances {instances: 2}
    post.candidate-evaluation.best_lm: {strategy: single, resource: cpu}
    post.candidate-evaluation.materialized: *candidate_instances
    post.candidate-evaluation.bounded_serving: {instances: 1}
    post.candidate-evaluation.pre_kd_short_v2: *candidate_instances
    post.candidate-evaluation.kd_64: *candidate_instances
    post.candidate-evaluation.short_v2_64: *candidate_instances
    post.candidate-evaluation.kd_128: *candidate_instances
    post.candidate-evaluation.short_v2_128: *candidate_instances
    post.candidate-evaluation.kd_256: *candidate_instances
    post.candidate-evaluation.short_v2_256: *candidate_instances
    post.candidate-evaluation.selected: {strategy: single, resource: cpu}
    post.candidate-evaluation.bounded_result: {strategy: single, resource: cpu}
    post.all-axis-sentinel.sentinel_materialized: {instances: 1}
    post.all-axis-sentinel.sentinel_pre_kd_short_v2: {instances: 1}
    post.all-axis-sentinel.sentinel_kd_64: {instances: 1}
    post.all-axis-sentinel.sentinel_short_v2_64: {instances: 1}
    post.all-axis-sentinel.sentinel_kd_128: {instances: 1}
    post.all-axis-sentinel.sentinel_short_v2_128: {instances: 1}
    post.all-axis-sentinel.sentinel_kd_256: {instances: 1}
    post.all-axis-sentinel.sentinel_short_v2_256: {instances: 1}
    post.all-axis-sentinel.sentinel_result: {strategy: single, resource: cpu}
    post.all-axis-sentinel.sentinel_serving: {instances: 1}
    post.control-learning-curve.control_materialized: &control_instances {instances: 2}
    post.control-learning-curve.control_pre_kd_short_v2: *control_instances
    post.control-learning-curve.control_kd_64: *control_instances
    post.control-learning-curve.control_short_v2_64: *control_instances
    post.control-learning-curve.control_kd_128: *control_instances
    post.control-learning-curve.control_short_v2_128: *control_instances
    post.control-learning-curve.control_kd_256: *control_instances
    post.control-learning-curve.control_short_v2_256: *control_instances
    post.control-learning-curve.control_result: {strategy: single, resource: cpu}
