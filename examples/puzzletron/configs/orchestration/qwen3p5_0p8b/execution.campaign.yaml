# One-GPU execution shape for the Qwen 3.5 0.8B campaign example.
# Supply a site-specific runner with matching worker paths and scheduler fields.
execution:
  defaults:
    failure_policy: strict
    halt_policy: drain
    gpus_per_node: 1
  stages:
    convert: {strategy: single, instances: 1}
    tokenize_data: {strategy: single, instances: 1}
    vllm_stats: {strategy: single, instances: 1}
    depth_importance: {strategy: single, instances: 1}
    width_importance: {strategy: single, instances: 1}
    sort: {strategy: single, instances: 1}
    sort_sanity: {strategy: single, instances: 1}
    width_sanity: {strategy: single, instances: 1}
    slicing_sanity: {strategy: single, instances: 1}
    bypass_sanity: {strategy: single, instances: 1}
    bypass: {strategy: single, instances: 1}
    build_library: {strategy: single, instances: 1}
    replacement_scoring: {strategy: single, instances: 1}
    mip: {strategy: single, instances: 1}
    post.runtime-075.online_eval: {strategy: sharded, instances: 1}
    post.runtime-075.best_lm: {strategy: single, instances: 1}
    post.runtime-075.materialized: {strategy: sharded, instances: 1}
    post.runtime-075.serving: {strategy: sharded, instances: 1}
    post.runtime-075.fastest: {strategy: single, instances: 1}
    post.runtime-075.global_kd: {strategy: sharded, instances: 1}
    post.runtime-075.final_eval: {strategy: sharded, instances: 1}
    post.runtime-075.best: {strategy: single, instances: 1}
    post.runtime-075.quality_benchmarks: {strategy: sharded, instances: 1}
