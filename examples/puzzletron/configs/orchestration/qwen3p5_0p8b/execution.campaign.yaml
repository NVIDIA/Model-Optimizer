# Campaign execution profile. The KD nodes use two data-parallel GPUs per
# candidate. Other candidate nodes use one GPU per instance.
execution:
  defaults:
    failure_policy: strict
    halt_policy: drain
    gpus_per_node: 1
  stages:
    depth_importance: {strategy: single}
    replacement_scoring: {strategy: single}
    post.candidate-evaluation.online_eval: &candidate_instances {instances: 2}
    post.candidate-evaluation.materialized: *candidate_instances
    post.candidate-evaluation.serving: *candidate_instances
    post.candidate-evaluation.screening_kd: {instances: 2, gpus_per_node: 2}
    post.candidate-evaluation.screening_eval: *candidate_instances
    post.candidate-evaluation.quality_screen: *candidate_instances
    post.candidate-evaluation.global_kd: {gpus_per_node: 2}
