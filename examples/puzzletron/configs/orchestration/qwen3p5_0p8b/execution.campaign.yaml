# Campaign execution profile. Candidate and control work is sharded across at
# most two one-GPU instances. Each retained architecture keeps one sequential
# optimizer-resume trajectory across its cumulative KD milestones.
execution:
  defaults:
    failure_policy: strict
    halt_policy: drain
    gpus_per_node: 1
  stages:
    convert: {strategy: single, resource: cpu}
    tokenize_data: {strategy: single, resource: cpu}
    mip: {strategy: single, resource: cpu}
    depth_importance: {strategy: single}
    replacement_scoring: {strategy: single}
    post.candidate-evaluation.legal_candidates: {strategy: single, resource: cpu}
    post.candidate-evaluation.online_eval: &candidate_instances {instances: 2}
    post.candidate-evaluation.best_lm: {strategy: single, resource: cpu}
    post.candidate-evaluation.materialized: *candidate_instances
    post.candidate-evaluation.serving: *candidate_instances
    post.candidate-evaluation.kd_shortlist: {strategy: single, resource: cpu}
    post.candidate-evaluation.pre_kd_short_v1: *candidate_instances
    post.candidate-evaluation.kd_64: *candidate_instances
    post.candidate-evaluation.short_v1_64: *candidate_instances
    post.candidate-evaluation.kd_128: *candidate_instances
    post.candidate-evaluation.short_v1_128: *candidate_instances
    post.candidate-evaluation.kd_256: *candidate_instances
    post.candidate-evaluation.short_v1_256: *candidate_instances
    post.candidate-evaluation.selected: {strategy: single, resource: cpu}
    post.candidate-evaluation.bounded_result: {strategy: single, resource: cpu}
    post.candidate-evaluation.approve_512: {strategy: single, resource: cpu}
    post.candidate-evaluation.approve_1024: {strategy: single, resource: cpu}
    post.candidate-evaluation.best: {strategy: single, resource: cpu}
    post.control-learning-curve.control_materialized: &control_instances {instances: 2}
    post.control-learning-curve.control_pre_kd_short_v1: *control_instances
    post.control-learning-curve.control_kd_64: *control_instances
    post.control-learning-curve.control_short_v1_64: *control_instances
    post.control-learning-curve.control_kd_128: *control_instances
    post.control-learning-curve.control_short_v1_128: *control_instances
    post.control-learning-curve.control_kd_256: *control_instances
    post.control-learning-curve.control_short_v1_256: *control_instances
    post.control-learning-curve.control_result: {strategy: single, resource: cpu}
