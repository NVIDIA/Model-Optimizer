# One-GPU execution profile for the Qwen 3.5 0.8B reproducibility smoke.
# Pure orchestration and result-assembly stages run on CPU.
execution:
  defaults:
    failure_policy: strict
    halt_policy: drain
    gpus_per_node: 1
  stages:
    prepare_dataset: {strategy: single, resource: cpu}
    mip: {strategy: single, resource: cpu}
    depth_importance: {strategy: single}
    replacement_scoring: {strategy: single}
    post.reproducibility-smoke.retain_variants: {strategy: single, resource: cpu}
    post.reproducibility-smoke.result: {strategy: single, resource: cpu}
