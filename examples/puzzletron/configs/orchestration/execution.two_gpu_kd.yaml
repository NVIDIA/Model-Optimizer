# Two GPUs are available to each data-parallel KD run. Candidate screening may
# run both students concurrently; winner-only stages use one instance.
execution:
  defaults:
    failure_policy: strict
    halt_policy: drain
    gpus_per_node: 2
  stages:
    depth_importance: {strategy: single}
    replacement_scoring: {strategy: single}
    post.candidate-evaluation.online_eval: {instances: 2}
    post.candidate-evaluation.materialized: {instances: 2}
    post.candidate-evaluation.serving: {instances: 2}
    post.candidate-evaluation.screening_kd: {instances: 2}
    post.candidate-evaluation.screening_eval: {instances: 2}
    post.candidate-evaluation.quality_screen: {instances: 2}
    post.candidate-evaluation.global_kd: {instances: 1}
    post.candidate-evaluation.final_eval: {instances: 1}
    post.candidate-evaluation.quality_benchmarks: {instances: 1}
