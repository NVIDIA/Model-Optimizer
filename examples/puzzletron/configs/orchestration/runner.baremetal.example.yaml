# Example bare-metal runner config for the v2 orchestrator.

runner:
  kind: baremetal
  inventory:
    # Replace these generic names with hosts reachable from the controller.
    rendezvous_host: node-a
    rendezvous_port_base: 29500
    hosts:
      - hostname: node-a
        gpus: 8
      - hostname: node-b
        gpus: 8
  execution_contract:
    repository: .
    venv: .venv
    # Optional. Set to a worker-side environment setup script when needed.
    setup_env: null
