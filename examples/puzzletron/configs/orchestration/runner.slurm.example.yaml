# Example Slurm runner config for the v2 orchestrator.

runner:
  kind: slurm
  slurm:
    # Required placeholder. Replace with the Slurm account for your site.
    account: REPLACE_WITH_SLURM_ACCOUNT
    # Optional default for stages without a partition override. Use one name or
    # a list of eligible names. Slurm uses the site default when this is omitted.
    partition:
      - REPLACE_WITH_PRIMARY_SLURM_PARTITION
      - REPLACE_WITH_ALTERNATE_SLURM_PARTITION
    time_limit: "4:00:00"
    log_dir: logs
  execution_contract:
    # The canonical Puzzletron image provides these paths. Change them only
    # when using a custom worker environment.
    repository: /opt/puzzletron/src/modelopt
    venv: /venv
    # Required for the canonical worker environment. Replace with a registry
    # reference or materialized image accepted by the site's container plugin.
    container: REPLACE_WITH_REVIEWED_PUZZLETRON_IMAGE
    # Optional and used only with a container. Use comma-separated
    # /host/path:/container/path entries, for example /data:/data,/models:/models.
    container_mounts:
    # Optional shell commands run in order before virtualenv activation.
    # Example: ["module load cuda", "export HF_HOME=/data/huggingface"]
    prerun_commands: []
    # Optional shell commands run when the stage payload exits.
    postrun_commands: []
