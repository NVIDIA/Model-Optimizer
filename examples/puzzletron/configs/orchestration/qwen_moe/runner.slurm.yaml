runner:
  kind: slurm
  slurm:
    # Required placeholder. Replace with the Slurm account for your site.
    account: REPLACE_WITH_SLURM_ACCOUNT
    # Replace with one partition name or a list of eligible names for this site.
    partition: REPLACE_WITH_SLURM_PARTITION
    max_nodes: 20
    time_limit: "4:00:00"
  execution_contract:
    # These paths are provided by the canonical Puzzletron worker image.
    repository: /opt/puzzletron/src/modelopt
    venv: /venv
    # Replace with a registry reference or materialized copy of that image.
    container: REPLACE_WITH_REVIEWED_PUZZLETRON_IMAGE
    # Replace with the host and container paths required by the campaign.
    container_mounts: "REPLACE_WITH_HOST_PATH:REPLACE_WITH_CONTAINER_PATH"
    # Optional site setup, for example cache or authentication variables.
    prerun_commands: []
    # Optional shell commands run when the stage payload exits.
    postrun_commands: []
