  attn_heads_list:
    - [1, 1]
    - [2, 1]
    - [3, 1]
    - [4, 1]
    - [2, 2]
    - [4, 2]
    - [6, 2]
    - [8, 2]
    - [3, 3]
    - [6, 3]
    - [9, 3]
    - [12, 3]
    - [4, 4]
    - [8, 4]
    - [12, 4]
    - [16, 4]

search_space:
