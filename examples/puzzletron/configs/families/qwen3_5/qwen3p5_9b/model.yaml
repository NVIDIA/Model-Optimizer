    ffn_intermediate:
      enabled: true
      teacher_value: 12288
      values: [10240, 8192, 6144, 5120, 4096, 3072, 2048]
    kv_groups:
      enabled: true
      teacher_value: 4
      values: [3, 2, 1]
    q_heads_per_group:
      enabled: true
      teacher_value: 4
      values: [3, 2, 1]
    gdn_key_groups:
