# @package _global_

defaults:
  - full_vlm_smoke
  - /families/qwen3_5/qwen3p5_0p8b/vlm_quality_evaluation@_global_
  - _self_

# Opt-in deterministic quality comparison. Unlike full_vlm_smoke, this recipe
# compares the final distilled student with the pinned teacher using identical
# RealWorldQA and MMMU settings. It records the results without defining
# pass/fail thresholds and is excluded from default CI because it requires a
# real checkpoint and GPU time.
puzzle_dir: ${oc.env:PUZZLETRON_RUN_ROOT,puzzle_runs/qwen3p5_0p8b_e2e_vlm_quality_comparison}
display_name: Qwen3p5 0.8B end-to-end VLM quality comparison

# Historical evidence belongs to this checkpoint-specific comparison, not to
# the reusable evaluator settings or generated setup defaults. Two identical
# 100-example GPU runs produced these values. Fresh runs publish
# observation_delta.* metrics but never gate on them.
vlm_quality_evaluation:
  recorded_observation:
    repeat_count: 2
    candidate_architecture:
      parameter_pruning_percent: 10.042
      parameter_retention_percent: 89.958
      ffn_layers: 24
      teacher_intermediate_size: 3584
      student_intermediate_size: 2048
      ffn_width_pruning_percent: 42.857
    metrics:
      candidate.modelopt_vlm_benchmark_realworldqa.exact_match_flexible-extract: 0.24
      reference.modelopt_vlm_benchmark_realworldqa.exact_match_flexible-extract: 0.60
      candidate.modelopt_vlm_benchmark_mmmu_val.mmmu_acc_none: 0.25
      reference.modelopt_vlm_benchmark_mmmu_val.mmmu_acc_none: 0.35

pruning:
  eval_samples: 8

sort_sanity:
  eval_samples: 2

width_sanity:
  target_count_per_axis: 1
  layer_count: 2
  eval_samples: 2

replacement_scoring:
  eval_samples: 2

mip:
  runs:
    params-90:
      solver:
        num_solutions: 1
        min_hamming_distance: 2
        max_seconds_per_solution: 30
      homogeneous:
        keep: 5

post_mip:
  flows:
    params-90:
      nodes:
        image_eval:
          config:
            eval_samples: 2
            block_size: 512
        best_vlm_loss:
          top_k: 2
        vlm_serving:
          config:
            concurrency: [1]
            request_count: 1
            readiness_timeout: 300
            benchmark_timeout: 300
        short_vlm_kd:
          config:
            max_steps: 2
            global_batch_size: 1
            local_batch_size: 1
            checkpoint_every_steps: 2

        quality_benchmarks:
          type: downstream_evaluation
          input: short_vlm_kd
          failure_policy: strict
          config: ${vlm_quality_evaluation}
