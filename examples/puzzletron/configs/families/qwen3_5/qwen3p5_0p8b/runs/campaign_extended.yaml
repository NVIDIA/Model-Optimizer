# @package _global_

defaults:
  - campaign
  - /families/qwen3_5/qwen3p5_0p8b/advanced@_global_
  - _self_

# Campaign using hidden width, FFN width, and depth from the shared Qwen 3.5
# 0.8B search overlay. Grouped-attention and GDN candidates remain exclusive
# to the all-axis VLM campaign.
puzzle_dir: ${oc.env:PUZZLETRON_RUN_ROOT,puzzle_runs/qwen3p5_0p8b_extended}
display_name: Qwen3p5 0.8B extended pruning campaign

pruning:
  experiment_id: qwen35_0p8b_extended_2048
  attention_scored_axes: []
  gdn_scored_axes: []

search_space:
  axes:
    kv_groups: {enabled: false, values: []}
    q_heads_per_group: {enabled: false, values: []}
    gdn_key_groups: {enabled: false, values: []}
    gdn_value_heads_per_group: {enabled: false, values: []}
    gdn_key_head_dim: {enabled: false, values: []}
    gdn_value_head_dim: {enabled: false, values: []}

depth_importance:
  expected_initial_sublayers: 48
  eval_samples: 32
  block_size: 2048
  packed_token_cache_path: ${validation_token_cache_path}

mip:
  runs:
    ffn-candidates: false
    params-90:
      constraints:
        params: {max: 90%}
      solver:
        backend: auto
        num_solutions: 4
        min_hamming_distance: 2
        max_seconds_per_solution: 300
      homogeneous: {enabled: true, keep: 5, rank_by: objective}

post_mip:
  flows:
    candidate-evaluation:
      source:
        run: params-90
