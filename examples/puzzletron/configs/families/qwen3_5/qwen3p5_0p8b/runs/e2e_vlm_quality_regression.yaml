# @package _global_

defaults:
  - full_vlm_smoke
  - /families/qwen3_5/qwen3p5_0p8b/vlm_quality_evaluator@_global_
  - _self_

# Opt-in automated full-lifecycle regression. It is independent from the larger
# campaign but consumes the same pinned final evaluation. It records a bounded
# student-versus-teacher observation without treating smoke scores as a gate.
puzzle_dir: ${oc.env:PUZZLETRON_RUN_ROOT,puzzle_runs/qwen3p5_0p8b_e2e_vlm_quality_regression}
display_name: Qwen3p5 0.8B E2E VLM quality regression

pruning:
  eval_samples: 8

sort_sanity:
  eval_samples: 2

width_sanity:
  target_count_per_axis: 1
  layer_count: 2
  eval_samples: 2

replacement_scoring:
  eval_samples: 2

mip:
  runs:
    params-90:
      solver:
        num_solutions: 1
        min_hamming_distance: 2
        max_seconds_per_solution: 30
      homogeneous:
        keep: 5

post_mip:
  flows:
    params-90:
      nodes:
        image_eval:
          config:
            eval_samples: 2
            block_size: 512
        best_vlm_loss:
          top_k: 2
        vlm_serving:
          config:
            concurrency: [1]
            request_count: 1
            readiness_timeout: 300
            benchmark_timeout: 300
        short_vlm_kd:
          config:
            max_steps: 2
            global_batch_size: 1
            local_batch_size: 1
            checkpoint_every_steps: 2

        final_vlm_evaluation:
          type: downstream_evaluation
          input: short_vlm_kd
          failure_policy: strict
          config:
            # Two identical 100-example runs of the realized params-90 checkpoint.
            # Fresh runs report observation_delta.* metrics without gating on them.
            recorded_observation:
              repeat_count: 2
              candidate_architecture:
                parameter_pruning_percent: 10.042
                parameter_retention_percent: 89.958
                ffn_layers: 24
                teacher_intermediate_size: 3584
                student_intermediate_size: 2048
                ffn_width_pruning_percent: 42.857
              metrics:
                candidate.modelopt_vlm_benchmark_realworldqa.exact_match_flexible-extract: 0.24
                reference.modelopt_vlm_benchmark_realworldqa.exact_match_flexible-extract: 0.60
                candidate.modelopt_vlm_benchmark_mmmu_val.mmmu_acc_none: 0.25
                reference.modelopt_vlm_benchmark_mmmu_val.mmmu_acc_none: 0.35
