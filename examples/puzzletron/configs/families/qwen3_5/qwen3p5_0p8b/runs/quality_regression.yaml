# @package _global_

defaults:
  - full_smoke
  - _self_

# Opt-in fixed-contract quality regression. Unlike full_smoke, this recipe runs
# complete task datasets and compares the final distilled student with the
# pinned teacher using one identical evaluator contract. It is intentionally
# excluded from default CI because it requires a real checkpoint and GPU time.
puzzle_dir: ${oc.env:PUZZLETRON_RUN_ROOT,puzzle_runs/qwen3p5_0p8b_quality_regression}
display_name: Qwen3p5 0.8B repeatable pruning quality regression

post_mip:
  flows:
    params-90:
      nodes:
        full_benchmarks:
          type: downstream_evaluation
          input: short_kd
          failure_policy: strict
          config:
            reference_checkpoint: ${teacher_dir}
            model: vllm
            tasks: [ifeval, gsm8k]
            compatibility_tasks: [gsm8k]
            batch_size: 8
            log_samples: true
            seed: 42
            timeout_seconds: 7200
            gen_kwargs:
              do_sample: false
              temperature: 0
            topology:
              tensor_parallel_size: 1
              pipeline_parallel_size: 1
              data_parallel_size: 1
              prefill_context_parallel_size: 1
              decode_context_parallel_size: 1
              enable_expert_parallel: false
              distributed_executor_backend: mp
              gpu_group_size: 1
            model_args:
              dtype: bfloat16
              gpu_memory_utilization: 0.85
              max_model_len: 8192
              reasoning_parser: qwen3

        # Baseline deltas for the two-step smoke student are about -0.2403 on
        # IFEval and -0.4738 on GSM8K. The margins below leave modest headroom;
        # require_match makes an empty threshold result fail the DAG.
        ifeval_quality_gate:
          type: filter
          input: full_benchmarks
          mode: threshold
          metric: full_benchmarks.delta.ifeval.prompt_level_strict_acc_none
          min: -0.26
          require_match: true

        gsm8k_quality_gate:
          type: filter
          input: ifeval_quality_gate
          mode: threshold
          metric: full_benchmarks.delta.modelopt_gsm8k.exact_match_flexible-extract
          min: -0.50
          require_match: true
