# @package _global_

defaults:
  - full_smoke
  - /families/qwen3_5/qwen3p5_0p8b/quality_evaluation@_global_
  - _self_

# Opt-in deterministic quality comparison. Unlike full_smoke, this recipe runs
# a pinned subset of downstream tasks and compares the final distilled student
# with the pinned teacher using identical evaluator settings. It records the
# results without defining pass/fail thresholds; a quality-preserving pruning
# recipe must be established before these measurements can become a regression
# gate. The run is excluded from default CI because it requires a real
# checkpoint and GPU time.
puzzle_dir: ${oc.env:PUZZLETRON_RUN_ROOT,puzzle_runs/qwen3p5_0p8b_e2e_quality_comparison}
display_name: Qwen3p5 0.8B end-to-end quality comparison

# Historical evidence belongs to this checkpoint-specific regression recipe,
# not to the reusable evaluator settings or generated setup defaults. Two
# identical 100-example GPU runs produced these values. Fresh runs publish
# observation_delta.* metrics but never gate on them.
quality_evaluation:
  recorded_observation:
    repeat_count: 2
    candidate_architecture:
      parameter_pruning_percent: 10.042
      parameter_retention_percent: 89.958
      ffn_layers: 24
      teacher_intermediate_size: 3584
      student_intermediate_size: 2048
      ffn_width_pruning_percent: 42.857
    metrics:
      candidate.modelopt_ifeval.prompt_level_strict_acc_none: 0.23
      reference.modelopt_ifeval.prompt_level_strict_acc_none: 0.55
      candidate.modelopt_gsm8k.exact_match_flexible-extract: 0.01
      reference.modelopt_gsm8k.exact_match_flexible-extract: 0.45

post_mip:
  flows:
    params-90:
      nodes:
        quality_benchmarks:
          type: downstream_evaluation
          input: short_kd
          failure_policy: strict
          config: ${quality_evaluation}
