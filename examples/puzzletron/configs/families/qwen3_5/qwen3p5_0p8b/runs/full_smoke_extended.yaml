# @package _global_

defaults:
  - full_smoke
  - /families/qwen3_5/qwen3p5_0p8b/advanced@_global_
  - _self_

# Hidden-width, FFN, and depth text smoke using the shared Qwen 3.5 0.8B
# search overlay. Grouped-attention and GDN candidates remain exclusive to the
# all-axis VLM campaign.
puzzle_dir: ${oc.env:PUZZLETRON_RUN_ROOT,puzzle_runs/qwen3p5_0p8b_full_smoke_extended}
display_name: Qwen3p5 0.8B extended text smoke

pruning:
  attention_scored_axes: []
  gdn_scored_axes: []

search_space:
  axes:
    kv_groups: {enabled: false, values: []}
    q_heads_per_group: {enabled: false, values: []}
    gdn_key_groups: {enabled: false, values: []}
    gdn_value_heads_per_group: {enabled: false, values: []}
    gdn_key_head_dim: {enabled: false, values: []}
    gdn_value_head_dim: {enabled: false, values: []}
