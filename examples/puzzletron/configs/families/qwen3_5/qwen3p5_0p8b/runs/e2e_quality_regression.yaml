# @package _global_

defaults:
  - full_smoke
  - /families/qwen3_5/qwen3p5_0p8b/quality_evaluation@_global_
  - _self_

# Opt-in deterministic quality regression. Unlike full_smoke, this recipe runs
# a meaningful pinned subset of downstream tasks and compares the final
# distilled student with the pinned teacher using one identical evaluator
# configuration. It is intentionally excluded from default CI because it requires a
# real checkpoint and GPU time.
puzzle_dir: ${oc.env:PUZZLETRON_RUN_ROOT,puzzle_runs/qwen3p5_0p8b_e2e_quality_regression}
display_name: Qwen3p5 0.8B end-to-end quality regression

post_mip:
  flows:
    params-90:
      nodes:
        quality_benchmarks:
          type: downstream_evaluation
          input: short_kd
          failure_policy: strict
          config: ${quality_evaluation}

        # Baseline deltas for the two-step smoke student are -0.32 on IFEval
        # and -0.44 on GSM8K. Each margin allows three additional failures in
        # the pinned 100-example set; require_match makes an empty result fail.
        ifeval_quality_gate:
          type: filter
          input: quality_benchmarks
          mode: threshold
          metric: quality_benchmarks.delta.modelopt_ifeval.prompt_level_strict_acc_none
          min: -0.35
          require_match: true

        gsm8k_quality_gate:
          type: filter
          input: ifeval_quality_gate
          mode: threshold
          metric: quality_benchmarks.delta.modelopt_gsm8k.exact_match_flexible-extract
          min: -0.47
          require_match: true
