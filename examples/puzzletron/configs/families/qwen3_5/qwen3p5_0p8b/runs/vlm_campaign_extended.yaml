# @package _global_

defaults:
  - vlm_campaign
  - _self_

# Optional continuation of the bounded 64/128/256-step campaign. These manual
# gates deliberately remain outside the unattended reference path.
display_name: Qwen3p5 0.8B optional extended VLM pruning campaign

post_mip:
  flows:
    candidate-evaluation:
      nodes:
        approve_512:
          type: manual_filter
          input: bounded_serving
          prompt: Approve the bounded finalist for the separately budgeted 512-step extension.

        kd_512:
          type: global_kd
          input: approve_512
          failure_policy: strict
          model_source: materialized
          trajectory: retained-candidate-learning-curve
          config: &extended_kd
            seed: 1111
            validation_seed: 445
            shuffle_training_data: true
            resume: true
            max_steps: 512
            global_batch_size: 4
            local_batch_size: 1
            checkpoint_every_steps: 64
          exposure: &extended_exposure
            cumulative_steps: 512
            global_batch_size: 4
            cumulative_examples: 2048
            max_sample_length: 512
            estimated_cumulative_gpu_hours: 2.0

        short_v2_512:
          type: downstream_evaluation
          input: kd_512
          failure_policy: strict
          config: &short_v2_evaluation
            profile: qwen35_vlm_realworldqa64_mmmu120_mvbench160_frozen_rows_v3
            evaluator_revision: ${oc.env:PUZZLETRON_SOURCE_REVISION,unpublished}
            row_manifest_sha256: be7ed6f695fca19b11a90ecd4f400a95162ede7d421573a08d81b6b70be03536
            reference_checkpoint: ${teacher_dir}
            reference_once: true
            reference_cache_id: qwen35-0p8b-short-v2-teacher
            batch_size: 1
            timeout_seconds: 14400

        extended_result:
          type: result_manifest
          input: short_v2_512
          config: &extended_result
            pre_kd_source: materialized
            pre_kd_evaluation: pre_kd_short_v2
            profile: qwen35_vlm_realworldqa64_mmmu120_mvbench160_frozen_rows_v3
            row_manifest: profile:short-vllm-v2
            row_manifest_sha256: be7ed6f695fca19b11a90ecd4f400a95162ede7d421573a08d81b6b70be03536
            reference_checkpoint: ${teacher_dir}
            reference_cache_id: qwen35-0p8b-short-v2-teacher
            milestones:
              - {steps: 64, kd: kd_64, evaluation: short_v2_64}
              - {steps: 128, kd: kd_128, evaluation: short_v2_128}
              - {steps: 256, kd: kd_256, evaluation: short_v2_256}
              - {steps: 512, kd: kd_512, evaluation: short_v2_512}

        approve_1024:
          type: manual_filter
          input: extended_result
          prompt: Approve the 512-step finalist for the separately budgeted 1024-step extension.

        kd_1024:
          type: global_kd
          input: approve_1024
          failure_policy: strict
          model_source: materialized
          trajectory: retained-candidate-learning-curve
          config:
            <<: *extended_kd
            max_steps: 1024
          exposure:
            <<: *extended_exposure
            cumulative_steps: 1024
            cumulative_examples: 4096
            estimated_cumulative_gpu_hours: 4.0

        short_v2_1024:
          type: downstream_evaluation
          input: kd_1024
          failure_policy: strict
          config: *short_v2_evaluation

        final_result:
          type: result_manifest
          input: short_v2_1024
          config:
            <<: *extended_result
            milestones:
              - {steps: 64, kd: kd_64, evaluation: short_v2_64}
              - {steps: 128, kd: kd_128, evaluation: short_v2_128}
              - {steps: 256, kd: kd_256, evaluation: short_v2_256}
              - {steps: 512, kd: kd_512, evaluation: short_v2_512}
              - {steps: 1024, kd: kd_1024, evaluation: short_v2_1024}

        best:
          type: filter
          input: final_result
          mode: top_k
          metric: short_v2_1024.modelopt_vlm_benchmark_realworldqa.exact_match_flexible-extract
          direction: maximize
          top_k: 1

        extension_serving:
          type: aiperf
          input: best
          config:
            endpoint_type: chat
            input_tokens: 100
            output_tokens: 80
            image_batch_sizes: [1, 6, 12]
            image_width_mean: 1280
            image_height_mean: 720
            concurrency: [1, 4]
            request_count: 64
            warmup_request_count: 32
            repetitions: 3
            extra_inputs: {min_tokens: 80}
            use_server_token_count: true
            seed: 42
            readiness_timeout: 600
            benchmark_timeout: 1800
            topology:
              tensor_parallel_size: 1
              pipeline_parallel_size: 1
              data_parallel_size: 1
              prefill_context_parallel_size: 1
              decode_context_parallel_size: 1
              enable_expert_parallel: false
              distributed_executor_backend: mp
              gpu_group_size: 1
              server_context_overhead_tokens: 16384
              extra_vllm_args:
                - -cc.cudagraph_mode=NONE
                - --no-enable-flashinfer-autotune
                - --gpu-memory-utilization
                - "0.5"
                - --reasoning-parser
                - qwen3
                - --default-chat-template-kwargs
                - '{"enable_thinking": false}'
