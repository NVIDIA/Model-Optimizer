# @package _global_

defaults:
  - mip_vlm_smoke
  - /families/qwen3_5/qwen3p5_0p8b/advanced@_global_
  - /families/qwen3_5/qwen3p5_0p8b/vlm_quality_evaluation@_global_
  - _self_

# Immutable 24-row lifecycle smoke. The isolated attention variants keep the
# coarse KV-group and smallest query-head reductions separate. The combined
# variant exercises every reducible architecture axis at its mildest value.
puzzle_dir: ${oc.env:PUZZLETRON_RUN_ROOT,puzzle_runs/qwen3p5_0p8b_vlm_reproducibility_smoke}
display_name: Qwen3p5 0.8B reproducibility smoke

prepare_dataset:
  evaluation_tasks: [realworldqa, mmmu_val, mvbench]
  evaluation_hf_home: ${oc.env:HF_HOME}

pruning:
  eval_samples: 8
  intermediate_size_list: [3328]

sort_sanity:
  eval_samples: 2

width_sanity:
  target_count_per_axis: 1
  layer_count: 2
  eval_samples: 2

replacement_scoring:
  eval_samples: 2

mip:
  runs:
    params-90:
      constraints: {params: {min: 75%, max: 100%}}
      search_space:
        depth: [0]
        embedding: [1024]
        axes_default: teacher
        axes:
          ffn.intermediate_size: teacher
      variants:
        query-heads-only:
          constraints: {params: {min: 95%, max: 100%}}
          search_space:
            axes:
              attention.num_kv_heads: {default: teacher, layers: {19: [2]}}
              attention.q_per_group: {default: teacher, layers: {19: [3]}}
        kv-groups-only:
          constraints: {params: {min: 90%, max: 100%}}
          search_space:
            axes:
              attention.num_kv_heads: {default: teacher, layers: {19: [1]}}
              attention.q_per_group: {default: teacher, layers: {19: [4]}}
        all-reducible-axes:
          search_space:
            depth: [1]
            embedding: [960]
            axes:
              ffn.intermediate_size: {default: teacher, layers: {1: [3328]}}
              attention.num_kv_heads: {default: teacher, layers: {19: [1]}}
              attention.q_per_group: {default: teacher, layers: {19: [3]}}
              mamba.num_groups: {default: teacher, layers: {0: [14]}}
              mamba.num_heads: {default: teacher, layers: {0: [14]}}
              mamba.state_dim: {default: teacher, layers: {0: [112]}}
              mamba.head_dim: {default: teacher, layers: {0: [112]}}
      solver:
        backend: auto
        num_solutions: 1
        min_hamming_distance: 1
        max_seconds_per_solution: 60
      homogeneous: {enabled: false}

post_mip:
  flows:
    reproducibility-smoke:
      source:
        run: params-90
        variants: all
        objectives: all
      nodes:
        online_eval:
          type: evaluation
          config: {eval_samples: 2, block_size: 512}
        retain_variants:
          type: filter
          input: online_eval
          mode: top_k
          metric: online_eval.lm_loss
          direction: minimize
          top_k: 3
        materialized:
          type: materialize
          input: retain_variants
        pre_kd_smoke:
          type: downstream_evaluation
          input: materialized
          failure_policy: strict
          config: ${vlm_smoke_evaluation}
        kd_2:
          type: global_kd
          input: pre_kd_smoke
          model_source: materialized
          trajectory: reproducibility-smoke
          failure_policy: strict
          config:
            seed: 1111
            validation_seed: 445
            shuffle_training_data: true
            resume: true
            max_steps: 2
            global_batch_size: 1
            local_batch_size: 1
            checkpoint_every_steps: 2
          exposure:
            cumulative_steps: 2
            global_batch_size: 1
            cumulative_examples: 2
            max_sample_length: 512
            estimated_cumulative_gpu_hours: 0.05
        post_kd_smoke:
          type: downstream_evaluation
          input: kd_2
          failure_policy: strict
          config: ${vlm_smoke_evaluation}
        result:
          type: result_manifest
          input: post_kd_smoke
          config:
            pre_kd_source: materialized
            pre_kd_evaluation: pre_kd_smoke
            profile: ${vlm_smoke_evaluation.profile}
            row_manifest: profile:core-3_24-examples_r1-vllm
            row_manifest_sha256: ${vlm_smoke_evaluation.row_manifest_sha256}
            reference_checkpoint: ${vlm_smoke_evaluation.reference_checkpoint}
            reference_cache_id: ${vlm_smoke_evaluation.reference_cache_id}
            milestones:
              - {steps: 2, kd: kd_2, evaluation: post_kd_smoke}
        serving_mechanics:
          type: aiperf
          input: result
          config:
            endpoint_type: chat
            input_tokens: 100
            output_tokens: 80
            image_batch_sizes: [1]
            image_width_mean: 224
            image_height_mean: 224
            concurrency: [1]
            request_count: 3
            warmup_request_count: 1
            repetitions: 1
            extra_inputs: {min_tokens: 80}
            use_server_token_count: true
            seed: 42
            readiness_timeout: 600
            benchmark_timeout: 900
            topology:
              tensor_parallel_size: 1
              pipeline_parallel_size: 1
              data_parallel_size: 1
              prefill_context_parallel_size: 1
              decode_context_parallel_size: 1
              enable_expert_parallel: false
              distributed_executor_backend: mp
              gpu_group_size: 1
              server_context_overhead_tokens: 4096
              extra_vllm_args:
                - -cc.cudagraph_mode=NONE
                - --no-enable-flashinfer-autotune
                - --gpu-memory-utilization
                - "0.5"
                - --reasoning-parser
                - qwen3
                - --default-chat-template-kwargs
                - '{"enable_thinking": false}'
