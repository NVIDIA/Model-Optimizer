# @package _global_

defaults:
  - mip_vlm_smoke
  - /families/qwen3_5/qwen3p5_0p8b/advanced@_global_
  - _self_

# Bounded hidden-width, heterogeneous-FFN, and depth Qwen 3.5 0.8B VLM
# campaign. It reuses the established params-90 MIP profile and LM-loss top-k
# screening policy before serving, one resumable KD learning curve, and
# frozen-row evaluation. Attention and GDN remain at teacher geometry until the
# native runtime passes compact-scoring and slicing equivalence gates.
puzzle_dir: ${oc.env:PUZZLETRON_RUN_ROOT,puzzle_runs/qwen3p5_0p8b_vlm_campaign}
display_name: Qwen3p5 0.8B hidden-width, FFN, and depth VLM pruning campaign

pruning:
  experiment_id: qwen35_0p8b_vlm_multi_axis_campaign
  intermediate_size_list: [3328, 3072, 2816, 2432, 2048, 1664, 1408]
  eval_samples: 128
  seed: 42

sort_sanity:
  eval_samples: 16

width_sanity:
  target_count_per_axis: 2
  layer_count: 8
  eval_samples: 16

replacement_scoring:
  eval_samples: 64

mip:
  runs:
    # Conservative FFN controls calibrate exact checkpoint accounting and enter
    # a dedicated matched post-MIP learning curve. They are not claim-bearing
    # defaults. Likewise, 2816 and 2048 are exploratory search bins, not
    # justified VLM defaults.
    calibration-controls:
      search_space:
        depth: [0]
        embedding: [1024]
        axes_default: teacher
        axes: {ffn.intermediate_size: all}
      variants:
        width-3328:
          constraints:
            params: {min: 95%, max: 100%}
          search_space:
            axes: {ffn.intermediate_size: [3328]}
        width-3072:
          constraints:
            params: {min: 95%, max: 100%}
          search_space:
            axes: {ffn.intermediate_size: [3072]}
      solver:
        backend: auto
        num_solutions: 1
        min_hamming_distance: 1
        max_seconds_per_solution: 300
      homogeneous: {enabled: false}

global_distillation:
  enabled: false
  domain: vlm
  force_hf: false
  teacher_force_hf: false
  student_force_hf: false
  freeze_policy: train_all
  validation_enabled: false
  objective:
    main_ce: {weight: 1.0}
    main_kd: {weight: 1.0}
    mtp_ce: {weight: 1.0}
    mtp_kd: {weight: 1.0, chunk_size: 512}

post_mip:
  flows:
    candidate-evaluation:
      source:
        run: params-90
        variants: all
        objectives: all
      nodes:
        online_eval:
          type: evaluation
          config:
            eval_samples: 64
            block_size: 512

        best_lm:
          type: filter
          input: online_eval
          mode: top_k
          metric: online_eval.lm_loss
          direction: minimize
          top_k: 2

        materialized:
          type: materialize
          input: best_lm

        serving:
          type: aiperf
          input: materialized
          config:
            endpoint_type: chat
            input_tokens: 100
            output_tokens: 80
            image_batch_sizes: [1, 6, 12]
            image_width_mean: 1280
            image_height_mean: 720
            concurrency: [1, 4]
            request_count: 24
            extra_inputs: {min_tokens: 80}
            use_server_token_count: true
            seed: 42
            readiness_timeout: 600
            benchmark_timeout: 1800
            topology:
              tensor_parallel_size: 1
              pipeline_parallel_size: 1
              data_parallel_size: 1
              prefill_context_parallel_size: 1
              decode_context_parallel_size: 1
              enable_expert_parallel: false
              distributed_executor_backend: mp
              gpu_group_size: 1
              server_context_overhead_tokens: 16384
              extra_vllm_args:
                - -cc.cudagraph_mode=NONE
                - --no-enable-flashinfer-autotune
                - --gpu-memory-utilization
                - "0.5"
                - --reasoning-parser
                - qwen3
                - --default-chat-template-kwargs
                - '{"enable_thinking": false}'

        pre_kd_short_v1:
          type: downstream_evaluation
          input: serving
          model_source: materialized
          failure_policy: strict
          config: &short_v1_evaluation
            profile: qwen35_vlm_realworldqa64_mmmu120_mvbench160_frozen_rows_v1
            evaluator_revision: ${oc.env:PUZZLETRON_SOURCE_REVISION,unpublished}
            row_manifest: ${oc.env:PUZZLETRON_VLM_SHORT_V1_MANIFEST}
            row_manifest_sha256: ${oc.env:PUZZLETRON_VLM_SHORT_V1_SHA256}
            reference_checkpoint: ${teacher_dir}
            reference_once: true
            reference_cache_id: qwen35-0p8b-short-v1-teacher
            batch_size: 1
            timeout_seconds: 14400
            dtype: bfloat16
            gpu_memory_utilization: 0.5
            max_model_len: 65536
            limit_mm_per_prompt: {image: 32}
            topology:
              tensor_parallel_size: 1
              pipeline_parallel_size: 1
              data_parallel_size: 1
              prefill_context_parallel_size: 1
              decode_context_parallel_size: 1
              enable_expert_parallel: false
              distributed_executor_backend: mp
              gpu_group_size: 1

        kd_64:
          type: global_kd
          input: pre_kd_short_v1
          failure_policy: strict
          model_source: materialized
          trajectory: retained-candidate-learning-curve
          config: &candidate_kd
            seed: 1111
            validation_seed: 445
            shuffle_training_data: true
            resume: true
            max_steps: 64
            global_batch_size: 4
            local_batch_size: 1
            checkpoint_every_steps: 64
          exposure: &candidate_exposure_64
            cumulative_steps: 64
            global_batch_size: 4
            cumulative_examples: 256
            max_sample_length: 512
            estimated_cumulative_gpu_hours: 0.25

        short_v1_64:
          type: downstream_evaluation
          input: kd_64
          failure_policy: strict
          config:
            <<: *short_v1_evaluation

        kd_128:
          type: global_kd
          input: short_v1_64
          failure_policy: strict
          model_source: materialized
          trajectory: retained-candidate-learning-curve
          config:
            <<: *candidate_kd
            max_steps: 128
          exposure:
            <<: *candidate_exposure_64
            cumulative_steps: 128
            cumulative_examples: 512
            estimated_cumulative_gpu_hours: 0.5

        short_v1_128:
          type: downstream_evaluation
          input: kd_128
          failure_policy: strict
          config:
            <<: *short_v1_evaluation

        kd_256:
          type: global_kd
          input: short_v1_128
          failure_policy: strict
          model_source: materialized
          trajectory: retained-candidate-learning-curve
          config:
            <<: *candidate_kd
            max_steps: 256
          exposure:
            <<: *candidate_exposure_64
            cumulative_steps: 256
            cumulative_examples: 1024
            estimated_cumulative_gpu_hours: 1.0

        short_v1_256:
          type: downstream_evaluation
          input: kd_256
          failure_policy: strict
          config:
            <<: *short_v1_evaluation

        selected:
          type: manual_filter
          input: short_v1_256
          prompt: Select one 256-step finalist using the separately owned fixed 344-row interpretation.

        bounded_result:
          type: result_manifest
          input: selected
          config: &bounded_result_config
            pre_kd_source: materialized
            pre_kd_evaluation: pre_kd_short_v1
            profile: qwen35_vlm_realworldqa64_mmmu120_mvbench160_frozen_rows_v1
            row_manifest: ${oc.env:PUZZLETRON_VLM_SHORT_V1_MANIFEST}
            row_manifest_sha256: ${oc.env:PUZZLETRON_VLM_SHORT_V1_SHA256}
            reference_checkpoint: ${teacher_dir}
            reference_cache_id: qwen35-0p8b-short-v1-teacher
            milestones:
              - {steps: 64, kd: kd_64, evaluation: short_v1_64}
              - {steps: 128, kd: kd_128, evaluation: short_v1_128}
              - {steps: 256, kd: kd_256, evaluation: short_v1_256}

        approve_512:
          type: manual_filter
          input: bounded_result
          prompt: Approve the selected finalist for the separately budgeted 512-step extension.

        kd_512:
          type: global_kd
          input: approve_512
          failure_policy: strict
          model_source: materialized
          trajectory: retained-candidate-learning-curve
          config:
            <<: *candidate_kd
            max_steps: 512
          exposure:
            <<: *candidate_exposure_64
            cumulative_steps: 512
            cumulative_examples: 2048
            estimated_cumulative_gpu_hours: 2.0

        short_v1_512:
          type: downstream_evaluation
          input: kd_512
          failure_policy: strict
          config:
            <<: *short_v1_evaluation

        extended_result:
          type: result_manifest
          input: short_v1_512
          config:
            <<: *bounded_result_config
            milestones:
              - {steps: 64, kd: kd_64, evaluation: short_v1_64}
              - {steps: 128, kd: kd_128, evaluation: short_v1_128}
              - {steps: 256, kd: kd_256, evaluation: short_v1_256}
              - {steps: 512, kd: kd_512, evaluation: short_v1_512}

        approve_1024:
          type: manual_filter
          input: extended_result
          prompt: Approve the 512-step finalist for the separately budgeted 1024-step extension.

        kd_1024:
          type: global_kd
          input: approve_1024
          failure_policy: strict
          model_source: materialized
          trajectory: retained-candidate-learning-curve
          config:
            <<: *candidate_kd
            max_steps: 1024
          exposure:
            <<: *candidate_exposure_64
            cumulative_steps: 1024
            cumulative_examples: 4096
            estimated_cumulative_gpu_hours: 4.0

        short_v1_1024:
          type: downstream_evaluation
          input: kd_1024
          failure_policy: strict
          config:
            <<: *short_v1_evaluation

        final_result:
          type: result_manifest
          input: short_v1_1024
          config:
            <<: *bounded_result_config
            milestones:
              - {steps: 64, kd: kd_64, evaluation: short_v1_64}
              - {steps: 128, kd: kd_128, evaluation: short_v1_128}
              - {steps: 256, kd: kd_256, evaluation: short_v1_256}
              - {steps: 512, kd: kd_512, evaluation: short_v1_512}
              - {steps: 1024, kd: kd_1024, evaluation: short_v1_1024}

        best:
          type: filter
          input: final_result
          mode: top_k
          metric: short_v1_1024.modelopt_vlm_benchmark_realworldqa.exact_match_flexible-extract
          direction: maximize
          top_k: 1

    control-learning-curve:
      source:
        run: calibration-controls
        variants: all
        objectives: all
      nodes:
        control_materialized:
          type: materialize

        control_pre_kd_short_v1:
          type: downstream_evaluation
          input: control_materialized
          failure_policy: strict
          config:
            <<: *short_v1_evaluation

        control_kd_64:
          type: global_kd
          input: control_pre_kd_short_v1
          failure_policy: strict
          model_source: control_materialized
          trajectory: conservative-control-learning-curve
          config: &control_kd
            seed: 1111
            validation_seed: 445
            shuffle_training_data: true
            resume: true
            max_steps: 64
            global_batch_size: 4
            local_batch_size: 1
            checkpoint_every_steps: 64
          exposure: &control_exposure_64
            cumulative_steps: 64
            global_batch_size: 4
            cumulative_examples: 256
            max_sample_length: 512
            estimated_cumulative_gpu_hours: 0.25

        control_short_v1_64:
          type: downstream_evaluation
          input: control_kd_64
          failure_policy: strict
          config:
            <<: *short_v1_evaluation

        control_kd_128:
          type: global_kd
          input: control_short_v1_64
          failure_policy: strict
          model_source: control_materialized
          trajectory: conservative-control-learning-curve
          config:
            <<: *control_kd
            max_steps: 128
          exposure:
            <<: *control_exposure_64
            cumulative_steps: 128
            cumulative_examples: 512
            estimated_cumulative_gpu_hours: 0.5

        control_short_v1_128:
          type: downstream_evaluation
          input: control_kd_128
          failure_policy: strict
          config:
            <<: *short_v1_evaluation

        control_kd_256:
          type: global_kd
          input: control_short_v1_128
          failure_policy: strict
          model_source: control_materialized
          trajectory: conservative-control-learning-curve
          config:
            <<: *control_kd
            max_steps: 256
          exposure:
            <<: *control_exposure_64
            cumulative_steps: 256
            cumulative_examples: 1024
            estimated_cumulative_gpu_hours: 1.0

        control_short_v1_256:
          type: downstream_evaluation
          input: control_kd_256
          failure_policy: strict
          config:
            <<: *short_v1_evaluation

        control_result:
          type: result_manifest
          input: control_short_v1_256
          config: &control_result_config
            pre_kd_source: control_materialized
            pre_kd_evaluation: control_pre_kd_short_v1
            profile: qwen35_vlm_realworldqa64_mmmu120_mvbench160_frozen_rows_v1
            row_manifest: ${oc.env:PUZZLETRON_VLM_SHORT_V1_MANIFEST}
            row_manifest_sha256: ${oc.env:PUZZLETRON_VLM_SHORT_V1_SHA256}
            reference_checkpoint: ${teacher_dir}
            reference_cache_id: qwen35-0p8b-short-v1-teacher
            milestones:
              - {steps: 64, kd: control_kd_64, evaluation: control_short_v1_64}
              - {steps: 128, kd: control_kd_128, evaluation: control_short_v1_128}
              - {steps: 256, kd: control_kd_256, evaluation: control_short_v1_256}

        control_selected:
          type: manual_filter
          input: control_result
          prompt: Select one 256-step conservative-control finalist using the fixed 344-row curve.

        control_approve_512:
          type: manual_filter
          input: control_selected
          prompt: Approve the selected conservative-control finalist for the 512-step extension.

        control_kd_512:
          type: global_kd
          input: control_approve_512
          failure_policy: strict
          model_source: control_materialized
          trajectory: conservative-control-learning-curve
          config:
            <<: *control_kd
            max_steps: 512
          exposure:
            <<: *control_exposure_64
            cumulative_steps: 512
            cumulative_examples: 2048
            estimated_cumulative_gpu_hours: 2.0

        control_short_v1_512:
          type: downstream_evaluation
          input: control_kd_512
          failure_policy: strict
          config:
            <<: *short_v1_evaluation

        control_extended_result:
          type: result_manifest
          input: control_short_v1_512
          config:
            <<: *control_result_config
            milestones:
              - {steps: 64, kd: control_kd_64, evaluation: control_short_v1_64}
              - {steps: 128, kd: control_kd_128, evaluation: control_short_v1_128}
              - {steps: 256, kd: control_kd_256, evaluation: control_short_v1_256}
              - {steps: 512, kd: control_kd_512, evaluation: control_short_v1_512}

        control_approve_1024:
          type: manual_filter
          input: control_extended_result
          prompt: Approve the 512-step control finalist for the separately reviewed 1024-step extension.

        control_kd_1024:
          type: global_kd
          input: control_approve_1024
          failure_policy: strict
          model_source: control_materialized
          trajectory: conservative-control-learning-curve
          config:
            <<: *control_kd
            max_steps: 1024
          exposure:
            <<: *control_exposure_64
            cumulative_steps: 1024
            cumulative_examples: 4096
            estimated_cumulative_gpu_hours: 4.0

        control_short_v1_1024:
          type: downstream_evaluation
          input: control_kd_1024
          failure_policy: strict
          config:
            <<: *short_v1_evaluation

        control_final_result:
          type: result_manifest
          input: control_short_v1_1024
          config:
            <<: *control_result_config
            milestones:
              - {steps: 64, kd: control_kd_64, evaluation: control_short_v1_64}
              - {steps: 128, kd: control_kd_128, evaluation: control_short_v1_128}
              - {steps: 256, kd: control_kd_256, evaluation: control_short_v1_256}
              - {steps: 512, kd: control_kd_512, evaluation: control_short_v1_512}
              - {steps: 1024, kd: control_kd_1024, evaluation: control_short_v1_1024}

zero_shot_evaluation:
  enabled: false
aiperf:
  enabled: false
global_distillation_sanity:
  enabled: false
post_distillation_evaluation:
  enabled: false
