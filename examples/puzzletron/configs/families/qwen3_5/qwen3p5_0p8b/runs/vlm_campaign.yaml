# @package _global_

defaults:
  - mip_vlm_smoke
  - _self_

# Bounded Qwen 3.5 0.8B VLM campaign for FFN-only pruning. Both candidates
# receive the same image-text screening KD and fixed two-task evaluation
# contract. Aggregate ranking selects one candidate, which receives a second KD
# run from its materialized pre-KD checkpoint and a final teacher comparison.
puzzle_dir: ${oc.env:PUZZLETRON_RUN_ROOT,puzzle_runs/qwen3p5_0p8b_vlm_campaign}
display_name: Qwen3p5 0.8B VLM pruning campaign

pruning:
  experiment_id: qwen35_0p8b_vlm_ffn_campaign
  intermediate_size_list: [2816, 2048]
  eval_samples: 128
  seed: 42

sort_sanity:
  eval_samples: 16

width_sanity:
  target_count_per_axis: 2
  layer_count: 8
  eval_samples: 16

replacement_scoring:
  eval_samples: 64

search_space:
  axes:
    ffn_intermediate:
      enabled: true
      teacher_value: 3584
      values: [2816, 2048]

mip:
  runs:
    params-90: false
    ffn-candidates:
      search_space:
        depth: [0]
        embedding: [1024]
        axes_default: teacher
        axes: {ffn.intermediate_size: all}
      variants:
        width-2816:
          constraints:
            params: {max: 95%}
          search_space:
            axes: {ffn.intermediate_size: [2816]}
        width-2048:
          constraints:
            params: {max: 90%}
          search_space:
            axes: {ffn.intermediate_size: [2048]}
      solver:
        backend: auto
        num_solutions: 1
        min_hamming_distance: 2
        max_seconds_per_solution: 300
      homogeneous: {enabled: true, keep: 1, rank_by: objective}

global_distillation:
  enabled: false
  domain: vlm
  force_hf: false
  teacher_force_hf: false
  student_force_hf: false
  freeze_policy: train_all
  validation_enabled: false
  objective:
    main_ce: {weight: 1.0}
    main_kd: {weight: 1.0}
    mtp_ce: {weight: 1.0}
    mtp_kd: {weight: 1.0, chunk_size: 512}

post_mip:
  flows:
    candidate-evaluation:
      source:
        run: ffn-candidates
        variants: all
        objectives: all
      nodes:
        online_eval:
          type: evaluation
          config:
            eval_samples: 64
            block_size: 512

        best_lm:
          type: filter
          input: online_eval
          mode: top_k
          metric: online_eval.lm_loss
          direction: minimize
          top_k: 2

        materialized:
          type: materialize
          input: best_lm

        serving:
          type: aiperf
          input: materialized
          config:
            endpoint_type: chat
            input_tokens: 100
            output_tokens: 80
            image_batch_sizes: [1, 6, 12]
            image_width_mean: 1280
            image_height_mean: 720
            concurrency: [1, 4]
            request_count: 8
            extra_inputs: {min_tokens: 80}
            use_server_token_count: true
            seed: 42
            readiness_timeout: 600
            benchmark_timeout: 1800
            topology:
              tensor_parallel_size: 1
              pipeline_parallel_size: 1
              data_parallel_size: 1
              prefill_context_parallel_size: 1
              decode_context_parallel_size: 1
              enable_expert_parallel: false
              distributed_executor_backend: mp
              gpu_group_size: 1
              server_context_overhead_tokens: 16384
              extra_vllm_args:
                - -cc.cudagraph_mode=NONE
                - --no-enable-flashinfer-autotune
                - --gpu-memory-utilization
                - "0.5"
                - --reasoning-parser
                - qwen3
                - --default-chat-template-kwargs
                - '{"enable_thinking": false}'

        screening_kd:
          type: global_kd
          input: serving
          config:
            seed: 1111
            validation_seed: 445
            shuffle_training_data: true
            max_steps: 64
            global_batch_size: 4
            local_batch_size: 1
            checkpoint_every_steps: 32

        screening_eval:
          type: evaluation
          input: screening_kd
          config:
            eval_samples: 64
            block_size: 512

        quality_screen:
          type: downstream_evaluation
          input: screening_eval
          failure_policy: strict
          config: &bounded_vlm_evaluation
            profile: qwen35_vlm_e2e_full_eval
            batch_size: 1
            timeout_seconds: 14400
            dtype: bfloat16
            gpu_memory_utilization: 0.5
            max_model_len: 16384
            limit_mm_per_prompt: {image: 12}
            topology:
              tensor_parallel_size: 1
              pipeline_parallel_size: 1
              data_parallel_size: 1
              prefill_context_parallel_size: 1
              decode_context_parallel_size: 1
              enable_expert_parallel: false
              distributed_executor_backend: mp
              gpu_group_size: 1

        selected:
          type: filter
          input: quality_screen
          mode: aggregate_rank
          metrics:
            - metric: screening_eval.lm_loss
              direction: minimize
            - metric: quality_screen.modelopt_vlm_benchmark_realworldqa.exact_match_flexible-extract
              direction: maximize
            - metric: quality_screen.modelopt_vlm_benchmark_mmmu_val.mmmu_acc_none
              direction: maximize
          top_k: 1

        global_kd:
          type: global_kd
          input: selected
          model_source: materialized
          config:
            seed: 1111
            validation_seed: 445
            shuffle_training_data: true
            max_steps: 256
            global_batch_size: 4
            local_batch_size: 1
            checkpoint_every_steps: 32

        final_eval:
          type: evaluation
          input: global_kd
          config:
            eval_samples: 64
            block_size: 512

        quality_benchmarks:
          type: downstream_evaluation
          input: final_eval
          failure_policy: strict
          config:
            <<: *bounded_vlm_evaluation
            reference_checkpoint: ${teacher_dir}

        best:
          type: filter
          input: quality_benchmarks
          mode: top_k
          metric: final_eval.lm_loss
          direction: minimize
          top_k: 1

zero_shot_evaluation:
  enabled: false
aiperf:
  enabled: false
global_distillation_sanity:
  enabled: false
post_distillation_evaluation:
  enabled: false
