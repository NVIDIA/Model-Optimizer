# @package _global_

defaults:
  - full_vlm_smoke
  - /families/qwen3_5/qwen3p5_0p8b/vlm_quality_evaluator@_global_
  - _self_

# Qwen 3.5 0.8B VLM campaign using the same FFN-only search as the bounded
# smoke. This route raises the candidate, serving, and distillation budgets and
# applies the shared pinned final evaluation.
puzzle_dir: ${oc.env:PUZZLETRON_RUN_ROOT,puzzle_runs/qwen3p5_0p8b_vlm_campaign}
display_name: Qwen3p5 0.8B VLM pruning campaign

pruning:
  eval_samples: 128

sort_sanity:
  eval_samples: 16

width_sanity:
  target_count_per_axis: 2
  layer_count: 8
  eval_samples: 16

replacement_scoring:
  eval_samples: 64

mip:
  runs:
    params-90:
      solver:
        num_solutions: 8
        min_hamming_distance: 2
        max_seconds_per_solution: 300
      homogeneous:
        keep: 8

post_mip:
  flows:
    params-90:
      nodes:
        image_eval:
          config:
            eval_samples: 64
            block_size: 512
        best_vlm_loss:
          top_k: 4
        vlm_serving:
          config:
            concurrency: [1, 4]
            request_count: 32
            readiness_timeout: 600
            benchmark_timeout: 1800
        short_vlm_kd:
          config:
            max_steps: 256
            global_batch_size: 4
            local_batch_size: 1
            checkpoint_every_steps: 32
        final_vlm_evaluation:
          type: downstream_evaluation
          input: short_vlm_kd
          failure_policy: strict
