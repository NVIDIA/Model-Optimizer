# @package _global_

defaults:
  - mip_vlm_smoke
  - /families/qwen3_5/qwen3p5_0p8b/advanced@_global_
  - /families/qwen3_5/qwen3p5_0p8b/vlm_quality_evaluation@_global_
  - _self_

# Bounded mild all-reducible-axis Qwen 3.5 0.8B VLM
# campaign. It requests up to eight diverse params-90 MIP solutions per feasible
# width/depth scenario, retains four globally by LM-loss screening, runs matched
# resumable KD curves, frozen-row evaluation, and a serving benchmark for the
# selected bounded checkpoints. Every
# reducible axis is represented with conservative targets for this small model.
puzzle_dir: ${oc.env:PUZZLETRON_RUN_ROOT,puzzle_runs/qwen3p5_0p8b_vlm_campaign}
display_name: Qwen3p5 0.8B mild all-reducible-axis VLM pruning campaign

prepare_dataset:
  num_samples: 512

pruning:
  experiment_id: qwen35_0p8b_vlm_multi_axis_campaign
  intermediate_size_list: [3328, 3072]
  eval_samples: 128
  seed: 42

sort_sanity:
  eval_samples: 16

width_sanity:
  target_count_per_axis: 2
  layer_count: 8
  eval_samples: 16

replacement_scoring:
  eval_samples: 64

vlm_campaign_aiperf:
  endpoint_type: chat
  input_tokens: 100
  output_tokens: 80
  image_batch_sizes: [1, 6, 12]
  image_width_mean: 1280
  image_height_mean: 720
  concurrency: [1, 4]
  request_count: 64
  warmup_request_count: 32
  repetitions: 3
  extra_inputs: {min_tokens: 80}
  use_server_token_count: true
  seed: 42
  readiness_timeout: 600
  benchmark_timeout: 1800
  topology:
    tensor_parallel_size: 1
    pipeline_parallel_size: 1
    data_parallel_size: 1
    prefill_context_parallel_size: 1
    decode_context_parallel_size: 1
    enable_expert_parallel: false
    distributed_executor_backend: mp
    gpu_group_size: 1
    server_context_overhead_tokens: 16384
    extra_vllm_args:
      - -cc.cudagraph_mode=NONE
      - --no-enable-flashinfer-autotune
      - --gpu-memory-utilization
      - "0.5"
      - --reasoning-parser
      - qwen3
      - --default-chat-template-kwargs
      - '{"enable_thinking": false}'

mip:
  runs:
    params-90:
      constraints: {params: {min: 75%, max: 90%}}
      solver:
        backend: auto
        num_solutions: 8
        min_hamming_distance: 2
        max_seconds_per_solution: 300
      homogeneous: {enabled: false}
      variants:
        ranked-search: {}
        all-reducible-sentinel:
          constraints: {params: {min: 75%, max: 100%}}
          search_space:
            depth: [1]
            embedding: [960]
            axes_default: teacher
            axes:
              ffn.intermediate_size: {default: teacher, layers: {1: [3328]}}
              attention.num_kv_heads: {default: teacher, layers: {19: [1]}}
              attention.q_per_group: {default: teacher, layers: {19: [3]}}
              mamba.num_groups: {default: teacher, layers: {0: [14]}}
              mamba.num_heads: {default: teacher, layers: {0: [14]}}
              mamba.state_dim: {default: teacher, layers: {0: [112]}}
              mamba.head_dim: {default: teacher, layers: {0: [112]}}
          homogeneous: {enabled: false}
    # Conservative FFN controls calibrate exact checkpoint accounting and enter
    # a dedicated matched post-MIP learning curve. They are not claim-bearing
    # defaults.
    calibration-controls:
      search_space:
        depth: [0]
        embedding: [1024]
        axes_default: teacher
        axes: {ffn.intermediate_size: all}
      variants:
        width-3328:
          constraints:
            params: {min: 95%, max: 100%}
          search_space:
            axes: {ffn.intermediate_size: [3328]}
        width-3072:
          constraints:
            params: {min: 95%, max: 100%}
          search_space:
            axes: {ffn.intermediate_size: [3072]}
      solver:
        backend: auto
        num_solutions: 1
        min_hamming_distance: 1
        max_seconds_per_solution: 300
      homogeneous: {enabled: false}

post_mip:
  flows:
    candidate-evaluation:
      source:
        run: params-90
        variants: ranked-search
        objectives: all
      nodes:
        online_eval:
          type: evaluation
          config:
            eval_samples: 64
            block_size: 512

        best_lm:
          type: filter
          input: online_eval
          mode: top_k
          metric: online_eval.lm_loss
          direction: minimize
          top_k: 4

        materialized:
          type: materialize
          input: best_lm

        pre_kd_short_v2:
          type: downstream_evaluation
          input: materialized
          failure_policy: strict
          config: ${vlm_campaign_evaluation}

        kd_64:
          type: global_kd
          input: pre_kd_short_v2
          failure_policy: strict
          model_source: materialized
          trajectory: retained-candidate-learning-curve
          config: &candidate_kd
            seed: 1111
            validation_seed: 445
            shuffle_training_data: true
            resume: true
            max_steps: 64
            global_batch_size: 4
            local_batch_size: 1
            checkpoint_every_steps: 64
          exposure: &candidate_exposure_64
            cumulative_steps: 64
            global_batch_size: 4
            cumulative_examples: 256
            max_sample_length: 512
            estimated_cumulative_gpu_hours: 0.25

        short_v2_64:
          type: downstream_evaluation
          input: kd_64
          failure_policy: strict
          config: ${vlm_campaign_evaluation}

        kd_128:
          type: global_kd
          input: short_v2_64
          failure_policy: strict
          model_source: materialized
          trajectory: retained-candidate-learning-curve
          config:
            <<: *candidate_kd
            max_steps: 128
          exposure:
            <<: *candidate_exposure_64
            cumulative_steps: 128
            cumulative_examples: 512
            estimated_cumulative_gpu_hours: 0.5

        short_v2_128:
          type: downstream_evaluation
          input: kd_128
          failure_policy: strict
          config: ${vlm_campaign_evaluation}

        kd_256:
          type: global_kd
          input: short_v2_128
          failure_policy: strict
          model_source: materialized
          trajectory: retained-candidate-learning-curve
          config:
            <<: *candidate_kd
            max_steps: 256
          exposure:
            <<: *candidate_exposure_64
            cumulative_steps: 256
            cumulative_examples: 1024
            estimated_cumulative_gpu_hours: 1.0

        short_v2_256:
          type: downstream_evaluation
          input: kd_256
          failure_policy: strict
          config: ${vlm_campaign_evaluation}

        selected:
          type: filter
          input: short_v2_256
          mode: aggregate_rank
          metrics:
            - metric: short_v2_256.modelopt_vlm_benchmark_realworldqa.exact_match_flexible-extract
              direction: maximize
            - metric: short_v2_256.modelopt_vlm_benchmark_mmmu_val.mmmu_acc_none
              direction: maximize
          top_k: 1

        bounded_result:
          type: result_manifest
          input: selected
          config:
            pre_kd_source: materialized
            pre_kd_evaluation: pre_kd_short_v2
            profile: ${vlm_campaign_evaluation.profile}
            row_manifest: profile:core-3_344-examples_r1-vllm
            row_manifest_sha256: ${vlm_campaign_evaluation.row_manifest_sha256}
            reference_checkpoint: ${vlm_campaign_evaluation.reference_checkpoint}
            reference_cache_id: ${vlm_campaign_evaluation.reference_cache_id}
            milestones:
              - {steps: 64, kd: kd_64, evaluation: short_v2_64}
              - {steps: 128, kd: kd_128, evaluation: short_v2_128}
              - {steps: 256, kd: kd_256, evaluation: short_v2_256}

        bounded_serving:
          type: aiperf
          input: bounded_result
          config: ${vlm_campaign_aiperf}

    all-axis-sentinel:
      source:
        run: params-90
        variants: all-reducible-sentinel
        objectives: all
      nodes:
        sentinel_materialized:
          type: materialize

        sentinel_pre_kd_short_v2:
          type: downstream_evaluation
          input: sentinel_materialized
          failure_policy: strict
          config: ${vlm_campaign_evaluation}

        sentinel_kd_64:
          type: global_kd
          input: sentinel_pre_kd_short_v2
          failure_policy: strict
          model_source: sentinel_materialized
          trajectory: all-axis-sentinel-learning-curve
          config:
            <<: *candidate_kd
            max_steps: 64
          exposure: *candidate_exposure_64

        sentinel_short_v2_64:
          type: downstream_evaluation
          input: sentinel_kd_64
          failure_policy: strict
          config: ${vlm_campaign_evaluation}

        sentinel_kd_128:
          type: global_kd
          input: sentinel_short_v2_64
          failure_policy: strict
          model_source: sentinel_materialized
          trajectory: all-axis-sentinel-learning-curve
          config:
            <<: *candidate_kd
            max_steps: 128
          exposure:
            <<: *candidate_exposure_64
            cumulative_steps: 128
            cumulative_examples: 512
            estimated_cumulative_gpu_hours: 0.5

        sentinel_short_v2_128:
          type: downstream_evaluation
          input: sentinel_kd_128
          failure_policy: strict
          config: ${vlm_campaign_evaluation}

        sentinel_kd_256:
          type: global_kd
          input: sentinel_short_v2_128
          failure_policy: strict
          model_source: sentinel_materialized
          trajectory: all-axis-sentinel-learning-curve
          config:
            <<: *candidate_kd
            max_steps: 256
          exposure:
            <<: *candidate_exposure_64
            cumulative_steps: 256
            cumulative_examples: 1024
            estimated_cumulative_gpu_hours: 1.0

        sentinel_short_v2_256:
          type: downstream_evaluation
          input: sentinel_kd_256
          failure_policy: strict
          config: ${vlm_campaign_evaluation}

        sentinel_result:
          type: result_manifest
          input: sentinel_short_v2_256
          config:
            pre_kd_source: sentinel_materialized
            pre_kd_evaluation: sentinel_pre_kd_short_v2
            profile: ${vlm_campaign_evaluation.profile}
            row_manifest: profile:core-3_344-examples_r1-vllm
            row_manifest_sha256: ${vlm_campaign_evaluation.row_manifest_sha256}
            reference_checkpoint: ${vlm_campaign_evaluation.reference_checkpoint}
            reference_cache_id: ${vlm_campaign_evaluation.reference_cache_id}
            milestones:
              - {steps: 64, kd: sentinel_kd_64, evaluation: sentinel_short_v2_64}
              - {steps: 128, kd: sentinel_kd_128, evaluation: sentinel_short_v2_128}
              - {steps: 256, kd: sentinel_kd_256, evaluation: sentinel_short_v2_256}

        sentinel_serving:
          type: aiperf
          input: sentinel_result
          config: ${vlm_campaign_aiperf}

    control-learning-curve:
      source:
        run: calibration-controls
        variants: all
        objectives: all
      nodes:
        control_materialized:
          type: materialize

        control_pre_kd_short_v2:
          type: downstream_evaluation
          input: control_materialized
          failure_policy: strict
          config: ${vlm_campaign_evaluation}

        control_kd_64:
          type: global_kd
          input: control_pre_kd_short_v2
          failure_policy: strict
          model_source: control_materialized
          trajectory: conservative-control-learning-curve
          config: &control_kd
            seed: 1111
            validation_seed: 445
            shuffle_training_data: true
            resume: true
            max_steps: 64
            global_batch_size: 4
            local_batch_size: 1
            checkpoint_every_steps: 64
          exposure: &control_exposure_64
            cumulative_steps: 64
            global_batch_size: 4
            cumulative_examples: 256
            max_sample_length: 512
            estimated_cumulative_gpu_hours: 0.25

        control_short_v2_64:
          type: downstream_evaluation
          input: control_kd_64
          failure_policy: strict
          config: ${vlm_campaign_evaluation}

        control_kd_128:
          type: global_kd
          input: control_short_v2_64
          failure_policy: strict
          model_source: control_materialized
          trajectory: conservative-control-learning-curve
          config:
            <<: *control_kd
            max_steps: 128
          exposure:
            <<: *control_exposure_64
            cumulative_steps: 128
            cumulative_examples: 512
            estimated_cumulative_gpu_hours: 0.5

        control_short_v2_128:
          type: downstream_evaluation
          input: control_kd_128
          failure_policy: strict
          config: ${vlm_campaign_evaluation}

        control_kd_256:
          type: global_kd
          input: control_short_v2_128
          failure_policy: strict
          model_source: control_materialized
          trajectory: conservative-control-learning-curve
          config:
            <<: *control_kd
            max_steps: 256
          exposure:
            <<: *control_exposure_64
            cumulative_steps: 256
            cumulative_examples: 1024
            estimated_cumulative_gpu_hours: 1.0

        control_short_v2_256:
          type: downstream_evaluation
          input: control_kd_256
          failure_policy: strict
          config: ${vlm_campaign_evaluation}

        control_result:
          type: result_manifest
          input: control_short_v2_256
          config:
            pre_kd_source: control_materialized
            pre_kd_evaluation: control_pre_kd_short_v2
            profile: ${vlm_campaign_evaluation.profile}
            row_manifest: profile:core-3_344-examples_r1-vllm
            row_manifest_sha256: ${vlm_campaign_evaluation.row_manifest_sha256}
            reference_checkpoint: ${vlm_campaign_evaluation.reference_checkpoint}
            reference_cache_id: ${vlm_campaign_evaluation.reference_cache_id}
            milestones:
              - {steps: 64, kd: control_kd_64, evaluation: control_short_v2_64}
              - {steps: 128, kd: control_kd_128, evaluation: control_short_v2_128}
              - {steps: 256, kd: control_kd_256, evaluation: control_short_v2_256}
