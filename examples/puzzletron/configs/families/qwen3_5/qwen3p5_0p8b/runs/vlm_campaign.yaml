# @package _global_

defaults:
  - /families/qwen3_5/qwen3p5_0p8b/vlm_base@_global_
  - /families/qwen3_5/qwen3p5_0p8b/vlm_quality_evaluation@_global_
  - _self_

# Illustrative multi-axis campaign. The search, evaluation, KD, and selection
# budgets are example choices rather than recommended defaults.
puzzle_dir: ${oc.env:PUZZLETRON_RUN_ROOT,puzzle_runs/qwen3p5_0p8b_vlm_campaign}
display_name: Qwen3p5 0.8B multi-axis VLM pruning campaign

model:
  # Compact grouped attention is qualified for the single-device SDPA path.
  automodel_backend: {attn: sdpa}

prepare_dataset:
  num_samples: 512

embedding_pruning:
  widths: [1024, 960, 896]
  alignment: 64

pruning:
  experiment_id: qwen35_0p8b_vlm_multi_axis_campaign
  intermediate_size_list: [3328, 3072]
  attn_heads_list: [[8, 2], [6, 2], [4, 1], [3, 1]]
  attention_scored_axes: [kv_groups, q_heads_per_group]
  gdn_scored_axes: [gdn_key_groups, gdn_key_head_dim, gdn_value_head_dim]
  eval_samples: 128
  seed: 42

sort:
  deferred_axes: []

vllm_stats:
  model_hidden_sizes: [1024, 960, 896]

sort_sanity:
  eval_samples: 16

width_sanity:
  hidden_width_diagnostic: true
  axes: [hidden_width, ffn_intermediate]
  target_count_per_axis: 2
  layer_count: 8
  eval_samples: 16

depth_importance:
  enabled: true
  max_removals: 2
  max_subblocks_to_remove: 2

replacement_scoring:
  eval_samples: 64

search_space:
  axes:
    hidden_width: {enabled: true, teacher_value: 1024, values: [960, 896]}
    kv_groups: {enabled: true, teacher_value: 2, values: [1]}
    q_heads_per_group: {enabled: true, teacher_value: 4, values: [3]}
    ffn_intermediate: {enabled: true, teacher_value: 3584, values: [3328, 3072]}
    gdn_key_groups: {enabled: true, teacher_value: 16, values: [14]}
    gdn_value_heads_per_group: {enabled: false, teacher_value: 1, values: []}
    gdn_key_head_dim: {enabled: true, teacher_value: 128, values: [112]}
    gdn_value_head_dim: {enabled: true, teacher_value: 128, values: [112]}

vlm_campaign_aiperf:
  endpoint_type: chat
  input_tokens: 100
  output_tokens: 80
  image_batch_sizes: [1, 6, 12]
  image_width_mean: 1280
  image_height_mean: 720
  concurrency: [1, 4]
  request_count: 64
  warmup_request_count: 32
  repetitions: 3
  extra_inputs: {min_tokens: 80}
  use_server_token_count: true
  seed: 42
  readiness_timeout: 600
  benchmark_timeout: 1800
  topology:
    tensor_parallel_size: 1
    pipeline_parallel_size: 1
    data_parallel_size: 1
    prefill_context_parallel_size: 1
    decode_context_parallel_size: 1
    enable_expert_parallel: false
    distributed_executor_backend: mp
    gpu_group_size: 1
    server_context_overhead_tokens: 16384
    extra_vllm_args:
      - -cc.cudagraph_mode=NONE
      - --no-enable-flashinfer-autotune
      - --gpu-memory-utilization
      - "0.5"
      - --reasoning-parser
      - qwen3
      - --default-chat-template-kwargs
      - '{"enable_thinking": false}'

mip:
  depth_scenario_count: 3
  runs:
    params-90:
      constraints: {params: {min: 75%, max: 90%}}
      search_space:
        depth: [0, 1, 2]
        embedding: [1024, 960, 896]
        axes_default: all
        axes: {ffn.intermediate_size: all}
      solver:
        backend: auto
        num_solutions: 8
        min_hamming_distance: 2
        max_seconds_per_solution: 300
      homogeneous: {enabled: false}
post_mip:
  flows:
    candidates:
      source: {run: params-90, variants: all, objectives: all}
      nodes:
        image_eval:
          type: evaluation
          config: {eval_samples: 64, block_size: 512}
        best_image_loss:
          type: filter
          input: image_eval
          mode: top_k
          metric: image_eval.lm_loss
          direction: minimize
          top_k: 4
        materialized:
          type: materialize
          input: best_image_loss
        pre_kd_eval:
          type: downstream_evaluation
          input: materialized
          failure_policy: strict
          config: ${vlm_campaign_evaluation}
        kd:
          type: global_kd
          input: pre_kd_eval
          failure_policy: strict
          model_source: materialized
          config:
            seed: 1111
            validation_seed: 445
            shuffle_training_data: true
            resume: true
            max_steps: 128
            global_batch_size: 4
            local_batch_size: 1
            checkpoint_every_steps: 128
          exposure:
            cumulative_steps: 128
            global_batch_size: 4
            cumulative_examples: 512
            max_sample_length: 512
            estimated_cumulative_gpu_hours: 0.5
        post_kd_eval:
          type: downstream_evaluation
          input: kd
          failure_policy: strict
          config: ${vlm_campaign_evaluation}
        selected:
          type: filter
          input: post_kd_eval
          mode: aggregate_rank
          metrics:
            - metric: post_kd_eval.modelopt_vlm_benchmark_realworldqa.exact_match_flexible-extract
              direction: maximize
            - metric: post_kd_eval.modelopt_vlm_benchmark_mmmu_val.mmmu_acc_none
              direction: maximize
          top_k: 1
        result:
          type: result_manifest
          input: selected
          config:
            pre_kd_source: materialized
            pre_kd_evaluation: pre_kd_eval
            profile: ${vlm_campaign_evaluation.profile}
            row_manifest: profile:core-3_344-examples_r1-vllm
            row_manifest_sha256: ${vlm_campaign_evaluation.row_manifest_sha256}
            reference_checkpoint: ${vlm_campaign_evaluation.reference_checkpoint}
            reference_cache_id: ${vlm_campaign_evaluation.reference_cache_id}
            milestones: [{steps: 128, kd: kd, evaluation: post_kd_eval}]
        serving:
          type: aiperf
          input: result
          config: ${vlm_campaign_aiperf}
