# @package _global_

# Reproducible single-run text evaluation. The screen uses the same pinned
# task revisions, deterministic prefix, decoding settings, and seed for every
# student and the teacher. Only the selected student, plus the reference
# teacher, receive the full unbounded run.
quality_evaluation_common: &quality_evaluation_common
  reference_checkpoint: ${teacher_dir}
  model: vllm
  tasks: [ifeval, gsm8k, mmlu_pro_computer_science, mmlu_pro_history]
  compatibility_tasks: [ifeval, gsm8k, mmlu_pro_computer_science, mmlu_pro_history]
  task_dataset_revisions:
    ifeval: 5a5661c2a35488308556cf4453dc074d1eba91a0
    gsm8k: 740312add88f781978c0658806c59bc2815b9866
    mmlu_pro_computer_science: b189ec765aa7ed75c8acfea42df31fdae71f97be
    mmlu_pro_history: b189ec765aa7ed75c8acfea42df31fdae71f97be
  batch_size: 8
  num_fewshot: 0
  log_samples: true
  seed: 42
  timeout_seconds: 7200
  gen_kwargs:
    do_sample: false
    temperature: 0
  topology:
    tensor_parallel_size: 1
    pipeline_parallel_size: 1
    data_parallel_size: 1
    prefill_context_parallel_size: 1
    decode_context_parallel_size: 1
    enable_expert_parallel: false
    distributed_executor_backend: mp
    gpu_group_size: 1
  model_args:
    dtype: bfloat16
    gpu_memory_utilization: 0.85
    max_model_len: 8192
    reasoning_parser: qwen3

# A 256-example fixed prefix per task is large enough to reject clear
# regressions while keeping the all-candidate screen practical.
quality_evaluation:
  <<: *quality_evaluation_common
  limit: 256

# Omitting the limit runs each complete benchmark for the final student and
# teacher with exactly the same evaluator contract used by the screen.
quality_evaluation_full:
  <<: *quality_evaluation_common
  limit:
