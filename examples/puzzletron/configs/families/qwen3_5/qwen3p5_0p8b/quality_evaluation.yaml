# @package _global_

# Bounded student-versus-teacher evaluation shared by the campaign example and
# the opt-in comparison.
quality_evaluation:
  reference_checkpoint: ${teacher_dir}
  model: vllm
  tasks: [ifeval, gsm8k]
  compatibility_tasks: [gsm8k]
  task_dataset_revisions:
    ifeval: 5a5661c2a35488308556cf4453dc074d1eba91a0
    gsm8k: 740312add88f781978c0658806c59bc2815b9866
  limit: 100
  batch_size: 8
  log_samples: true
  seed: 42
  timeout_seconds: 7200
  gen_kwargs:
    do_sample: false
    temperature: 0
  topology:
    tensor_parallel_size: 1
    pipeline_parallel_size: 1
    data_parallel_size: 1
    prefill_context_parallel_size: 1
    decode_context_parallel_size: 1
    enable_expert_parallel: false
    distributed_executor_backend: mp
    gpu_group_size: 1
  model_args:
    dtype: bfloat16
    gpu_memory_utilization: 0.85
    max_model_len: 8192
    reasoning_parser: qwen3
