# @package _global_

defaults:
  - /families/qwen3_5/qwen3p5_0p8b/model@_global_
  - _self_

# Opt-in search overlay for the additional Qwen 3.5 0.8B architecture axes.
# Run the extended smoke and verify measurement and checkpoint slicing for the
# target checkpoint before allocating full campaign budgets.
model:
  # Native compact grouped attention is qualified only for the single-device
  # SDPA implementation. Transformer Engine captures teacher head geometry.
  automodel_backend: {attn: sdpa}

embedding_pruning:
  widths: [1024, 960, 896]
  alignment: 64

pruning:
  # The 0.8B search deliberately stays near the teacher. More aggressive
  # historical bins remain valid diagnostics, but are not campaign defaults.
  intermediate_size_list: [3328, 3072]
  # [query heads, KV groups]: teacher, query-head-only, KV-group-only. KV
  # groups have no mild nonteacher value because the teacher has only two.
  attn_heads_list: [[8, 2], [6, 2], [4, 1], [3, 1]]
  attention_scored_axes: [kv_groups, q_heads_per_group]
  # Value heads/group is already one and therefore irreducible. The other GDN
  # axes use their smallest practical aligned decrements.
  gdn_scored_axes: [gdn_key_groups, gdn_key_head_dim, gdn_value_head_dim]

sort:
  deferred_axes: []

# Parameter accounting must inventory every hidden-width scenario before the
# root aggregate is projected into scenario-local replacement libraries.
vllm_stats:
  model_hidden_sizes: [1024, 960, 896]

width_sanity:
  hidden_width_diagnostic: true
  axes:
    - hidden_width
    - ffn_intermediate

depth_importance:
  enabled: true
  max_removals: 2
  max_subblocks_to_remove: 2

search_space:
  axes:
    hidden_width:
      enabled: true
      teacher_value: 1024
      values: [960, 896]
    kv_groups:
      enabled: true
      teacher_value: 2
      values: [1]
    q_heads_per_group:
      enabled: true
      teacher_value: 4
      values: [3]
    ffn_intermediate:
      enabled: true
      teacher_value: 3584
      values: [3328, 3072]
    gdn_key_groups:
      enabled: true
      teacher_value: 16
      values: [14]
    gdn_value_heads_per_group:
      enabled: false
      teacher_value: 1
      values: []
    gdn_key_head_dim:
      enabled: true
      teacher_value: 128
      values: [112]
    gdn_value_head_dim:
      enabled: true
      teacher_value: 128
      values: [112]

mip:
  depth_scenario_count: 3
  runs:
    params-90:
      search_space:
        depth: [0, 1, 2]
        embedding: [1024, 960, 896]
        axes_default: all
        axes:
          ffn.intermediate_size: all
