schema_version: 2

profiles:
  smoke:
    pruning:
      depth_remove: 1
      depth_importance_samples: 32
      width_importance_samples: 512
      sort_sanity: false
      width_sanity: false
      slicing_sanity: false
      replacement_samples: 32
      bypass:
        enabled: false
        samples: 64
    mip:
      goal_value: 90%
      num_solutions: 2

  balanced:
    pruning:
      depth_remove: 4
      depth_importance_samples: 128
      width_importance_samples: 32768
      sort_sanity: false
      width_sanity: false
      slicing_sanity: false
      replacement_samples: 128
      bypass:
        enabled: true
        samples: 4096
    mip:
      goal_value: 75%
      num_solutions: 8

  high-confidence:
    pruning:
      depth_remove: 6
      depth_importance_samples: 512
      width_importance_samples: 65536
      sort_sanity: true
      sort_sanity_samples: 512
      width_sanity: true
      width_sanity_samples: 512
      slicing_sanity: true
      replacement_samples: 512
      bypass:
        enabled: true
        samples: 8192
    mip:
      goal_value: 70%
      num_solutions: 16

# Model-specific values are seeded from historical campaign configurations.
# Unspecified fields continue to inherit the family profile above.
model_overrides:
  qwen3p5_0p8b:
    match:
      num_layers: 24
      facts:
        hidden_size: 1024
        intermediate_size: 3584
        num_attention_heads: 8
        num_key_value_heads: 2
    defaults:
      pruning:
        # The maintained 0.8B examples exercise FFN width. Other descriptor-
        # supported axes remain available when the wizard is customized.
        depth_remove: 0
        axes:
          hidden_width:
            values: [1024]
          kv_groups:
            values: [2]
          q_heads_per_group:
            values: [4]
          ffn_intermediate:
            values: [3584, 3072, 2048]
          gdn_key_groups:
            values: [16]
          gdn_value_heads_per_group:
            values: [1]
          gdn_key_head_dim:
            values: [128]
          gdn_value_head_dim:
            values: [128]
        bypass:
          enabled: false
      post_mip:
        quality_comparison:
          by_modality:
            text:
              enabled: true
              reference_checkpoint: ${teacher_dir}
              model: vllm
              tasks: [ifeval, gsm8k, mmlu_pro_computer_science, mmlu_pro_history]
              compatibility_tasks: [ifeval, gsm8k, mmlu_pro_computer_science, mmlu_pro_history]
              task_dataset_revisions:
                ifeval: 5a5661c2a35488308556cf4453dc074d1eba91a0
                gsm8k: 740312add88f781978c0658806c59bc2815b9866
                mmlu_pro_computer_science: b189ec765aa7ed75c8acfea42df31fdae71f97be
                mmlu_pro_history: b189ec765aa7ed75c8acfea42df31fdae71f97be
              limit: 256
              batch_size: 8
              num_fewshot: 0
              log_samples: true
              seed: 42
              timeout_seconds: 7200
              gen_kwargs:
                do_sample: false
                temperature: 0
              topology:
                tensor_parallel_size: 1
                pipeline_parallel_size: 1
                data_parallel_size: 1
                prefill_context_parallel_size: 1
                decode_context_parallel_size: 1
                enable_expert_parallel: false
                distributed_executor_backend: mp
                gpu_group_size: 1
              model_args:
                dtype: bfloat16
                gpu_memory_utilization: 0.85
                max_model_len: 8192
                reasoning_parser: qwen3
            multimodal:
              enabled: true
              profile: qwen35_vlm_e2e_full_eval
              reference_checkpoint: ${teacher_dir}
              batch_size: 1
              timeout_seconds: 14400
              dtype: bfloat16
              gpu_memory_utilization: 0.5
              max_model_len: 16384
              limit_mm_per_prompt: {image: 12}
              topology:
                tensor_parallel_size: 1
                pipeline_parallel_size: 1
                data_parallel_size: 1
                prefill_context_parallel_size: 1
                decode_context_parallel_size: 1
                enable_expert_parallel: false
                distributed_executor_backend: mp
                gpu_group_size: 1
    profiles:
      smoke:
        pruning:
          width_importance_samples: 8
          replacement_samples: 4
        stages:
          replacement_scoring:
            instances: 1
        mip:
          goal_value: 90%

  qwen3p5_9b:
    match:
      num_layers: 32
      facts:
        hidden_size: 4096
        intermediate_size: 12288
        num_attention_heads: 16
        num_key_value_heads: 4
    profiles:
      high-confidence:
        pruning:
          depth_importance_samples: 128
          replacement_samples: 128
          bypass:
            enabled: false
        mip:
          goal_value: 75%

  qwen3p6_27b:
    match:
      num_layers: 64
      facts:
        hidden_size: 5120
        intermediate_size: 17408
        num_attention_heads: 24
        num_key_value_heads: 4
    profiles:
