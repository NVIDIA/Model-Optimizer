# @package _global_

defaults:
  - mip_vlm_smoke
  - _self_

# Opt-in continuation of the FFN smoke through physical materialization,
# checkpoint reload, bounded RealWorldQA evaluation, and two-step VLM KD.
puzzle_dir: ${oc.env:PUZZLETRON_RUN_ROOT}
data:
  # Tested public snapshot; callers may override with another immutable SHA.
  revision: ${oc.env:PUZZLETRON_DATASET_REVISION,51f4f4d219315c3283950994d4eb3d7fc30aa87b}

global_distillation:
  domain: vlm
  automodel:
    activation_checkpointing: true
  force_hf: false
  teacher_force_hf: false
  student_force_hf: false
  freeze_policy: vision_frozen
  validation_enabled: false
  objective: &memory_safe_kd_objective
    main_ce: {weight: 1.0}
    main_kd: {weight: 1.0, chunk_size: 64}
    mtp_ce: {weight: 1.0}
    mtp_kd: {weight: 1.0, chunk_size: 64}

post_mip:
  flows:
    params-80:
      source:
        run: params-80
        variants: all
        objectives: all
      nodes:
        image_eval:
          type: evaluation
          config: {eval_samples: 2, block_size: 512}
        best_vlm_loss:
          type: filter
          input: image_eval
          mode: top_k
          metric: image_eval.lm_loss
          direction: minimize
          top_k: 1
        materialized:
          type: materialize
          input: best_vlm_loss
        checkpoint_eval:
          type: downstream_evaluation
          input: materialized
          failure_policy: strict
          config: &bounded_realworldqa
            profile: qwen35_vlm_realworldqa
            batch_size: 1
            timeout_seconds: 900
            dtype: bfloat16
            gpu_memory_utilization: 0.8
            max_model_len: 4096
            limit_mm_per_prompt: {image: 1}
            topology:
              tensor_parallel_size: 1
              pipeline_parallel_size: 1
              data_parallel_size: 1
              prefill_context_parallel_size: 1
              decode_context_parallel_size: 1
              enable_expert_parallel: false
              distributed_executor_backend: mp
              gpu_group_size: 1
        short_vlm_kd:
          type: global_kd
          input: checkpoint_eval
          config:
            freeze_policy: vision_frozen
            activation_checkpointing: true
            # A complete 4B teacher/student pair exceeds one 80 GB GPU on
            # multimodal samples. This matches the campaign's validated TP2
            # memory-safe KD recipe.
            automodel:
              parallel:
                tp: 2
                cp: 1
                pp: 1
                ep: 1
                dp_shard: 1
                dp_replicate: 1
                sequence_parallel: false
                pipeline_schedule: 1f1b
            objective: *memory_safe_kd_objective
            max_steps: 2
            global_batch_size: 1
            local_batch_size: 1
            checkpoint_every_steps: 2
        post_kd_checkpoint_eval:
          type: downstream_evaluation
          input: short_vlm_kd
          failure_policy: strict
          config: *bounded_realworldqa
        final_image_eval:
          type: evaluation
          input: post_kd_checkpoint_eval
          config: {eval_samples: 2, block_size: 512}
        best:
          type: filter
          input: final_image_eval
          mode: top_k
          metric: final_image_eval.lm_loss
          direction: minimize
          top_k: 1
