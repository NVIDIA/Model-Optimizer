# @package _global_

defaults:
  - /families/qwen3_5/qwen3p5_4b/all_axis_base@_global_
  - /families/qwen3_5/qwen3p5_4b/vlm_quality_evaluation@_global_
  - _self_

# Complete bounded all-axis lifecycle through physical materialization,
# checkpoint reload, frozen image-text evaluation, multimodal serving, and
# two-step VLM KD.
puzzle_dir: ${oc.env:PUZZLETRON_RUN_ROOT}
display_name: Qwen3p5 4B VLM all-axis lifecycle smoke

data:
  # Tested public snapshot; callers may override with another immutable SHA.
  revision: ${oc.env:PUZZLETRON_DATASET_REVISION,51f4f4d219315c3283950994d4eb3d7fc30aa87b}

global_distillation:
  domain: vlm
  automodel:
    activation_checkpointing: true
  force_hf: false
  teacher_force_hf: false
  student_force_hf: false
  freeze_policy: vision_frozen
  validation_enabled: false
  objective: &memory_safe_kd_objective
    main_ce: {weight: 1.0}
    main_kd: {weight: 1.0, chunk_size: 64}
    mtp_ce: {weight: 1.0}
    mtp_kd: {weight: 1.0, chunk_size: 64}

mip:
  runs:
    params-80:
      constraints:
        params: {max: 92%}
      solver:
        backend: pulp
        num_solutions: 1
        min_hamming_distance: 1
        max_seconds_per_solution: 30
      homogeneous: {enabled: false}
    memory-85: false

post_mip:
  flows:
    params-80:
      source:
        run: params-80
        variants: all
        objectives: all
      nodes:
        image_eval:
          type: evaluation
          config: {eval_samples: 2, block_size: 512}
        best_vlm_loss:
          type: filter
          input: image_eval
          mode: top_k
          metric: image_eval.lm_loss
          direction: minimize
          top_k: 1
        materialized:
          type: materialize
          input: best_vlm_loss
          failure_policy: strict
        checkpoint_eval:
          type: downstream_evaluation
          input: materialized
          failure_policy: strict
          config: ${vlm_4b_smoke_evaluation}
        serving_smoke:
          type: aiperf
          input: checkpoint_eval
          failure_policy: strict
          config: &serving_smoke_config
            endpoint_type: chat
            input_tokens: 32
            output_tokens: 8
            image_batch_sizes: [1]
            image_width_mean: 224
            image_height_mean: 224
            concurrency: [1]
            request_count: 1
            extra_inputs: {min_tokens: 8}
            use_server_token_count: true
            allow_aiperf_v011_online_tokenizer_resolution: true
            seed: 42
            readiness_timeout: 600
            benchmark_timeout: 600
            topology:
              tensor_parallel_size: 1
              pipeline_parallel_size: 1
              data_parallel_size: 1
              prefill_context_parallel_size: 1
              decode_context_parallel_size: 1
              enable_expert_parallel: false
              distributed_executor_backend: mp
              gpu_group_size: 1
              server_context_overhead_tokens: 2048
              extra_vllm_args:
                - -cc.cudagraph_mode=NONE
                - --no-enable-flashinfer-autotune
                - --gdn-prefill-backend
                - triton
                - --gpu-memory-utilization
                - "0.7"
                - --reasoning-parser
                - qwen3
                - --default-chat-template-kwargs
                - '{"enable_thinking": false}'
        short_vlm_kd:
          type: global_kd
          input: serving_smoke
          failure_policy: strict
          config:
            freeze_policy: vision_frozen
            activation_checkpointing: true
            automodel:
              parallel:
                tp: 2
                cp: 1
                pp: 1
                ep: 1
                dp_shard: 1
                dp_replicate: 1
                sequence_parallel: false
                pipeline_schedule: 1f1b
            objective: *memory_safe_kd_objective
            max_steps: 2
            global_batch_size: 1
            local_batch_size: 1
            checkpoint_every_steps: 2
          exposure:
            cumulative_steps: 2
            global_batch_size: 1
            cumulative_examples: 2
            max_sample_length: 512
            estimated_cumulative_gpu_hours: 0.2
        post_kd_checkpoint_eval:
          type: downstream_evaluation
          input: short_vlm_kd
          failure_policy: strict
          config: ${vlm_4b_smoke_evaluation}
        result:
          type: result_manifest
          input: post_kd_checkpoint_eval
          config:
            pre_kd_source: materialized
            pre_kd_evaluation: checkpoint_eval
            profile: ${vlm_4b_smoke_evaluation.profile}
            row_manifest: profile:core-3_24-examples_r1-vllm
            row_manifest_sha256: ${vlm_4b_smoke_evaluation.row_manifest_sha256}
            reference_checkpoint: ${vlm_4b_smoke_evaluation.reference_checkpoint}
            reference_cache_id: ${vlm_4b_smoke_evaluation.reference_cache_id}
            milestones:
              - {steps: 2, kd: short_vlm_kd, evaluation: post_kd_checkpoint_eval}
        final_serving_smoke:
          type: aiperf
          input: result
          failure_policy: strict
          config: *serving_smoke_config
        final_image_eval:
          type: evaluation
          input: final_serving_smoke
          config: {eval_samples: 2, block_size: 512}
        best:
          type: filter
          input: final_image_eval
          mode: top_k
          metric: final_image_eval.lm_loss
          direction: minimize
          top_k: 1
