# @package _global_

display_name: Qwen/Qwen3.6-35B-A3B
# Runnable public Hugging Face repository ID; this is not a placeholder.
# Setup-generated bundles replace it with the model source selected by the user.
input_hf_model_path: Qwen/Qwen3.6-35B-A3B
# Required by depth RPC / scoring stages; unlike dense Qwen configs this is not
# inherited from a family-level descriptor key.
descriptor: qwen3_5_moe

model_info:
  # Canonical public identity used for model metadata and revision checks.
  hf_repo: Qwen/Qwen3.6-35B-A3B
  hf_revision: 995ad96eacd98c81ed38be0c5b274b04031597b0
  model_type: qwen3_5_moe
  architectures: [Qwen3_5MoeForConditionalGeneration]
  num_hidden_layers: 40
  hidden_size: 2048
  num_attention_heads: 16
  num_key_value_heads: 2
  head_dim: 256
  vocab_size: 248320
  tie_word_embeddings: false
  mtp_num_hidden_layers: 1
  layer_counts:
    linear_attention: 30
    full_attention: 10
  mamba:
    linear_key_head_dim: 128
    linear_num_key_heads: 16
    linear_num_value_heads: 32
    linear_value_head_dim: 128
    linear_conv_kernel_dim: 4
  moe:
    num_experts: 256
    moe_intermediate_size: 512
    shared_expert_intermediate_size: 512
    num_experts_per_tok: 8

pruning:
  attn_heads_list:
    - [16, 2]
    - [8, 1]

search_space:
  axes:
    # Inherited from dense qwen3p5_9b via Hydra merge; MoE has no dense FFN axis.
    ffn_intermediate: {enabled: false}
    hidden_width: {enabled: true, teacher_value: 2048, values: [1920]}
    kv_groups: {enabled: true, teacher_value: 2, values: [1]}
    q_heads_per_group: {enabled: true, teacher_value: 8, values: [4]}
    gdn_key_groups: {enabled: true, teacher_value: 16, values: [8]}
    gdn_value_heads_per_group: {enabled: true, teacher_value: 2, values: [1]}
    gdn_key_head_dim: {enabled: true, teacher_value: 128, values: [64]}
    gdn_value_head_dim: {enabled: true, teacher_value: 128, values: [64]}
    moe_experts: {enabled: true, teacher_value: 256, values: [128]}
    moe_expert_intermediate: {enabled: true, teacher_value: 512, values: [256]}
    moe_shared_expert_intermediate: {enabled: true, teacher_value: 512, values: [256]}
    moe_top_k: {enabled: true, teacher_value: 8, values: [4]}
