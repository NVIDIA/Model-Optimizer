# @package _global_

# Immutable public identity for the checkpoint used by the legacy
# llama-3_1-8B_pruneffn_memory example.
input_hf_model_path: meta-llama/Llama-3.1-8B-Instruct

model_info:
  hf_repo: meta-llama/Llama-3.1-8B-Instruct
  hf_revision: 0e9e39f249a16976918f6564b8830bc894c89659
  model_type: llama
  architectures: [LlamaForCausalLM]
  num_hidden_layers: 32
  layer_counts:
    decoder: 32
  hidden_size: 4096
  intermediate_size: 14336
  num_attention_heads: 32
  num_key_value_heads: 8
  head_dim: 128
  vocab_size: 128256
  tie_word_embeddings: false
  max_position_embeddings: 131072

model:
  revision: ${model_info.hf_revision}

# The teacher entry is supplied automatically by the virtual replacement
# library. These are the four reduced widths from the legacy example.
pruning:
  intermediate_size_list: [3072, 5888, 8704, 11520]

search_space:
  axes:
    ffn_intermediate:
      enabled: true
      teacher_value: 14336
      values: [3072, 5888, 8704, 11520]
