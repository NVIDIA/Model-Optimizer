step_scheduler:
  global_batch_size: 256
  local_batch_size: 16
  max_steps: 1

dist_env:
  backend: nccl
  timeout_minutes: 120

model:
  torch_dtype: bf16
  trust_remote_code: true

checkpoint:
  enabled: false

distributed:
  dp_size: 16
  tp_size: 1
  cp_size: 2
  ep_size: 1
  pp_size: 1
  sequence_parallel: true

distributed_config:
  _target_: nemo_automodel.components.distributed.config.FSDP2Config
  activation_checkpointing: true

packed_sequence:
  packed_sequence_size: 0

dataset:
  _target_: modelopt.torch.puzzletron.plugins.automodel.dummy_data.make_dummy_dataset
  num_samples: 128
  seq_length: 16384

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  shuffle: false
  collate_fn: nemo_automodel.components.datasets.utils.default_collater

optimizer:
  _target_: torch.optim.AdamW
  lr: 0.0

loss_fn:
  _target_: nemo_automodel.components.loss.te_parallel_ce.TEParallelCrossEntropy
