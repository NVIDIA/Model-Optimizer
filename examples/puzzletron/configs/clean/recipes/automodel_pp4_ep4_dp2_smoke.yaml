# Training-only Super smoke topology: PP=4 x combined-DP=8 = 32 processes,
# with EP=4 leaving two logical DP/token-reduction lanes. PP=4 keeps the
# 120B backward pass below an 80-GiB GPU without increasing the sample batch.
step_scheduler:
  global_batch_size: 2
  local_batch_size: 1
  max_steps: 1

dist_env:
  backend: nccl

model:
  torch_dtype: bf16
  trust_remote_code: true

checkpoint:
  enabled: false

distributed:
  dp_size: 8
  tp_size: 1
  cp_size: 1
  ep_size: 4
  pp_size: 4
  sequence_parallel: false
  pipeline:
    pp_schedule: 1f1b
    pp_microbatch_size: 1
    pp_batch_size: 1
    pp_seq_len: 256

distributed_config:
  _target_: nemo_automodel.components.distributed.config.FSDP2Config
  activation_checkpointing: true

packed_sequence:
  packed_sequence_size: 256

dataset:
  _target_: modelopt.torch.puzzletron.plugins.automodel.dummy_data.make_dummy_dataset
  num_samples: 2
  seq_length: 256

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  shuffle: false
  collate_fn: nemo_automodel.components.datasets.utils.default_collater

optimizer:
  _target_: torch.optim.AdamW
  lr: 0.0

loss_fn:
  _target_: nemo_automodel.components.loss.te_parallel_ce.TEParallelCrossEntropy
