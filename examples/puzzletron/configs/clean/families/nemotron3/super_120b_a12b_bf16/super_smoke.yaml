# @package _global_

defaults:
  - /base@_global_
  - /families/nemotron3/family@_global_
  - /families/nemotron3/super_120b_a12b_bf16/model@_global_
  - _self_

puzzle_dir: ${puzzle_root}/nemotron3/super_120b_a12b_bf16/Super-Smoke
skip_realize_model: false

execution:
  gpus_per_node: 8

model:
  force_hf: false
  trust_remote_code: true

data:
  modality: text
  layout: packed_varlen
  max_sample_length: 256
  packing:
    pack_size: 256
    packing_ratio: 1.0
    drop_long_samples: true

tokenize_data:
  enabled: true
  workers: 1
  tokenize_batch_size: 1
  content_field: messages
  caches:
    - output: ${puzzle_dir}/dataset_cache/train_2x256.tokens
      split: train
      num_samples: 2
      seq_length: 256
      shuffle_seed: 444
    - output: ${puzzle_dir}/dataset_cache/validation_2x256.tokens
      split: validation
      num_samples: 2
      seq_length: 256
      shuffle_seed: 445

pruning:
  experiment_id: Super-Smoke
  eval_samples: 2
  micro_batch_size: 2
  block_size: 256
  packed_token_cache_path: ${puzzle_dir}/dataset_cache/train_2x256.tokens
  attention_scored_axes: [kv_groups, q_heads_per_group]
  automodel:
    force_hf: false
    use_puzzletron_dataloader: true
    # PP2 x combined DP8 = 16 ranks; EP4 leaves two sample-parallel lanes.
    parallel: &super_scoring_mesh
      tp: 1
      cp: 1
      pp: 2
      ep: 4
      dp_shard: 4
      dp_replicate: 2
      sequence_parallel: false
      pipeline_schedule: 1f1b

search_space:
  axes:
    kv_groups: {enabled: true, teacher_value: 2, values: [1]}
    q_heads_per_group: {enabled: true, teacher_value: 16, values: [8]}
    mamba_heads: {enabled: true, teacher_value: 128, values: [64]}
    mamba_head_dim: {enabled: true, teacher_value: 64, values: [32]}
    moe_experts: {enabled: true, teacher_value: 512, values: [128]}
    moe_expert_intermediate: {enabled: true, teacher_value: 2688, values: [1344]}
    moe_shared_expert_intermediate: {enabled: true, teacher_value: 5376, values: [2688]}
    moe_latent_dim: {enabled: true, teacher_value: 1024, values: [512]}
    moe_top_k: {enabled: true, teacher_value: 22, values: [8]}

embedding_pruning:
  enabled: true
  widths: [4096, 3840]
  alignment: 256
  cycle_widths: true

depth_importance:
  enabled: true
  granularity: subblock
  source_checkpoint_dir: ${teacher_dir}
  expected_initial_sublayers: 88
  max_removals: 1
  max_subblocks_to_remove: 1
  eval_samples: 2
  micro_batch_size: 2
  block_size: 256
  packed_token_cache_path: ${puzzle_dir}/dataset_cache/validation_2x256.tokens
  automodel:
    parallel: *super_scoring_mesh

vllm_stats:
  enabled: true
  batch_sizes: [1]
  # Benchmark the teacher anchor plus one reduced value per axis at both
  # nested hidden widths. Pairwise/Cartesian combinations are intentionally
  # excluded from this smoke.
  model_hidden_sizes: [3840]
  prefill_seq_len: 256
  generation_seq_len: 32
  runtime_stats:
    enabled: true
    granularity: subblock
    # Sparse timing needs enough samples to reject vLLM startup noise, while
    # three repeated native blocks keep each Super benchmark small.
    num_iters: 3
    num_warmup_iters: 2
    repeat_block_n_times: 3
    max_num_seqs: 1
    sparse_sampling:
      enabled: true
      max_pairwise_per_family: 0
      seed: 42
    topology:
      tensor_parallel_size: 2
      pipeline_parallel_size: 2
      prefill_context_parallel_size: 1
      decode_context_parallel_size: 1
      distributed_executor_backend: mp
      gpu_group_size: 4

sort_sanity:
  enabled: true
  eval_samples: 2
  micro_batch_size: 2
  block_size: 256
  packed_token_cache_path: ${puzzle_dir}/dataset_cache/validation_2x256.tokens
  max_abs_lm_loss_delta: 1.0e-3
  # Reversing all 1024 latent lanes changes BF16 reduction order across every
  # MoE layer; keep the real activation sort on the strict production gate.
  max_abs_reverse_lm_loss_delta: 2.0e-2
  automodel:
    parallel: *super_scoring_mesh

width_sanity:
  enabled: true
  single_load_parent_sweep: true
  one_case_per_axis: true
  methods: [activation, random, reverse]
  non_sortable_axes: [moe_top_k]
  physical_realization: true
  cleanup_physical_checkpoints: true
  reuse_sort_equivalence: true
  reverse_checkpoint_dir: ${puzzle_dir}/ckpts/reverse_sorted_teacher
  reverse_activation_logs_dir: ${puzzle_dir}/pruning/pruning_scores/automodel/reverse_all_axes
  cleanup_reverse_on_success: false
  require_beats_random: false
  require_beats_reverse: false
  physical_equivalence_tolerance: 1.0e-3
  # Two 256-token samples make discrete accuracy move in 1/512 increments.
  # Keep continuous hidden-state metrics tight while allowing measured BF16
  # fused-kernel drift and at most five changed token decisions.
  physical_equivalence_tolerances:
    raw_replacement_loss: 5.0e-3
    mse_loss_hidden_states: 5.0e-3
    mae_loss_hidden_states: 7.0e-3
    kl_div: 2.0e-3
    lm_loss: 1.0e-2
    token_accuracy_top_1: 1.0e-2
    token_accuracy_top_1_consistency: 1.0e-2
    token_accuracy_top_5: 1.0e-2
    token_accuracy_top_5_consistency: 1.0e-2
    token_accuracy_top_10: 1.0e-2
    token_accuracy_top_10_consistency: 1.0e-2
  require_physical_equivalence: true
  eval_samples: 2
  micro_batch_size: 2
  block_size: 256
  packed_token_cache_path: ${puzzle_dir}/dataset_cache/validation_2x256.tokens
  automodel:
    parallel: *super_scoring_mesh

slicing_sanity:
  enabled: true
  backend: distributed_parent_sweep
  eval_samples: 2
  micro_batch_size: 2
  block_size: 256
  packed_token_cache_path: ${puzzle_dir}/dataset_cache/validation_2x256.tokens
  automodel:
    parallel: *super_scoring_mesh

bypass_sanity:
  enabled: true
  # The fixed probe must demonstrate a material reduction, while the diverse
  # probe needs two full eight-step trend windows.
  steps: 32
  fixed_smallest: true
  diverse_nested: true

bypass:
  enabled: true
  backend: automodel
  automodel:
    # PP4 keeps the 120B backward pass below the per-GPU memory limit.
    parallel:
      tp: 1
      cp: 1
      pp: 4
      ep: 4
      dp_shard: 4
      dp_replicate: 2
      sequence_parallel: false
      pipeline_schedule: 1f1b
  elastic: true
  find_last_ckpt_for_resume: true
  iter_num: 1
  step_num: 1
  token_count: 1024
  data:
    block_size: 256
    packed_token_cache_path: ${puzzle_dir}/dataset_cache/train_2x256.tokens
    validation_packed_token_cache_path: ${puzzle_dir}/dataset_cache/validation_2x256.tokens
    max_eval_samples: 2
  training:
    training_tokens: 1024
    micro_batch_size: 2
    val_micro_batch_size: 2
    grad_accumulation_steps: 1
    log_interval: 1
    eval_interval: 1

build_library:
  include_noops: false
  include_bypass: true

replacement_scoring:
  enabled: true
  granularity: subblock
  eval_samples: 2
  micro_batch_size: 2
  block_size: 256
  packed_token_cache_path: ${puzzle_dir}/dataset_cache/validation_2x256.tokens
  automodel:
    force_hf: false
    parallel: *super_scoring_mesh
  distributed_eval:
    gpus_per_task: 16

realize_model:
  automodel:
    force_hf: false
    parallel: *super_scoring_mesh

mip:
  depth_scenario_count: 1
  score_granularity: subblock
  constraint_profiles: [0.9]
  human_constraints:
    num_params_ratio: 0.9
  grid_budgeting:
    enabled: true
    param_ratios: [0.9]

zero_shot_evaluation:
  enabled: true
  profile_id: params-090
  eval_samples: 2
  block_size: 256
  packed_token_cache_path: ${puzzle_dir}/dataset_cache/validation_2x256.tokens

aiperf:
  enabled: true
  profile_id: params-090
  checkpoint_source: scenario_grid
  endpoint_type: completions
  input_tokens: 256
  output_tokens: 32
  concurrency: [1, 2]
  minimum_request_count: 1
  requests_per_concurrency: 1
  topology:
    tensor_parallel_size: 2
    pipeline_parallel_size: 2
    prefill_context_parallel_size: 1
    decode_context_parallel_size: 1
    distributed_executor_backend: mp
    gpu_group_size: 4
    extra_vllm_args: [-cc.cudagraph_mode=NONE]

global_distillation_sanity:
  enabled: true
  profile_id: params-090
  sample_count: 2
  sequence_length: 256
  packed_token_cache_path: ${puzzle_dir}/dataset_cache/train_2x256.tokens
  max_steps: 1
  local_batch_size: 1
  automodel:
    parallel: *super_scoring_mesh

global_distillation:
  enabled: true
  profile_id: params-090
  selection: best_evaluation
  evaluation_summary_path: ${puzzle_dir}/artifacts/zero_shot_evaluation/evaluation_summary.json
  output_dir: ${puzzle_dir}/artifacts/global_distillation/profiles/params-090/text-n2-l256-s2-b1-seed444/best-evaluation
  backend: automodel
  automodel:
    activation_checkpointing: true
    parallel: *super_scoring_mesh
  save_consolidated: true
  force_hf: false
  domain: llm
  global_batch_size: 2
  local_batch_size: 1
  max_steps: 1
  validation_enabled: false
  resume: true
  freeze_policy: projector_and_language
  objective:
    main_ce: {weight: 0.5}
    main_kd: {weight: 0.5, metric: kld, temperature: 1.0, chunk_size: 64}
    mtp_ce: {weight: 0.0}
    mtp_kd: {weight: 0.0, metric: kld, temperature: 1.0, chunk_size: 64}
  metadata:
    llm:
      dataset:
        target: modelopt.torch.puzzletron.distillation.dataset.make_puzzletron_llm_dataset
        dataset_path: ${dataset_path}
        split: train
        num_samples: 2
        seq_length: 256
        packed_token_cache_path: ${puzzle_dir}/dataset_cache/train_2x256.tokens
        seed: 444
      dataloader:
        target: torchdata.stateful_dataloader.StatefulDataLoader
        shuffle: false
        collate_fn: modelopt.torch.puzzletron.distillation.dataset.collate_puzzletron_llm_batch

post_distillation_evaluation:
  enabled: true
  eval_samples: 2
  block_size: 256
