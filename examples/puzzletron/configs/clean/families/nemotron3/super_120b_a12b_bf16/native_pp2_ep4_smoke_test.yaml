# @package _global_

defaults:
  - /base@_global_
  - /families/nemotron3/family@_global_
  - /families/nemotron3/super_120b_a12b_bf16/model@_global_
  - _self_

puzzle_dir: ${puzzle_root}/nemotron3/super_120b_a12b_bf16/native_pp2_ep4_smoke_test
recipe_path: ${clean_config_root}/recipes/automodel_pp2_ep4.yaml
skip_realize_model: false

model:
  force_hf: false

pruning:
  experiment_id: native_pp2_ep4_smoke_test
  eval_samples: 2
  micro_batch_size: 1
  block_size: 512

vllm_stats:
  prefill_seq_len: 512
  generation_seq_len: 128
  runtime_stats:
    repeat_block_n_times: 2
    num_iters: 1
    num_warmup_iters: 0

replacement_scoring:
  eval_samples: 2
  micro_batch_size: 1

bypass:
  enabled: true
  backend: automodel
  elastic: true
  experiment_id: native_elastic_pp2_ep4_smoke_test
  training:
    training_tokens: 512
    micro_batch_size: 1

search_space:
  axes:
    kv_groups:
      enabled: true
      teacher_value: 2
      values: [1]
    q_heads_per_group:
      enabled: true
      teacher_value: 16
      values: [12]
    mamba_heads:
      enabled: true
      teacher_value: 128
      values: [96]
    mamba_head_dim:
      enabled: true
      teacher_value: 64
      values: [48]
    moe_experts:
      enabled: true
      teacher_value: 512
      values: [384]
    moe_expert_intermediate:
      enabled: true
      teacher_value: 2688
      values: [2016]
    moe_shared_expert_intermediate:
      enabled: true
      teacher_value: 5376
      values: [4032]
    moe_latent_dim:
      enabled: true
      teacher_value: 1024
      values: [768]
    moe_top_k:
      enabled: true
      teacher_value: 22
      values: [16]

mip:
  human_constraints:
    target_num_kv_heads: 9
  grid_budgeting:
    enabled: true
    entries:
      - name: kv_heads_9
        human_constraints:
          target_num_kv_heads: 9
