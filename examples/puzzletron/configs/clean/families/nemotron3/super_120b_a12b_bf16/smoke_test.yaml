# @package _global_

defaults:
  - /base@_global_
  - /families/nemotron3/family@_global_
  - /families/nemotron3/super_120b_a12b_bf16/model@_global_
  - _self_

puzzle_dir: ${puzzle_root}/nemotron3/super_120b_a12b_bf16/smoke_test
skip_realize_model: false

pruning:
  experiment_id: smoke_test
  eval_samples: 2
  micro_batch_size: 1
  block_size: 512

vllm_stats:
  prefill_seq_len: 512
  generation_seq_len: 128
  runtime_stats:
    num_iters: 1
    num_warmup_iters: 0

replacement_scoring:
  eval_samples: 2
  micro_batch_size: 1

bypass:
  enabled: true
  backend: automodel
  elastic: true
  experiment_id: elastic_smoke_test
  training:
    training_tokens: 512
    micro_batch_size: 1

mip:
  human_constraints:
    target_num_kv_heads: 9
  grid_budgeting:
    enabled: true
    entries:
      - name: kv_heads_9
        human_constraints:
          target_num_kv_heads: 9
