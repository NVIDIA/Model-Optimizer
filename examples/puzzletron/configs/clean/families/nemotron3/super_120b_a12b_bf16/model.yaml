# @package _global_

input_hf_model_path: nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-BF16

model_info:
  hf_repo: nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-BF16
  model_type: nemotron_h
  architectures: [NemotronHForCausalLM]
  num_hidden_layers: 88
  hidden_size: 4096
  intermediate_size: 2688
  num_attention_heads: 32
  num_key_value_heads: 2
  head_dim: 128
  vocab_size: 131072
  tie_word_embeddings: false
  max_position_embeddings: 262144
  hybrid_override_pattern: MEMEMEM*EMEMEMEM*EMEMEMEM*EMEMEMEMEM*EMEMEMEMEM*EMEMEMEMEM*EMEMEMEMEM*EMEMEMEM*EMEMEMEME
  layer_counts:
    mamba: 40
    moe: 40
    attention: 8
  mamba:
    ssm_state_size: 128
    mamba_num_heads: 128
    mamba_head_dim: 64
    n_groups: 8
    conv_kernel: 4
  moe:
    n_routed_experts: 512
    moe_intermediate_size: 2688
    moe_shared_expert_intermediate_size: 5376
    moe_latent_size: 1024
    num_experts_per_tok: 22
    n_shared_experts: 1
    routed_scaling_factor: 5.0
    norm_topk_prob: true

pruning:
  attn_heads_list: [[16, 1], [16, 2], [24, 2]]

search_space:
  axes:
    kv_groups:
      enabled: true
      teacher_value: 2
      values: [1]
    q_heads_per_group:
      enabled: true
      teacher_value: 16
      values: [8, 12]
    mamba_heads:
      enabled: true
      teacher_value: 128
      values: [64, 96]
    mamba_head_dim:
      enabled: true
      teacher_value: 64
      values: [32, 48]
    moe_experts:
      enabled: true
      teacher_value: 512
      values: [128, 256, 384]
    moe_expert_intermediate:
      enabled: true
      teacher_value: 2688
      values: [1344, 2016]
    moe_shared_expert_intermediate:
      enabled: true
      teacher_value: 5376
      values: [2688, 4032]
    moe_latent_dim:
      enabled: true
      teacher_value: 1024
      values: [512, 768]
    moe_top_k:
      enabled: true
      teacher_value: 22
      values: [8, 12, 16]
