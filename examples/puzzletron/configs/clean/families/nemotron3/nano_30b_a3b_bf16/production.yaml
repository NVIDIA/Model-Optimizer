# @package _global_

defaults:
  - /base@_global_
  - /families/nemotron3/family@_global_
  - /families/nemotron3/nano_30b_a3b_bf16/model@_global_
  - _self_

puzzle_dir: puzzle_runs/nemotron3-nano-30b-a3b-puzzletron-v1
scoring_parent_dir: ${puzzle_dir}/ckpts/sorted_teacher
train_token_cache_path: ${puzzle_dir}/dataset_cache/train_8192x8192.tokens
validation_token_cache_path: ${puzzle_dir}/dataset_cache/validation_128x8192.tokens
# MIP publishes architecture recipes only.  All candidates are scored online
# from the resident sorted teacher; only the final AIPerf/KD winners are
# materialized.
skip_realize_model: true

execution:
  gpus_per_node: 8

model:
  force_hf: false
  trust_remote_code: true
  revision: cbd3fa9f933d55ef16a84236559f4ee2a0526848

data:
  modality: text
  layout: fixed
  max_sample_length: 8192
  packing: null

tokenize_data:
  enabled: true
  workers: 64
  tokenize_batch_size: 64
  content_field: messages
  caches:
    - output: ${train_token_cache_path}
      split: train
      num_samples: 8192
      seq_length: 8192
      shuffle_seed: 444
    - output: ${validation_token_cache_path}
      split: validation
      num_samples: 128
      seq_length: 8192
      shuffle_seed: 445

embedding_pruning:
  enabled: true
  widths: [2688, 2560, 2432]
  alignment: 128
  cycle_widths: true

pruning:
  experiment_id: nano-width-importance-8192x8192
  eval_samples: 8192
  micro_batch_size: 1
  block_size: 8192
  packed_token_cache_path: ${train_token_cache_path}
  attention_scored_axes: [kv_groups, q_heads_per_group]
  attention_token_chunk_size: 512
  activation_hooks_kwargs:
    token_chunk_size: 256
  automodel:
    force_hf: false
    use_puzzletron_dataloader: true
    parallel: &one_node_model_mesh
      tp: 1
      cp: 1
      pp: 2
      ep: 4
      dp_shard: 4
      dp_replicate: 1
      sequence_parallel: false
      pipeline_schedule: 1f1b
  # The source config has no latent projection, so the family latent pass is
  # intentionally replaced by this exact supported-pass list.
  activation_passes:
    - name: hidden_width
      activation_hooks_kwargs: {method: minitron_hidden_width}
    - name: attention_grouped
      pruning_mixin:
        _target_: modelopt.torch.puzzletron.pruning.kv_heads_pruning_mixin.KVHeadsPruningMixIn
        layer_descriptor:
          _target_: modelopt.torch.puzzletron.anymodel.models.nemotron_h.nemotron_h_model_descriptor.NemotronHKVHeadsLayerDescriptor
      hook_class: ${get_object:modelopt.torch.prune.importance_hooks.base_hooks.IndependentKvHeadContributionHook}
      activation_hooks_kwargs:
        method: grouped_attention_contribution
        optimize_for: memory
        target_layer: mixer.o_proj
        layer_input_descriptors_path:
    - name: moe_expert_removal
      pruning_mixin:
        _target_: modelopt.torch.puzzletron.pruning.moe_mamba_pruning_mixin.MoEPruningMixIn
        layer_descriptor:
          _target_: modelopt.torch.puzzletron.anymodel.models.nemotron_h.nemotron_h_model_descriptor.NemotronHMoELayerDescriptor
          target_name: mixer
          require_attrs: [gate, experts]
      activation_hooks_kwargs: {method: removed_expert_diff, target_layer: mixer}
    - name: moe_expert_intermediate
      pruning_mixin:
        _target_: modelopt.torch.puzzletron.pruning.moe_mamba_pruning_mixin.MoEPruningMixIn
        layer_descriptor:
          _target_: modelopt.torch.puzzletron.anymodel.models.nemotron_h.nemotron_h_model_descriptor.NemotronHMoELayerDescriptor
          target_name: "regex:(^|\\.)(backbone|model)?\\.?layers\\.\\d+\\.mixer\\.experts(\\.\\d+\\.down_proj)?$"
      activation_hooks_kwargs: {method: moe_channel, target_layer: mixer.experts}
    - name: moe_shared_expert_intermediate
      pruning_mixin:
        _target_: modelopt.torch.puzzletron.pruning.moe_mamba_pruning_mixin.MoEPruningMixIn
        layer_descriptor:
          _target_: modelopt.torch.puzzletron.anymodel.models.nemotron_h.nemotron_h_model_descriptor.NemotronHMoELayerDescriptor
          target_name: mixer.shared_experts.down_proj
      activation_hooks_kwargs:
        method: shared_expert_intermediate_contribution
        target_layer: mixer.shared_experts.down_proj
    - name: mamba_head_and_dim
      pruning_mixin:
        _target_: modelopt.torch.puzzletron.pruning.moe_mamba_pruning_mixin.MambaPruningMixIn
        layer_descriptor:
          _target_: modelopt.torch.puzzletron.anymodel.models.nemotron_h.nemotron_h_model_descriptor.NemotronHMambaLayerDescriptor
          target_name: mixer.in_proj
      activation_hooks_kwargs: {method: mamba_head_and_dim, target_layer: mixer.in_proj}

sort:
  # Nano has no latent MoE axis; Super-only latent sorting is not part of this campaign.
  deferred_axes: []

sort_sanity:
  enabled: true
  include_reverse: true
  eval_samples: 128
  micro_batch_size: 1
  block_size: 8192
  packed_token_cache_path: ${validation_token_cache_path}
  max_abs_lm_loss_delta: 1.0e-3
  automodel:
    parallel: *one_node_model_mesh

width_sanity:
  enabled: true
  single_load_parent_sweep: true
  one_case_per_axis: false
  target_count_per_axis: 2
  layer_count: 3
  layer_selection: random
  ratios: [0.875, 0.75]
  methods: [activation, random, reverse]
  non_sortable_axes: [moe_top_k]
  physical_realization: true
  cleanup_physical_checkpoints: true
  reuse_sort_equivalence: true
  require_beats_random: false
  require_beats_reverse: false
  require_physical_equivalence: true
  physical_equivalence_tolerance: 1.0e-3
  eval_samples: 128
  micro_batch_size: 1
  block_size: 8192
  packed_token_cache_path: ${validation_token_cache_path}
  automodel:
    parallel: *one_node_model_mesh

slicing_sanity:
  enabled: true
  backend: distributed_parent_sweep
  eval_samples: 128
  micro_batch_size: 1
  block_size: 8192
  packed_token_cache_path: ${validation_token_cache_path}
  automodel:
    parallel: *one_node_model_mesh

bypass_sanity:
  enabled: true
  steps: 128
  fixed_smallest: true
  diverse_nested: true

bypass:
  enabled: true
  granularity: subblock
  backend: automodel
  automodel:
    parallel: *one_node_model_mesh
  elastic: true
  elastic_include_no_op: false
  elastic_cycle_all_targets: true
  find_last_ckpt_for_resume: true
  # Keep the sorted teacher resident during replacement scoring. The scorer
  # overlays exactly one target layer from the nested bypass checkpoint below.
  use_nested_bypassed_checkpoint_for_scoring: false
  # These are mutable resume counters, not target totals. Fresh production
  # training starts at step 1; a checkpoint resume restores all three values.
  iter_num: 0
  step_num: 1
  token_count: 0
  overfit:
    repetitions: 128
    modes: [smallest_fixed, diverse_resampled]
    learning_rate: 3.0e-4
    grad_accumulation_steps: 16
  data:
    block_size: 8192
    packed_token_cache_path: ${train_token_cache_path}
    validation_packed_token_cache_path: ${validation_token_cache_path}
    max_eval_samples: 128
  training:
    training_tokens: 67108864
    micro_batch_size: 1
    val_micro_batch_size: 1
    grad_accumulation_steps: 64
    learning_rate: 1.0e-6
    weight_decay: 0.0
    warmup_steps: 0
    log_interval: 1
    eval_interval: 128
  model_factory:
    keys_to_learn: entire_block

depth_importance:
  enabled: true
  granularity: subblock
  source_checkpoint_dir: ${teacher_dir}
  output_dir: ${puzzle_dir}/depth/iterative
  expected_initial_sublayers: 52
  max_removals: 5
  max_subblocks_to_remove: 5
  metric: lm_loss
  eval_samples: 128
  micro_batch_size: 1
  block_size: 8192
  packed_token_cache_path: ${validation_token_cache_path}
  automodel:
    parallel: *one_node_model_mesh

build_library:
  enabled: true
  source_checkpoint_dir: ${scoring_parent_dir}
  include_noops: false
  include_bypass: true

replacement_scoring:
  enabled: true
  granularity: subblock
  source_checkpoint_dir: ${scoring_parent_dir}
  target_teacher_dir: ${scoring_parent_dir}
  bypass_checkpoint_dir: ${puzzle_dir}/ckpts/elastic_sorted_teacher
  subblock_solutions_path: ${to_path:${puzzle_dir}/single_subblock_replacement_solutions.json}
  subblock_output_dir: ${puzzle_dir}/single_subblock_replacement_solutions--validation
  eval_samples: 128
  micro_batch_size: 1
  block_size: 8192
  packed_token_cache_path: ${validation_token_cache_path}
  automodel:
    force_hf: false
    parallel: *one_node_model_mesh
    lm_head_backend: flash_kld
    flash_kld_token_chunk_size: 1024
  distributed_eval:
    gpus_per_task: 8
  default_metric: normalized_mse_loss_hidden_states

vllm_stats:
  enabled: true
  batch_sizes: [4]
  model_hidden_sizes: [2688, 2560, 2432]
  parameter_workers: 3
  parameter_progress_every: 10
  prefill_seq_len: 8192
  generation_seq_len: 1024
  runtime_stats:
    enabled: true
    backend: vllm
    granularity: subblock
    # Preserve the already verified exact measurements while refreshing width-correct params.
    reuse_stats_path: ${puzzle_dir}/evidence/subblock_stats.before_persistent-buffer-count.json
    execution: sharded
    include_noop_baselines: false
    vllm_env:
      VLLM_USE_FUSED_MOE_GROUPED_TOPK: "1"
    num_iters: 5
    num_warmup_iters: 3
    repeat_block_n_times: 4
    max_num_seqs: 4
    ignore_negatives: true
    sparse_sampling:
      enabled: false
      max_pairwise_per_family: 0
      seed: 42
    topology:
      tensor_parallel_size: 1
      pipeline_parallel_size: 1
      prefill_context_parallel_size: 1
      decode_context_parallel_size: 1
      distributed_executor_backend: mp
      gpu_group_size: 1

mip:
  enabled: true
  depth_trajectory_path: ${puzzle_dir}/depth/iterative/trajectory.json
  depth_scenario_count: 6
  score_granularity: subblock
  single_block_replacement_validation_dir: ${to_path:${replacement_scoring.subblock_output_dir}}
  canonical_solutions_path: ${to_path:${replacement_scoring.subblock_solutions_path}}
  human_constraints: {num_params_ratio: 0.75}
  constraint_profiles: [0.75]
  latency_constraint_profiles: [0.75]
  grid_budgeting: {enabled: false}
  workloads:
    serving-8k:
      isl: 8192
      osl: 1024
      batch_size: 4
      concurrency: 4
  profiles:
    params-075:
      num_homogeneous_solutions: 5
      constraints: {params: {min: "73%", max: "75%"}}
      search_space:
        depth: {range: [0, 5]}
        embedding: [2688, 2560, 2432]
    runtime-075:
      num_homogeneous_solutions: 5
      constraints:
        runtime:
          at: {serving-8k: {min: "73%", max: "75%"}}
      search_space:
        depth: {range: [0, 5]}
        embedding: [2688, 2560, 2432]
    memory-075:
      num_homogeneous_solutions: 5
      constraints:
        memory:
          at: {serving-8k: {min: "73%", max: "75%"}}
      search_space:
        depth: {range: [0, 5]}
        embedding: [2688, 2560, 2432]
    params-075-num-experts-only:
      num_homogeneous_solutions: 5
      constraints: {params: {min: "73%", max: "75%"}}
      search_space:
        depth: {range: [0, 5]}
        embedding: [2688, 2560, 2432]
        axes_default: teacher
        axes:
          n_routed_experts: all
    params-075-expert-dim-only:
      num_homogeneous_solutions: 5
      constraints: {params: {min: "73%", max: "75%"}}
      search_space:
        depth: {range: [0, 5]}
        embedding: [2688, 2560, 2432]
        axes_default: teacher
        axes:
          moe_intermediate_size: all
    params-075-num-experts-and-expert-dim:
      num_homogeneous_solutions: 5
      constraints: {params: {min: "73%", max: "75%"}}
      search_space:
        depth: {range: [0, 5]}
        embedding: [2688, 2560, 2432]
        axes_default: teacher
        axes:
          n_routed_experts: all
          moe_intermediate_size: all

mip_solution_contract:
  depth_values: [0, 1, 2, 3, 4, 5]
  hidden_widths: [2688, 2560, 2432]
  solutions_per_profile: 18

realize_model:
  skip_validation: false
  eval_samples: 128
  micro_batch_size: 1
  block_size: 8192
  packed_token_cache_path: ${validation_token_cache_path}
  automodel:
    force_hf: false
    parallel: *one_node_model_mesh
    lm_head_backend: flash_kld
    flash_kld_token_chunk_size: 1024

zero_shot_evaluation:
  enabled: true
  mode: online_solutions
  profile_ids:
    - params-075
    - runtime-075
    - memory-075
    - params-075-num-experts-only
    - params-075-expert-dim-only
    - params-075-num-experts-and-expert-dim
  eval_samples: 128
  block_size: 8192
  packed_token_cache_path: ${validation_token_cache_path}
  num_best_to_eval: -1

aiperf:
  enabled: true
  profile_id: runtime-075
  executable: aiperf
  checkpoint_source: scenario_grid
  endpoint_type: completions
  use_server_token_count: true
  input_tokens: 8192
  output_tokens: 1024
  concurrency: [1, 4, 16, 64]
  minimum_request_count: 8
  requests_per_concurrency: 2
  seed: 42
  num_best_to_eval: 1
  expected_solution_count: 1
  topology_matrix:
    - {id: tp8, tensor_parallel_size: 8, pipeline_parallel_size: 1, data_parallel_size: 1, expert_parallel_size: 1}
    - {id: tp4-pp2, tensor_parallel_size: 4, pipeline_parallel_size: 2, data_parallel_size: 1, expert_parallel_size: 1}
    - {id: tp2-pp4, tensor_parallel_size: 2, pipeline_parallel_size: 4, data_parallel_size: 1, expert_parallel_size: 1}
    - {id: tp2-pp2-dp2-ep2, tensor_parallel_size: 2, pipeline_parallel_size: 2, data_parallel_size: 2, expert_parallel_size: 2}
    - {id: pp2-dp4-ep4, tensor_parallel_size: 1, pipeline_parallel_size: 2, data_parallel_size: 4, expert_parallel_size: 4}
    - {id: dp8-ep8, tensor_parallel_size: 1, pipeline_parallel_size: 1, data_parallel_size: 8, expert_parallel_size: 8}

global_distillation_sanity:
  enabled: true
  profile_id: runtime-075
  selection: best_evaluation
  sample_count: 16
  sequence_length: 8192
  packed_token_cache_path: ${train_token_cache_path}
  max_steps: 128
  local_batch_size: 1
  lr: 1.0e-4
  automodel:
    parallel: *one_node_model_mesh

global_distillation:
  enabled: true
  profile_id: runtime-075
  selection: best_evaluation
  evaluation_summary_path: ${puzzle_dir}/artifacts/zero_shot_evaluation/profiles/runtime-075/text-s128-l8192/evaluation_summary.json
  backend: automodel
  automodel:
    activation_checkpointing: true
    parallel: *one_node_model_mesh
  save_consolidated: true
  force_hf: false
  domain: llm
  global_batch_size: 64
  local_batch_size: 1
  max_steps: 128
  validation_enabled: false
  resume: true
  num_best_to_distill: 1
  freeze_policy: projector_and_language
  objective:
    main_ce: {weight: 0.5}
    main_kd: {weight: 0.5, metric: kld, temperature: 1.0, chunk_size: 64}
    mtp_ce: {weight: 0.0}
    mtp_kd: {weight: 0.0, metric: kld, temperature: 1.0, chunk_size: 64}
  metadata:
    llm:
      dataset:
        target: modelopt.torch.puzzletron.distillation.dataset.make_puzzletron_llm_dataset
        dataset_path: ${dataset_path}
        split: train
        num_samples: 8192
        seq_length: 8192
        packed_token_cache_path: ${train_token_cache_path}
        seed: 444
      dataloader:
        target: torchdata.stateful_dataloader.StatefulDataLoader
        shuffle: false
        collate_fn: modelopt.torch.puzzletron.distillation.dataset.collate_puzzletron_llm_batch

post_distillation_evaluation:
  enabled: true
  eval_samples: 128
  block_size: 8192
  packed_token_cache_path: ${validation_token_cache_path}
