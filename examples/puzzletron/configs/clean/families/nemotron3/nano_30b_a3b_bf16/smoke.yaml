# @package _global_

defaults:
  - /families/nemotron3/nano_30b_a3b_bf16/production@_global_
  - _self_

puzzle_dir: puzzle_runs/nemotron3-nano-30b-a3b-puzzletron-v1/smoke
train_token_cache_path: ${puzzle_dir}/dataset_cache/train_2x256.tokens
validation_token_cache_path: ${puzzle_dir}/dataset_cache/validation_2x256.tokens

data:
  layout: packed_varlen
  max_sample_length: 256
  packing:
    pack_size: 256
    packing_ratio: 1.0
    drop_long_samples: true

tokenize_data:
  workers: 1
  tokenize_batch_size: 1
  caches:
    - {output: '${train_token_cache_path}', split: train, num_samples: 2, seq_length: 256, shuffle_seed: 444}
    - {output: '${validation_token_cache_path}', split: validation, num_samples: 2, seq_length: 256, shuffle_seed: 445}

search_space:
  axes:
    kv_groups: {enabled: true, teacher_value: 2, values: [1]}
    q_heads_per_group: {enabled: true, teacher_value: 16, values: [8]}
    mamba_heads: {enabled: true, teacher_value: 64, values: [48]}
    mamba_head_dim: {enabled: true, teacher_value: 64, values: [48]}
    moe_experts: {enabled: true, teacher_value: 128, values: [64]}
    moe_expert_intermediate: {enabled: true, teacher_value: 1856, values: [832]}
    moe_shared_expert_intermediate: {enabled: true, teacher_value: 3712, values: [2048]}
    moe_top_k: {enabled: true, teacher_value: 6, values: [2]}

pruning:
  experiment_id: nano-full-axis-smoke
  eval_samples: 2
  micro_batch_size: 1
  block_size: 256
  packed_token_cache_path: ${train_token_cache_path}

sort_sanity:
  eval_samples: 2
  block_size: 256
  packed_token_cache_path: ${validation_token_cache_path}

width_sanity:
  layer_count: 3
  target_count_per_axis: 2
  eval_samples: 2
  block_size: 256
  packed_token_cache_path: ${validation_token_cache_path}
  require_beats_random: false
  require_beats_reverse: false

slicing_sanity:
  eval_samples: 2
  block_size: 256
  packed_token_cache_path: ${validation_token_cache_path}

bypass_sanity:
  steps: 8

bypass:
  iter_num: 1
  step_num: 1
  token_count: 256
  overfit:
    repetitions: 8
    grad_accumulation_steps: 1
  data:
    block_size: 256
    packed_token_cache_path: ${train_token_cache_path}
    validation_packed_token_cache_path: ${validation_token_cache_path}
    max_eval_samples: 2
  training:
    training_tokens: 256
    micro_batch_size: 1
    val_micro_batch_size: 1
    grad_accumulation_steps: 1
    eval_interval: 1

depth_importance:
  expected_initial_sublayers: 52
  max_removals: 1
  max_subblocks_to_remove: 1
  eval_samples: 2
  block_size: 256
  packed_token_cache_path: ${validation_token_cache_path}

replacement_scoring:
  eval_samples: 2
  block_size: 256
  packed_token_cache_path: ${validation_token_cache_path}
  distributed_eval:
    gpus_per_task: 8

vllm_stats:
  batch_sizes: [1]
  prefill_seq_len: 256
  generation_seq_len: 32
  runtime_stats:
    execution: inline
    vllm_env:
      VLLM_USE_FUSED_MOE_GROUPED_TOPK: "0"
    num_iters: 3
    num_warmup_iters: 2
    repeat_block_n_times: 3
    max_num_seqs: 1

mip:
  depth_scenario_count: 2
  human_constraints: {num_params_ratio: 0.9}
  constraint_profiles: [0.9]
  latency_constraint_profiles: []
  profiles:
    params-090:
      num_homogeneous_solutions: 1
      constraints: {params: "90%"}
      search_space:
        depth: {range: [0, 1]}

realize_model:
  eval_samples: 2
  block_size: 256
  packed_token_cache_path: ${validation_token_cache_path}

zero_shot_evaluation:
  profile_id: params-090
  eval_samples: 2
  block_size: 256
  packed_token_cache_path: ${validation_token_cache_path}
  num_best_to_eval: 1

aiperf:
  profile_id: params-090
  input_tokens: 256
  output_tokens: 32
  concurrency: [1]
  minimum_request_count: 1
  requests_per_concurrency: 1
  num_best_to_eval: 1
  topology:
    tensor_parallel_size: 2
    pipeline_parallel_size: 2
    data_parallel_size: 2
    expert_parallel_size: 2
    prefill_context_parallel_size: 1
    decode_context_parallel_size: 1
    distributed_executor_backend: mp
    gpu_group_size: 8

global_distillation_sanity:
  profile_id: params-090
  sample_count: 2
  sequence_length: 256
  packed_token_cache_path: ${train_token_cache_path}
  max_steps: 1
  local_batch_size: 1

global_distillation:
  profile_id: params-090
  global_batch_size: 2
  local_batch_size: 1
  max_steps: 1
  num_best_to_distill: 1
  metadata:
    llm:
      dataset:
        target: modelopt.torch.puzzletron.distillation.dataset.make_puzzletron_llm_dataset
        dataset_path: ${dataset_path}
        split: train
        num_samples: 2
        seq_length: 256
        packed_token_cache_path: ${train_token_cache_path}
        seed: 444
      dataloader:
        target: torchdata.stateful_dataloader.StatefulDataLoader
        shuffle: false
        collate_fn: modelopt.torch.puzzletron.distillation.dataset.collate_puzzletron_llm_batch

post_distillation_evaluation:
  eval_samples: 2
  block_size: 256
  packed_token_cache_path: ${validation_token_cache_path}
