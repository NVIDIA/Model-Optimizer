# @package _global_

input_hf_model_path: meta-llama/Llama-3.1-8B-Instruct

model_info:
  hf_repo: meta-llama/Llama-3.1-8B-Instruct
  model_type: llama
  architectures: [LlamaForCausalLM]
  num_hidden_layers: 32
  hidden_size: 4096
  intermediate_size: 14336
  num_attention_heads: 32
  num_key_value_heads: 8
  vocab_size: 128256
  tie_word_embeddings: false

pruning:
  intermediate_size_list: [3584, 7168, 10752]
  attn_heads_list: [[16, 4], [8, 2], [4, 1], [8, 8], [16, 8], [24, 8]]

search_space:
  axes:
    ffn_intermediate:
      enabled: true
      teacher_value: 14336
      values: ${pruning.intermediate_size_list}
    kv_groups:
      enabled: true
      teacher_value: 8
      values: [4, 2, 1]
    q_heads_per_group:
      enabled: true
      teacher_value: 4
      values: [1, 2, 3]
    v_head_dim:
      enabled: true
      teacher_value: 128
      values: [32, 64, 96]
