# @package _global_

defaults:
  - /base@_global_
  - /families/qwen3_5/family@_global_
  - /families/qwen3_5/qwen3_5_9b/model@_global_
  - _self_

puzzle_dir: ${puzzle_root}/qwen3_5/qwen3_5_9b/full_pipeline
scoring_parent_dir: ${puzzle_dir}/ckpts/sorted_teacher
train_token_cache_path: ${puzzle_dir}/dataset_cache/nemotron2_train_65536x16384.tokens
validation_token_cache_path: ${puzzle_dir}/dataset_cache/nemotron2_validation_128x16384.tokens

execution:
  gpus_per_node: 8

model:
  force_hf: false
  revision: main

data:
  modality: text
  layout: fixed
  max_sample_length: 16384
  packing: null

tokenize_data:
  enabled: true
  workers: 64
  tokenize_batch_size: 64
  content_field: messages
  caches:
    - output: ${train_token_cache_path}
      split: train
      num_samples: 65536
      seq_length: 16384
      shuffle_seed: 444
    - output: ${validation_token_cache_path}
      split: validation
      num_samples: 128
      seq_length: 16384
      shuffle_seed: 445

embedding_pruning:
  enabled: false
  widths: [4096, 3840, 3584]
  alignment: 256
  cycle_widths: true

search_space:
  no_op:
    subblocks: []
    whole_block: false
    cartesian: false

pruning:
  experiment_id: qwen35_9b_16k_1b_tokens
  eval_samples: 65536
  micro_batch_size: 1
  block_size: 16384
  packed_token_cache_path: ${train_token_cache_path}
  activation_checkpoint_interval: 4
  attention_scored_axes: [kv_groups, q_heads_per_group]
  attention_token_chunk_size: 512
  gdn_scored_axes:
    [gdn_key_groups, gdn_value_heads_per_group, gdn_key_head_dim, gdn_value_head_dim]
  activation_hooks_kwargs:
    token_chunk_size: 256
  automodel:
    force_hf: false
    use_puzzletron_dataloader: true
    # TP=1 keeps odd three-group attention candidates legal. CP4 x PP2 uses one node.
    parallel: &qwen_one_node_mesh
      tp: 1
      cp: 4
      pp: 2
      ep: 1
      dp_shard: 1
      dp_replicate: 1
      sequence_parallel: false
      pipeline_schedule: interleaved1f1b

sort_sanity:
  enabled: true
  eval_samples: 128
  micro_batch_size: 1
  block_size: 16384
  packed_token_cache_path: ${validation_token_cache_path}
  max_abs_lm_loss_delta: 1.0e-3
  max_kl_div: 1.0e-2
  automodel:
    parallel: *qwen_one_node_mesh

width_sanity:
  enabled: true
  single_load_parent_sweep: true
  methods: [activation, random, reverse]
  layer_count: 4
  ratios: [0.5]
  eval_samples: 32
  block_size: 4096
  require_beats_random: true
  require_beats_reverse: true
  automodel:
    parallel: *qwen_one_node_mesh

bypass_sanity:
  enabled: false
  steps: 32
  fixed_smallest: true
  diverse_nested: true

bypass:
  enabled: false
  overfit:
    repetitions: 32
    modes: [smallest_fixed, diverse_resampled]
  backend: automodel
  elastic: true
  elastic_include_no_op: false
  elastic_cycle_all_targets: true
  find_last_ckpt_for_resume: true
  use_nested_bypassed_checkpoint_for_scoring: false
  iter_num: 1024
  step_num: 1024
  token_count: 1073741824
  automodel:
    parallel:
      tp: 1
      cp: 2
      pp: 2
      ep: 1
      dp_shard: 2
      dp_replicate: 1
      sequence_parallel: false
      pipeline_schedule: 1f1b
  data:
    block_size: 16384
    packed_token_cache_path: ${train_token_cache_path}
    validation_packed_token_cache_path: ${validation_token_cache_path}
    max_eval_samples: 128
  training:
    training_tokens: 1073741824
    micro_batch_size: 2
    val_micro_batch_size: 2
    grad_accumulation_steps: 32
    learning_rate: 1.0e-6
    weight_decay: 0.0
    warmup_steps: 0
    log_interval: 1
    eval_interval: 128
  model:
    model_overrides:
      save_interval_seconds: 12600
      save_interval: 1000000000
      save_checkpoint_when_done: true
      delete_old_checkpoints: false
  model_factory:
    keys_to_learn: entire_block

bypass_diagnostic:
  enabled: false

depth_importance:
  enabled: true
  granularity: subblock
  source_checkpoint_dir: ${scoring_parent_dir}
  output_dir: ${puzzle_dir}/depth/iterative
  max_removals: 6
  max_subblocks_to_remove: 6
  expected_initial_sublayers: 64
  metric: lm_loss
  eval_samples: 128
  micro_batch_size: 1
  block_size: 16384
  packed_token_cache_path: ${validation_token_cache_path}
  automodel:
    parallel: *qwen_one_node_mesh

build_library:
  source_checkpoint_dir: ${scoring_parent_dir}
  include_noops: false
  include_bypass: false

vllm_stats:
  enabled: true
  batch_sizes: [1]
  prefill_seq_len: 16384
  generation_seq_len: 4096
  runtime_stats:
    enabled: true
    backend: vllm
    granularity: block
    execution: inline
    include_noop_baselines: false
    num_iters: 5
    num_warmup_iters: 3
    max_num_seqs: 1
    topology:
      tensor_parallel_size: 1
      pipeline_parallel_size: 1
      prefill_context_parallel_size: 1
      decode_context_parallel_size: 1
      distributed_executor_backend: mp
      gpu_group_size: 1

replacement_scoring:
  granularity: subblock
  subblock_solutions_path: ${to_path:${puzzle_dir}/single_subblock_replacement_solutions.json}
  subblock_output_dir: ${puzzle_dir}/single_subblock_replacement_solutions--validation
  eval_samples: 128
  micro_batch_size: 1
  block_size: 16384
  packed_token_cache_path: ${validation_token_cache_path}
  source_checkpoint_dir: ${scoring_parent_dir}
  target_teacher_dir: ${scoring_parent_dir}
  automodel:
    force_hf: false
    parallel: *qwen_one_node_mesh
    lm_head_backend: flash_kld
    flash_kld_token_chunk_size: 1024
    flash_kld_reduction_backend: fla
    gdn_cp_backend: replicated_exact
  distributed_eval:
    gpus_per_task: 1

  default_metric: normalized_mse_loss_hidden_states

mip:
  depth_trajectory_path: ${puzzle_dir}/depth/iterative/trajectory.json
  depth_scenario_count: 7
  score_granularity: subblock
  single_block_replacement_validation_dir: ${to_path:${replacement_scoring.subblock_output_dir}}
  canonical_solutions_path: ${to_path:${replacement_scoring.block_solutions_path}}
  human_constraints:
    target_latency_ratio: 0.75
  latency_constraint_profiles: [0.75]
  grid_budgeting:
    enabled: false

realize_model:
  skip_validation: false
  eval_samples: 128
  micro_batch_size: 1
  block_size: 16384
  packed_token_cache_path: ${validation_token_cache_path}
  automodel:
    force_hf: false
    parallel: *qwen_one_node_mesh
    lm_head_backend: flash_kld
    flash_kld_token_chunk_size: 1024

zero_shot_evaluation:
  enabled: true
  eval_samples: 128
  block_size: 16384
  packed_token_cache_path: ${validation_token_cache_path}

global_distillation_sanity:
  enabled: true
  profile_id: latency-095
  sample_count: 8
  sequence_length: 16384
  packed_token_cache_path: ${train_token_cache_path}
  max_steps: 128
  local_batch_size: 8
  lr: 1.0e-4
  automodel:
    parallel:
      tp: 1
      cp: 1
      pp: 8
      ep: 1
      dp_shard: 1
      dp_replicate: 1
      sequence_parallel: false
      pipeline_schedule: 1f1b

aiperf:
  enabled: true
  executable: aiperf
  checkpoint_source: scenario_grid
  endpoint_type: completions
  use_server_token_count: true
  input_tokens: 16384
  output_tokens: 4096
  concurrency: [1, 4, 16, 64]
  minimum_request_count: 4
  requests_per_concurrency: 2
  seed: 42
  topology:
    tensor_parallel_size: 1
    pipeline_parallel_size: 2
    prefill_context_parallel_size: 1
    decode_context_parallel_size: 1
    distributed_executor_backend: mp
    gpu_group_size: 2

global_distillation:
  enabled: true
  selection: best_evaluation
  evaluation_summary_path: ${puzzle_dir}/artifacts/zero_shot_evaluation/evaluation_summary.json
  backend: automodel
  automodel:
    activation_checkpointing: true
    parallel: *qwen_one_node_mesh
  force_hf: false
  domain: llm
  global_batch_size: 16
  local_batch_size: 2
  max_steps: 256
  validation_enabled: false
  resume: true
  freeze_policy: projector_and_language
  objective:
    main_ce: 0.25
    main_kd: {weight: 0.25, metric: kld, temperature: 1.0, chunk_size: 64}
    mtp_ce: 0.25
    mtp_kd: {weight: 0.25, metric: kld, temperature: 1.0, chunk_size: 64}
  metadata:
    llm:
      dataset:
        target: modelopt.torch.puzzletron.distillation.dataset.make_puzzletron_llm_dataset
        dataset_path: ${dataset_path}
        split: train
        num_samples: 4096
        seq_length: 16384
        packed_token_cache_path: ${train_token_cache_path}
        seed: 444
      dataloader:
        target: torchdata.stateful_dataloader.StatefulDataLoader
        shuffle: false
        collate_fn: modelopt.torch.puzzletron.distillation.dataset.collate_puzzletron_llm_batch
