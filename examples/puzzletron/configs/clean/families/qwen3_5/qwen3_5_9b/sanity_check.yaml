# @package _global_

defaults:
  - /families/qwen3_5/qwen3_5_9b/full_pipeline@_global_
  - _self_

# Keep this campaign independent from the full-pipeline run while retaining its
# model, data, and stage topology settings through the parent overlay.
puzzle_dir: ${oc.env:PUZZLETRON_RUN_ROOT,puzzle_runs}/qwen3_5/qwen3_5_9b/sanity_check
display_name: Qwen3.5-9B - Sanity Check

# Import these immutable bundles with import_campaign_artifacts.py before running
# the enabled stages. Bypass evidence is deliberately report-only.
artifact_import:
  source_root: ${oc.env:PUZZLETRON_RUN_ROOT,puzzle_runs}/qwen3_5/qwen3_5_9b/full_pipeline
  bundles: [width_importance, depth_importance, vllm_stats, replacement_scoring, bypass]
  bypass_evidence_report_only: true

sort_sanity:
  enabled: true
  include_reverse: true

width_sanity:
  enabled: true
  single_load_parent_sweep: true
  one_case_per_axis: false
  target_count_per_axis: 2
  layer_count: 2
  layer_selection: random
  ratios: [0.875, 0.75]
  comparison_tolerance: 1.0e-5
  physical_realization: true
  hidden_width_diagnostic: true

bypass_sanity:
  enabled: true

bypass:
  enabled: false
  granularity: subblock
  overfit:
    repetitions: 128
    modes: [smallest_fixed, diverse_resampled]
    learning_rate: 3.0e-4
    grad_accumulation_steps: 1
  automodel:
    parallel:
      tp: 1
      cp: 1
      pp: 8
      ep: 1
      dp_shard: 1
      dp_replicate: 1
      sequence_parallel: false
      pipeline_schedule: 1f1b
  training:
    micro_batch_size: 8
    val_micro_batch_size: 8
    grad_accumulation_steps: 1
    learning_rate: 3.0e-4

depth_importance:
  enabled: true

# Select the standalone vLLM-statistics DAG node rather than relying only on
# build-library's inline collection.
vllm_stats:
  enabled: true

build_library:
  enabled: true

replacement_scoring:
  enabled: true

mip:
  enabled: true

zero_shot_evaluation:
  enabled: true

aiperf:
  enabled: true
  num_best_to_eval: 2

global_distillation_sanity:
  enabled: true

global_distillation:
  enabled: false
  num_best_to_distill: 1

post_distillation_evaluation:
  enabled: false
