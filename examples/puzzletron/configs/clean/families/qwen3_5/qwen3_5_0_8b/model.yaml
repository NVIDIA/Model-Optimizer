# @package _global_

input_hf_model_path: Qwen/Qwen3.5-0.8B

model_info:
  hf_repo: Qwen/Qwen3.5-0.8B
  model_type: qwen3_5_text
  architectures: [Qwen3_5ForConditionalGeneration]
  num_hidden_layers: 24
  hidden_size: 1024
  intermediate_size: 3584
  num_attention_heads: 8
  num_key_value_heads: 2
  head_dim: 256
  vocab_size: 248320
  tie_word_embeddings: true
  layer_counts:
    linear_attention: 18
    full_attention: 6
  mamba:
    linear_key_head_dim: 128
    linear_value_head_dim: 128
    linear_num_key_heads: 16
    linear_num_value_heads: 16
    linear_conv_kernel_dim: 4

pruning:
  intermediate_size_list: [896, 1792, 2688]
  attn_heads_list: [[4, 1], [2, 2], [4, 2], [6, 2]]

search_space:
  axes:
    ffn_intermediate:
      enabled: true
      teacher_value: 3584
      values: ${pruning.intermediate_size_list}
    kv_groups:
      enabled: true
      teacher_value: 2
      values: [1]
    q_heads_per_group:
      enabled: true
      teacher_value: 4
      values: [1, 2, 3]
    gdn_key_groups:
      enabled: true
      teacher_value: 16
      values: [4, 8, 12]
    gdn_value_heads_per_group:
      enabled: false
      teacher_value: 1
      values: []
      note: Qwen3.5-0.8B has one value head per key group, so this axis has no legal smaller value.
    gdn_key_head_dim:
      enabled: true
      teacher_value: 128
      values: [32, 64, 96]
    gdn_value_head_dim:
      enabled: true
      teacher_value: 128
      values: [32, 64, 96]
