# @package _global_

defaults:
  - /base@_global_
  - /families/qwen3_5/family@_global_
  - /families/qwen3_5/qwen3_5_0_8b/model@_global_
  - _self_

puzzle_dir: ${puzzle_root}/qwen3_5/qwen3_5_0_8b/native_smoke_test

model:
  force_hf: false

pruning:
  experiment_id: native_smoke_test
  eval_samples: 8
  micro_batch_size: 1
  block_size: 4096

vllm_stats:
  prefill_seq_len: 512
  generation_seq_len: 128
  runtime_stats:
    num_iters: 1
    num_warmup_iters: 0

replacement_scoring:
  eval_samples: 4
  micro_batch_size: 1

mip:
  human_constraints:
    num_params_ratio: 0.85
  grid_budgeting:
    enabled: true
    param_ratios: [0.85, 0.9]
