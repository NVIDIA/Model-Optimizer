# @package _global_

defaults:
  - /base@_global_
  - /families/qwen3_5/family@_global_
  - /families/qwen3_5/qwen3_6_27b/model@_global_
  - _self_

puzzle_dir: ${puzzle_root}/qwen3_5/qwen3_6_27b/real_run

model:
  force_hf: true

data:
  layout: fixed
  max_sample_length: 32768
  packing: null

pruning:
  experiment_id: real_run
  eval_samples: 16384
  micro_batch_size: 8
  block_size: 32768

vllm_stats:
  prefill_seq_len: 2048
  generation_seq_len: 30000
  runtime_stats:
    num_iters: 1
    num_warmup_iters: 0
    repeat_block_n_times: 2
    max_num_seqs: 1
    vllm_args:
      - "--attention-config.use_prefill_decode_attention=true"

replacement_scoring:
  eval_samples: 16
  micro_batch_size: 1
  block_size: 32768
  automodel:
    chunk_size: 32768

bypass:
  enabled: true
  elastic: true
  data:
    block_size: 32768
    max_eval_samples: 16384
  training:
    training_tokens: 536870912
    micro_batch_size: 1
    val_micro_batch_size: 1
    learning_rate: 1e-4
    grad_accumulation_steps: 1
  model_factory:
    keys_to_learn: entire_block
  model:
    model_config_overrides: {}

mip:
  human_constraints:
    num_params_ratio: 0.85
  grid_budgeting:
    enabled: true
    param_ratios: [0.85, 0.9]
