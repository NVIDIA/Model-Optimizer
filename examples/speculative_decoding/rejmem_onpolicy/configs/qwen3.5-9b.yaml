# On-policy rejection-memory training of the Qwen3.5-9B DFlash drafter (see ../README.md).
# A ModelOpt DFlash recipe, with the drafter keys of the SFT recipe that trained the initial export,
# plus the `onpolicy` section. Paths are container paths, mounted by launch/onpolicy.sbatch.
metadata:
  description: On-policy rejection-memory DFlash training on Qwen3.5-9B rollouts.
model:
  model_name_or_path: /model
  use_fake_base_for_offline: true
training:
  output_dir: /out
  max_steps: 1000
  per_device_train_batch_size: 2
  learning_rate: 1.0e-4
  warmup_steps: 20
  lr_scheduler_type: constant_with_warmup
  training_seq_len: 4096
  logging_steps: 1
  save_steps: 50
  save_total_limit: 3
  weight_decay: 0.0
  bf16: true
  tf32: true
  ddp_find_unused_parameters: true
  ddp_timeout: 1800
dflash:
  dflash_init_checkpoint: /draft0
  dflash_block_size: 16
  dflash_num_anchors: 256
  dflash_use_torch_compile: true
  dflash_self_logit_distillation: true
  dflash_loss_objective: dpace
  dflash_dpace_alpha: 0.5
  dflash_mask_token_id: 248077
  dflash_use_flex_attention: true
  dflash_swa_window_size: 2048
  dflash_architecture_config:
    num_hidden_layers: 5
    intermediate_size: 12288
    num_attention_heads: 32
    num_key_value_heads: 8
    head_dim: 128
    target_layer_ids: [1, 5, 9, 13, 17, 21, 25, 29]
onpolicy:
  # Deployment regime. T=0: temperature 0 (and draft_sample_method greedy for a greedy deployment).
  memory: true
  num_speculative_tokens: 15
  draft_sample_method: probabilistic
  sampling:
    temperature: 1.0
    top_p: 1.0
    top_k: 0
    min_p: 0.0
    presence_penalty: 0.0
    frequency_penalty: 0.0
    repetition_penalty: 1.0
  data_dir: /data
  max_prompt_len: 2048
  prompts_per_step: 16
  # Appended to what `rollout.py serve` always sets (speculative config, rejmem extension, prefix
  # caching off, IPC weight transfer, 127.0.0.1 only). max_num_seqs x (1 + NS) must fit the
  # batched-token budget.
  server_args: [--gpu-memory-utilization, "0.85", --max-num-seqs, "64", --seed, "0"]
