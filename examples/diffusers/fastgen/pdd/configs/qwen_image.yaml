# Qwen-Image PDD training recipe.

seed: 42

model:
  pretrained_model_name_or_path: Qwen/Qwen-Image
  revision: 75e0b4be04f60ec59a75f475837eced720f823b6
  torch_dtype: bfloat16
  device: cuda
  transformer_engine_linear: false
  peft:
  guidance_embeds: false
  # Accepted by the composition path, but disabled until the pinned Diffusers Qwen API
  # performs an effective fusion rather than its current no-op.
  fuse_qkv_projections: false

pdd:
  pred_type: flow
  num_train_timesteps:
  guidance_scale: 4.0
  student_sample_steps: 4
  student_sample_type: ode
  grid_size: 128
  grid_max_t: 0.999
  flow_shift: 5.0
  block_size_min: 4
  block_size_max: 64
  teacher_integrator: euler
  inference_blocks: [32, 32, 32, 32]
  data_free: false

optim:
  learning_rate: 5.0e-5
  optimizer:
    _target_: torch.optim.AdamW
    weight_decay: 0.01
    betas: [0.9, 0.999]
    eps: 1.0e-8
    amsgrad: false
    capturable: false
    differentiable: false
    foreach: false
    fused: false
    maximize: false

lr_scheduler:
  lr_decay_style: constant
  lr_warmup_steps: 0
  min_lr: 5.0e-5

step_scheduler:
  max_steps: 10000
  num_epochs: 200
  log_every: 10
  ckpt_every_steps: 1000
  local_batch_size: 4
  save_checkpoint_every_epoch: false
  global_batch_size:

training_health:
  max_grad_norm: 1.0
  zero_grad_warmup_steps: 0

validation:
  count: 2000
  seed: 2026
  split_seed: 2026
  every_steps: 1000

fsdp:
  dp_size:
  tp_size: 1
  cp_size: 1
  pp_size: 1
  ep_size: 1
  activation_checkpointing: true

data:
  dataloader:
    _target_: fastgen_data.build_text_to_image_multiresolution_dataloader
    cache_dir: data/qwen_image_cache
    base_resolution: [1024, 1024]
    batch_size: 4
    drop_last: true
    shuffle: true
    dynamic_batch_size: false
    # Cursor-exact resume does not require hashes. Set true to authenticate every payload.
    verify_payload_hashes: false
    negative_prompt_embedding_path: negative_prompt_embedding.pt

checkpoint:
  enabled: true
  checkpoint_dir: checkpoints/pdd_qwen_image
  model_save_format: torch_save
  save_consolidated: false
  restore_from: LATEST
